/* LOOP */
function update(dt){
    if(!gameRunning||paused||waitingForPassive)return;
    // dt нормализован к кадрам ~16.67 мс → реальное время в секундах
    gameTimer+=(dt*16.6667)/1000;
    updatePlayer(dt);
    updateSpawnQueue(dt);
    updateEnemies(dt);
    updateTearPuddles(dt);
    updateBullets(dt);
    updateEnemyBullets(dt);
    updateParticles(dt);
    updateDoor();
    updateHUD();
    checkWaveComplete();
}

function updateTearPuddles(dt){
    for(let i=tearPuddles.length-1;i>=0;i--){
        const p=tearPuddles[i];
        p.life-=dt;
        if(p.life<=0){tearPuddles.splice(i,1);continue}
        if(player.invincible<=0 && circleHit(player,p)){
            hurtPlayer(0.5);
            player.slowTimer=90; // 1.5 сек −15% скорости
        }
    }
}

function drawTearPuddles(){
    for(const p of tearPuddles){
        const a=clamp(p.life/p.maxLife,0,1);
        ctx.save();
        ctx.globalAlpha=0.25+0.35*a;
        ctx.fillStyle="#7ec8e8";
        ctx.beginPath();ctx.ellipse(p.x,p.y+2,p.radius*1.15,p.radius*0.7,0,0,7);ctx.fill();
        ctx.globalAlpha=0.15+0.25*a;
        ctx.fillStyle="#b8e4f8";
        ctx.beginPath();ctx.ellipse(p.x-2,p.y,p.radius*0.55,p.radius*0.35,0,0,7);ctx.fill();
        ctx.restore();
    }
}

function drawPickups(){
    for(const p of pickups){
        if(p.taken)continue;
        p.bob+=0.08;
        const by=p.y+Math.sin(p.bob)*4;
        shadowCircle(p.x,by,14,.35);

        // мягкое свечение вокруг баффа
        const aura=ctx.createRadialGradient(p.x,by,4,p.x,by,22);
        const ac=p.type==="pill"?"255,100,120":p.type==="cookie"?"255,200,120":p.type==="medkit"?"80,220,120":p.type==="eye"?"180,220,255":p.type==="cola"?"255,90,70":p.type==="mirror"?"200,220,240":p.type==="shield"?"90,50,130":p.type==="magnet"?"80,120,220":p.type==="hat"?"255,80,120":p.type==="tentacle"?"180,80,160":p.type==="sock"?"220,190,120":p.type==="rubik"?"255,180,60":"100,180,255";
        aura.addColorStop(0,`rgba(${ac},0.35)`);
        aura.addColorStop(1,`rgba(${ac},0)`);
        ctx.fillStyle=aura;
        ctx.beginPath();ctx.arc(p.x,by,22,0,7);ctx.fill();

        ctx.save();
        ctx.translate(p.x,by);

        if(p.type==="pill"){
            // red-white pill
            ctx.rotate(-0.3);
            ctx.fillStyle="#e8e8e8";
            ctx.beginPath();ctx.ellipse(0,0,12,7,0,0,7);ctx.fill();
            ctx.fillStyle="#e84b5b";
            ctx.beginPath();ctx.ellipse(-1,0,12,7,0,Math.PI/2,Math.PI*1.5);ctx.fill();
            ctx.strokeStyle="#333";ctx.lineWidth=1.5;
            ctx.beginPath();ctx.ellipse(0,0,12,7,0,0,7);ctx.stroke();
            // split line
            ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,7);ctx.stroke();
        }else if(p.type==="cookie"){
            // cookie
            ctx.fillStyle="#d4a574";
            ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
            ctx.strokeStyle="#a67c52";ctx.lineWidth=2;ctx.stroke();
            // chocolate chips
            ctx.fillStyle="#4a2c1a";
            [[-5,-4],[4,-3],[-3,5],[5,4],[0,0]].forEach(([cx,cy])=>{
                ctx.beginPath();ctx.arc(cx,cy,2.2,0,7);ctx.fill();
            });
        }else if(p.type==="medkit"){
            // medkit
            ctx.fillStyle="#2d8f4e";
            ctx.beginPath();ctx.roundRect(-11,-9,22,18,4);ctx.fill();
            ctx.strokeStyle="#1a5c32";ctx.lineWidth=2;ctx.stroke();
            // white cross
            ctx.fillStyle="#fff";
            ctx.fillRect(-2,-7,4,14);
            ctx.fillRect(-7,-2,14,4);
        }else if(p.type==="shield"){
            // тёмно-фиолетовая / тенистая сфера (щит)
            const sg=ctx.createRadialGradient(-4,-5,2,0,0,14);
            sg.addColorStop(0,"#6a4088");
            sg.addColorStop(0.45,"#3a2048");
            sg.addColorStop(0.8,"#221028");
            sg.addColorStop(1,"#140818");
            ctx.fillStyle=sg;
            ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();
            ctx.strokeStyle="#4a2a5e";ctx.lineWidth=2;ctx.stroke();
            // внутреннее кольцо
            ctx.strokeStyle="rgba(100,60,140,0.5)";ctx.lineWidth=1.5;
            ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.stroke();
            // блик
            ctx.fillStyle="rgba(180,140,220,0.35)";
            ctx.beginPath();ctx.ellipse(-4,-5,4,3, -0.4,0,7);ctx.fill();
            // ядро
            ctx.fillStyle="rgba(60,30,80,0.7)";
            ctx.beginPath();ctx.arc(1,2,4,0,7);ctx.fill();
        }else if(p.type==="eye"){
            // круглое глазное яблоко
            // белок
            ctx.fillStyle="#f4f0e8";
            ctx.beginPath();ctx.arc(0,0,12.5,0,7);ctx.fill();
            ctx.strokeStyle="#2a2230";ctx.lineWidth=2.2;ctx.stroke();
            // радужка
            ctx.fillStyle="#4a9fd8";
            ctx.beginPath();ctx.arc(0,0,6.5,0,7);ctx.fill();
            // зрачок
            ctx.fillStyle="#1a1020";
            ctx.beginPath();ctx.arc(0,0,3.2,0,7);ctx.fill();
            // блик
            ctx.fillStyle="#fff";
            ctx.beginPath();ctx.arc(-3.5,-3.5,2.2,0,7);ctx.fill();
            ctx.beginPath();ctx.arc(2.5,2,1.1,0,7);ctx.fill();
        }else if(p.type==="cola"){
            // коричневая бутылка с красной этикеткой
            ctx.fillStyle="#6b3a1f";
            ctx.beginPath();
            ctx.moveTo(-6,10);
            ctx.lineTo(-7,2);
            ctx.quadraticCurveTo(-7.5,-6,-5,-10);
            ctx.lineTo(5,-10);
            ctx.quadraticCurveTo(7.5,-6,7,2);
            ctx.lineTo(6,10);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle="#3d2110";ctx.lineWidth=1.5;ctx.stroke();
            // горлышко
            ctx.fillStyle="#5a3018";
            ctx.beginPath();ctx.roundRect(-2.5,-14,5,5,1);ctx.fill();
            // крышка
            ctx.fillStyle="#c02820";
            ctx.beginPath();ctx.roundRect(-3,-16.5,6,3,1);ctx.fill();
            // красная этикетка (без текста)
            ctx.fillStyle="#d32f2f";
            ctx.beginPath();ctx.roundRect(-6.5,-2,13,8,2);ctx.fill();
            ctx.strokeStyle="#8b1a12";ctx.lineWidth=1;ctx.stroke();
            // блик на стекле
            ctx.fillStyle="rgba(255,220,180,0.25)";
            ctx.beginPath();ctx.ellipse(-3,-4,2,6,0,0,7);ctx.fill();
        }else if(p.type==="mirror"){
            // зеркало — овальная рамка с отражающей поверхностью
            // рамка
            ctx.fillStyle="#8a9aaa";
            ctx.strokeStyle="#3a4550";ctx.lineWidth=2;
            ctx.beginPath();ctx.ellipse(0,0,11,13,0,0,7);ctx.fill();ctx.stroke();
            // стекло / отражение
            const mg=ctx.createLinearGradient(-7,-10,7,10);
            mg.addColorStop(0,"#e8f0f8");
            mg.addColorStop(0.35,"#b8d0e8");
            mg.addColorStop(0.6,"#d0e4f4");
            mg.addColorStop(1,"#90a8c0");
            ctx.fillStyle=mg;
            ctx.beginPath();ctx.ellipse(0,0,8,10,0,0,7);ctx.fill();
            // блик
            ctx.fillStyle="rgba(255,255,255,0.55)";
            ctx.beginPath();
            ctx.ellipse(-2.5,-2,2.2,5.5,-0.25,0,7);
            ctx.fill();
            // тонкая внутренняя обводка
            ctx.strokeStyle="rgba(40,50,60,0.4)";ctx.lineWidth=1;
            ctx.beginPath();ctx.ellipse(0,0,8,10,0,0,7);ctx.stroke();
        }else if(p.type==="magnet"){
            // подковообразный сине-красный магнит
            ctx.save();
            ctx.rotate(-0.15);
            // левая (синяя) ножка
            ctx.fillStyle="#3a6ad4";
            ctx.beginPath();
            ctx.moveTo(-10,10);
            ctx.lineTo(-10,-2);
            ctx.quadraticCurveTo(-10,-12,-2,-12);
            ctx.lineTo(-2,-6);
            ctx.quadraticCurveTo(-5,-6,-5,-2);
            ctx.lineTo(-5,10);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle="#1a3a8a";ctx.lineWidth=1.5;ctx.stroke();
            // правая (красная) ножка
            ctx.fillStyle="#d43a4a";
            ctx.beginPath();
            ctx.moveTo(10,10);
            ctx.lineTo(10,-2);
            ctx.quadraticCurveTo(10,-12,2,-12);
            ctx.lineTo(2,-6);
            ctx.quadraticCurveTo(5,-6,5,-2);
            ctx.lineTo(5,10);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle="#8a1a28";ctx.lineWidth=1.5;ctx.stroke();
            // перемычка сверху (градиент синий→красный)
            const magG=ctx.createLinearGradient(-8,-12,8,-12);
            magG.addColorStop(0,"#3a6ad4");
            magG.addColorStop(1,"#d43a4a");
            ctx.fillStyle=magG;
            ctx.beginPath();
            ctx.moveTo(-2,-12);
            ctx.quadraticCurveTo(0,-15,2,-12);
            ctx.lineTo(2,-6);
            ctx.lineTo(-2,-6);
            ctx.closePath();
            ctx.fill();
            // блики на полюсах
            ctx.fillStyle="rgba(255,255,255,0.35)";
            ctx.beginPath();ctx.roundRect(-8.5,2,3,6,1);ctx.fill();
            ctx.beginPath();ctx.roundRect(5.5,2,3,6,1);ctx.fill();
            // буквы N / S (упрощённо — полоски)
            ctx.fillStyle="#fff";
            ctx.fillRect(-7.5,4,1.5,3);
            ctx.fillRect(6,4,1.5,3);
            ctx.restore();
        }else if(p.type==="hat"){
            // спиральный праздничный колпачок
            // основание
            ctx.fillStyle="#2a2030";
            ctx.beginPath();ctx.ellipse(0,10,11,4,0,0,7);ctx.fill();
            // конус с полосками
            const stripes=["#e84b5b","#f5f0e8","#4a9fd8","#f5f0e8","#e84b5b"];
            for(let i=0;i<5;i++){
                const t0=i/5, t1=(i+1)/5;
                const y0=10-t0*24, y1=10-t1*24;
                const w0=11*(1-t0*0.85), w1=11*(1-t1*0.85);
                ctx.fillStyle=stripes[i];
                ctx.beginPath();
                ctx.moveTo(-w0,y0);
                ctx.lineTo(w0,y0);
                ctx.lineTo(w1,y1);
                ctx.lineTo(-w1,y1);
                ctx.closePath();
                ctx.fill();
            }
            // контур конуса
            ctx.strokeStyle="#1a1520";ctx.lineWidth=1.5;
            ctx.beginPath();
            ctx.moveTo(-11,10);
            ctx.lineTo(0,-14);
            ctx.lineTo(11,10);
            ctx.stroke();
            // помпон наверху
            ctx.fillStyle="#ff6b8a";
            ctx.beginPath();ctx.arc(0,-15,4,0,7);ctx.fill();
            ctx.fillStyle="#fff";
            ctx.beginPath();ctx.arc(-1.2,-16,1.4,0,7);ctx.fill();
            // спиральная лента
            ctx.strokeStyle="#ffd76a";ctx.lineWidth=1.8;ctx.lineCap="round";
            ctx.beginPath();
            for(let i=0;i<=20;i++){
                const t=i/20;
                const ang=t*Math.PI*3.5;
                const rr=9*(1-t*0.9);
                const yy=8-t*20;
                const xx=Math.cos(ang)*rr*0.35;
                if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
            }
            ctx.stroke();
        }else if(p.type==="tentacle"){
            // конец щупальца осьминога — розовый, с присосками
            const skin="#e878b0", skinMid="#d45a98", skinDark="#a03870", sucker="#f5c0d8", suckerIn="#c04080";
            ctx.save();
            ctx.rotate(-0.4);
            // основное тело щупальца (сужается к кончику)
            ctx.fillStyle=skin;
            ctx.strokeStyle=skinDark;ctx.lineWidth=2;
            ctx.beginPath();
            ctx.moveTo(-5,12);
            ctx.bezierCurveTo(-8,4,-7,-4,-3,-10);
            ctx.quadraticCurveTo(0,-14,4,-11);
            ctx.bezierCurveTo(8,-6,7,2,5,10);
            ctx.quadraticCurveTo(2,14,-5,12);
            ctx.closePath();
            ctx.fill();ctx.stroke();
            // градиентная «тень» с одной стороны
            ctx.fillStyle="rgba(160,50,110,0.25)";
            ctx.beginPath();
            ctx.moveTo(-3,10);
            ctx.bezierCurveTo(-6,2,-5,-4,-1,-9);
            ctx.quadraticCurveTo(1,-6,0,2);
            ctx.quadraticCurveTo(-1,8,-3,10);
            ctx.closePath();
            ctx.fill();
            // блик
            ctx.fillStyle="rgba(255,220,240,0.4)";
            ctx.beginPath();
            ctx.ellipse(2,-2,2.5,7,0.15,0,7);
            ctx.fill();
            // ряд присосок (крупнее у основания)
            const suckers=[[-2,8,2.6],[-3,3,2.4],[-2.5,-2,2.2],[-1,-6,1.9],[1,-10,1.5]];
            for(const [sx,sy,sr] of suckers){
                ctx.fillStyle=sucker;
                ctx.beginPath();ctx.arc(sx,sy,sr,0,7);ctx.fill();
                ctx.strokeStyle=skinDark;ctx.lineWidth=1.2;ctx.stroke();
                ctx.fillStyle=suckerIn;
                ctx.beginPath();ctx.arc(sx,sy,sr*0.45,0,7);ctx.fill();
            }
            // кончик
            ctx.fillStyle=skinMid;
            ctx.beginPath();ctx.ellipse(2.5,-12,3,2.2,0.3,0,7);ctx.fill();
            ctx.strokeStyle=skinDark;ctx.lineWidth=1.2;ctx.stroke();
            ctx.restore();
        }else if(p.type==="sock"){
            // классический кремовый носок: голенище = ширина манжеты, без утолщения слева
            ctx.save();
            ctx.rotate(-0.12);
            const body="#f3e6c8", outline="#5a4a38";
            // голенище ровно по ширине манжеты (−5.5 … 5.5)
            ctx.fillStyle=body;
            ctx.strokeStyle=outline;ctx.lineWidth=1.8;ctx.lineJoin="round";ctx.lineCap="round";
            ctx.beginPath();
            ctx.moveTo(-5.5,-8);
            ctx.lineTo(5.5,-8);
            // передняя сторона вниз
            ctx.lineTo(5.5,2);
            // плавный переход к стопе/мыску (вправо)
            ctx.quadraticCurveTo(7,7, 12,10);
            ctx.quadraticCurveTo(15,12, 13.5,14);
            ctx.quadraticCurveTo(12,16, 8,15.5);
            // подошва
            ctx.lineTo(-3,15.5);
            // небольшая пятка, без расширения голенища
            ctx.quadraticCurveTo(-5.5,15, -5.5,12);
            // задняя сторона голенища строго вертикально
            ctx.lineTo(-5.5,-8);
            ctx.closePath();
            ctx.fill();ctx.stroke();
            // белая рубчатая манжета (та же ширина)
            ctx.fillStyle="#faf8f4";
            ctx.beginPath();
            ctx.roundRect(-5.5,-14,11,6.5,2.2);
            ctx.fill();
            ctx.strokeStyle=outline;ctx.lineWidth=1.4;ctx.stroke();
            // рубчики манжеты
            ctx.strokeStyle="#d4cbb8";ctx.lineWidth=1;
            for(let i=0;i<4;i++){
                const xx=-3.5+i*2.5;
                ctx.beginPath();ctx.moveTo(xx,-12.8);ctx.lineTo(xx,-9);ctx.stroke();
            }
            // красная полоска
            ctx.strokeStyle="#e84b5b";ctx.lineWidth=2.4;ctx.lineCap="butt";
            ctx.beginPath();ctx.moveTo(-4.5,-4.5);ctx.lineTo(4.5,-4.5);ctx.stroke();
            // синяя полоска
            ctx.strokeStyle="#4a9fd8";ctx.lineWidth=2.4;
            ctx.beginPath();ctx.moveTo(-4.5,-1.2);ctx.lineTo(4.5,-1.2);ctx.stroke();
            // блик
            ctx.fillStyle="rgba(255,255,255,0.35)";
            ctx.beginPath();ctx.ellipse(1.2,-2,1.5,3.5,0.05,0,7);ctx.fill();
            ctx.restore();
        }else if(p.type==="rubik"){
            // аккуратный изометрический кубик (компактный, ровные грани)
            ctx.save();
            const topC=["#fff","#ffcf00","#c41e3a","#009b48","#fff","#0051ba","#ff5800","#ffcf00","#fff"];
            const leftC=["#009b48","#c41e3a","#ffcf00","#fff","#009b48","#0051ba","#ff5800","#c41e3a","#fff"];
            const rightC=["#0051ba","#fff","#ff5800","#ffcf00","#0051ba","#c41e3a","#fff","#009b48","#ffcf00"];
            const Rx=4.2, Ry=2.4, Lx=-4.2, Ly=2.4, Dy=4.6;
            const Ox=0, Oy=-8;
            function P(i,j,k){return {x:Ox+i*Rx+j*Lx, y:Oy+i*Ry+j*Ly+k*Dy}}
            function cell(a,b,c,d,col){
                ctx.beginPath();
                ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y);ctx.lineTo(d.x,d.y);
                ctx.closePath();
                ctx.fillStyle=col;ctx.fill();
                ctx.strokeStyle="#1a1a1a";ctx.lineWidth=1;ctx.lineJoin="round";ctx.stroke();
            }
            // правая грань ← нижнее левое ребро верха (j=3)
            for(let i=0;i<3;i++) for(let k=0;k<3;k++)
                cell(P(i,3,k),P(i+1,3,k),P(i+1,3,k+1),P(i,3,k+1), rightC[k*3+i]);
            // левая грань ← нижнее правое ребро верха (i=3)
            for(let j=0;j<3;j++) for(let k=0;k<3;k++)
                cell(P(3,j,k),P(3,j+1,k),P(3,j+1,k+1),P(3,j,k+1), leftC[k*3+j]);
            // верх (поверх)
            for(let i=0;i<3;i++) for(let j=0;j<3;j++)
                cell(P(i,j,0),P(i+1,j,0),P(i+1,j+1,0),P(i,j+1,0), topC[i*3+j]);
            ctx.restore();
        }
        ctx.restore();
    }
}

function drawBeam(){
    if(!player.beamActive||!player.hasPill)return;
    const dx=player.faceX,dy=player.faceY;
    const startX=player.x+dx*20;
    const startY=player.y+dy*20;
    const endX=player.beamEndX!=null?player.beamEndX:startX+dx*280;
    const endY=player.beamEndY!=null?player.beamEndY:startY+dy*280;

    ctx.save();
    ctx.lineCap="round";
    // soft outer glow — теперь зелёный под новый персонаж
    ctx.strokeStyle="rgba(125,255,74,0.18)";
    ctx.lineWidth=22;
    ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(endX,endY);ctx.stroke();
    // mid glow
    ctx.strokeStyle="rgba(168,255,112,0.4)";
    ctx.lineWidth=12;
    ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(endX,endY);ctx.stroke();
    // main beam
    ctx.strokeStyle="rgba(200,255,150,0.85)";
    ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(endX,endY);ctx.stroke();
    // bright core
    ctx.strokeStyle="#fff";
    ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(endX,endY);ctx.stroke();
    // tip impact on wall
    ctx.shadowColor="#7dff4a";ctx.shadowBlur=14;
    ctx.fillStyle="rgba(220,255,180,0.95)";
    ctx.beginPath();ctx.arc(endX,endY,5,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
}

function drawDoor(){
    if(!door.open)return;
    const x=door.x,y=door.y,w=door.w,h=door.h;
    const cyan=!!door.cyan;
    const yellow=!!door.yellow&&!cyan;
    const green=!!door.green&&!yellow&&!cyan;
    ctx.fillStyle=cyan?"#060e14":yellow?"#100e06":green?"#061008":"#0a0810";
    ctx.beginPath();
    ctx.moveTo(x-w/2,y+h/2);
    ctx.lineTo(x-w/2,y-h/2+8);
    ctx.quadraticCurveTo(x,y-h/2-6,x+w/2,y-h/2+8);
    ctx.lineTo(x+w/2,y+h/2);
    ctx.closePath();
    ctx.fill();

    const g=ctx.createLinearGradient(x,y-h,x,y+h);
    if(cyan){
        g.addColorStop(0,"rgba(60,180,255,0.55)");
        g.addColorStop(1,"rgba(60,180,255,0)");
    }else if(yellow){
        g.addColorStop(0,"rgba(255,200,60,0.5)");
        g.addColorStop(1,"rgba(255,200,60,0)");
    }else if(green){
        g.addColorStop(0,"rgba(80,220,100,0.5)");
        g.addColorStop(1,"rgba(80,220,100,0)");
    }else{
        g.addColorStop(0,"rgba(157,78,221,0.45)");
        g.addColorStop(1,"rgba(157,78,221,0)");
    }
    ctx.fillStyle=g;
    ctx.fillRect(x-w/2+4,y-h/2,w-8,h+20);

    ctx.strokeStyle=cyan?"#40b0ff":yellow?"#f0c040":green?"#4ade80":"#9d4edd";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x-w/2,y+h/2);
    ctx.lineTo(x-w/2,y-h/2+8);
    ctx.quadraticCurveTo(x,y-h/2-6,x+w/2,y-h/2+8);
    ctx.lineTo(x+w/2,y+h/2);
    ctx.stroke();

    const pulse=0.3+0.3*Math.sin(gameTime*0.008);
    ctx.strokeStyle=cyan?`rgba(120,210,255,${pulse})`:yellow?`rgba(255,220,120,${pulse})`:green?`rgba(150,255,170,${pulse})`:`rgba(200,150,255,${pulse})`;
    ctx.lineWidth=2;
    ctx.strokeRect(x-w/2+6,y-h/2+4,w-12,h-4);
}

function draw(){
    drawBackground(gameTime);
    drawDoor();
    drawTearPuddles();
    drawParticles();
    drawPickups();

    for(const e of enemies)if(!e.dead)drawEnemy(e);

    drawBullets();
    drawBeam();
    drawPlayer();
}

function loop(now){
    let dt=clamp((now-lastTime)/16.6667,.25,2);
    lastTime=now;gameTime+=dt*16.6667;
    update(dt);draw();
    requestAnimationFrame(loop);
}

updateHP();
requestAnimationFrame(loop);
</script>
</body>
