<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DREAMER</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:#08070c;font-family:Arial,sans-serif;touch-action:none
}
body{display:flex;justify-content:center;align-items:center}
/* мобилка: как раньше — на всю высоту, ширина до 680px */
#game{
    position:relative;width:min(100vw,680px);height:100vh;
    overflow:hidden;background:#111019;
    transform-origin:center center;
    flex-shrink:0
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ПК: фиксированные пропорции + без джойстика/кнопок */
body.is-desktop #game{
    width:360px;height:640px
}
body.is-desktop #joystick,
body.is-desktop #shootButtons{display:none!important}
@media (hover:hover) and (pointer:fine){
    #joystick,#shootButtons{display:none!important}
}

/* HUD */
#hud{
    position:absolute;top:0;left:0;right:0;
    padding:calc(10px + env(safe-area-inset-top)) 12px 0;
    padding-left:58px;
    pointer-events:none;z-index:10
}
#topRow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel{
    background:rgba(12,10,18,.8);border:2px solid rgba(255,255,255,.11);
    border-radius:13px;box-shadow:0 5px 20px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.06)
}
#playerPanel{min-width:125px;padding:8px 10px}
#hp{display:flex;gap:6px;margin-bottom:5px;align-items:center}
/* слот: пустая база + HP снизу вверх горизонтальными третями + щит поверх */
.hslot{
    position:relative;width:26px;height:26px;margin:0 1px;flex-shrink:0
}
.hslot .heart{
    width:16px;height:16px;position:absolute;left:5px;bottom:4px;
    transform:rotate(-45deg);border-radius:3px
}
.hslot .heart:before,.hslot .heart:after{
    content:"";position:absolute;width:16px;height:16px;border-radius:50%
}
.hslot .heart:before{top:-8px}.hslot .heart:after{left:8px}
/* пустая подложка */
.hslot .heart.base{background:#3c2630;z-index:0}
.hslot .heart.base:before,.hslot .heart.base:after{background:#3c2630}
/* красное HP */
.hslot .heart.hp{background:#e84b5b;box-shadow:0 0 8px rgba(255,50,70,.35);z-index:1}
.hslot .heart.hp:before,.hslot .heart.hp:after{background:#e84b5b}
/* фиолетовый щит */
.hslot .heart.sh{background:#7a4a9e;box-shadow:0 0 10px rgba(120,70,180,.55);z-index:2}
.hslot .heart.sh:before,.hslot .heart.sh:after{background:#7a4a9e}
/* клип-слои: горизонтальный срез (overflow по высоте снизу вверх) */
.hslot .clip{
    position:absolute;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none
}
.hslot .clip.hp-full{height:100%;z-index:1}
.hslot .clip.hp-2{height:67%;z-index:1}
.hslot .clip.hp-1{height:33%;z-index:1}
.hslot .clip.hp-0{height:0;z-index:1}
/* щит: полный или левая половина (правая показывает HP) */
.hslot .clip.sh-full{height:100%;width:100%;z-index:2}
.hslot .clip.sh-half{height:100%;width:50%;z-index:2;overflow:hidden}
.hslot .clip.sh-half .heart{left:5px}
#shield{display:none}
#score{color:#e9e1e9;font-size:12px;font-weight:bold}
#wavePanel{width:145px;padding:8px 10px;text-align:right}
#waveTitle{color:#eee5ee;font-size:12px;font-weight:bold}
#waveNumber{color:#ffcf75;font-size:19px;font-weight:900}
#waveBar{margin-top:5px;height:6px;background:#2a2430;border-radius:10px;overflow:hidden}
#waveProgress{height:100%;width:0;background:linear-gradient(90deg,#9d4edd,#ff6b7d)}
#timer{color:#e9e1e9;font-size:12px;font-weight:bold;margin-top:6px;letter-spacing:0.5px}
#bossUI{
    position:absolute;left:16%;right:16%;top:86px;display:none;text-align:center;z-index:11
}
#bossName{color:#ff9c9c;font-size:12px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 5px #000}
#bossBar{height:10px;margin-top:5px;border:2px solid #39212c;background:#180e15;border-radius:10px;overflow:hidden}
#bossHealth{width:100%;height:100%;background:linear-gradient(90deg,#a51e3b,#ff5367)}

/* controls */
#joystick{
    position:absolute;z-index:20;left:22px;bottom:calc(24px + env(safe-area-inset-bottom));
    width:126px;height:126px;border-radius:50%;
    background:rgba(20,17,27,.7);border:3px solid rgba(255,255,255,.11);
    box-shadow:inset 0 0 25px #0008,0 8px 30px #0006
}
#stick{
    position:absolute;width:57px;height:57px;left:50%;top:50%;
    transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#77717c,#39343f 55%,#24202b);
    border:2px solid rgba(255,255,255,.15);box-shadow:0 5px 12px #0009
}
#shootButtons{
    position:absolute;z-index:20;right:19px;
    bottom:calc(24px + env(safe-area-inset-bottom));width:150px;height:150px
}
.shoot{
    position:absolute;width:50px;height:50px;border-radius:15px;
    border:2px solid rgba(255,255,255,.12);background:rgba(29,24,37,.88);
    color:#eee8ee;font-size:23px;font-weight:bold;box-shadow:0 5px 15px #0006
}
.shoot:active{transform:scale(.91);background:#453a4e}
#up{left:50px}#left{left:0;top:50px}#right{right:0;top:50px}#down{left:50px;bottom:0}

/* messages */
#waveMessage{
    position:absolute;z-index:15;left:50%;top:39%;
    transform:translate(-50%,-50%) scale(.8);opacity:0;
    color:#fff;text-align:center;font-size:29px;font-weight:900;
    text-shadow:0 3px 0 #241725,0 0 15px #fff4;
    transition:.35s;white-space:nowrap;pointer-events:none
}
#waveMessage.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* game over */
#gameOver{
    position:absolute;inset:0;z-index:50;display:none;
    align-items:center;justify-content:center;background:#050408c7;backdrop-filter:blur(4px)
}
#gameOverBox{
    width:80%;max-width:330px;padding:28px;text-align:center;background:#15111b;
    border:2px solid #49364e;border-radius:20px;box-shadow:0 15px 50px #000
}
#gameOverTitle{color:#ff6877;font-size:34px;font-weight:900;margin-bottom:10px}
#finalScore{color:#ddd4df;margin-bottom:20px}
#restart, #startBtn, #startClassic, #startHardcore, .menuBtn{
    border:0;padding:13px 28px;border-radius:12px;background:#8246a8;
    color:#fff;font-weight:900;font-size:15px;cursor:pointer;margin:6px 0
}
.menuBtn.secondary{background:#3a3048}
#startClassic, #startHardcore{
    display:block;width:100%;box-sizing:border-box
}
#startScreen{
    position:absolute;inset:0;z-index:60;display:flex;
    align-items:center;justify-content:center;background:#050408c7;backdrop-filter:blur(4px)
}
#startBox{
    width:80%;max-width:330px;padding:28px;text-align:center;background:#15111b;
    border:2px solid #49364e;border-radius:20px;box-shadow:0 15px 50px #000
}
#startTitle{color:#ff6877;font-size:34px;font-weight:900;margin-bottom:16px;letter-spacing:2px}
#pauseBtn{
    position:absolute;z-index:25;top:calc(10px + env(safe-area-inset-top));left:12px;
    width:42px;height:42px;border-radius:12px;
    border:2px solid rgba(255,255,255,.12);background:rgba(29,24,37,.88);
    color:#eee8ee;font-size:18px;font-weight:bold;cursor:pointer;
    box-shadow:0 5px 15px #0006;display:none;align-items:center;justify-content:center;
    pointer-events:auto
}
#pauseBtn:active{transform:scale(.91);background:#453a4e}
#passivePick{
    position:absolute;inset:0;display:none;z-index:30;
    background:rgba(4,3,8,.82);
    align-items:center;justify-content:center;flex-direction:column;
    padding:16px
}
#passivePick.show{display:flex}
#passiveTitle{
    color:#eee5ee;font-size:22px;font-weight:900;margin-bottom:18px;
    text-shadow:0 0 20px rgba(157,78,221,.5)
}
#passiveCards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:520px}
.pCard{
    width:200px;background:rgba(18,14,28,.95);
    border:2px solid rgba(255,255,255,.14);border-radius:16px;
    padding:16px 14px;cursor:pointer;text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
    transition:transform .15s,border-color .15s
}
.pCard:hover{transform:translateY(-4px);border-color:rgba(157,78,221,.7)}
.pCard .pIcon{
    width:72px;height:72px;margin:0 auto 12px;position:relative
}
.pCard .pName{color:#ffcf75;font-size:14px;font-weight:900;margin-bottom:8px}
.pCard .pDesc{color:#c8c0d0;font-size:12px;line-height:1.35;font-weight:600}
#pauseMenu{
    position:absolute;inset:0;z-index:55;display:none;
    align-items:center;justify-content:center;background:#050408c7;backdrop-filter:blur(4px)
}
#pauseBox{
    width:80%;max-width:330px;padding:28px;text-align:center;background:#15111b;
    border:2px solid #49364e;border-radius:20px;box-shadow:0 15px 50px #000
}
#pauseTitle{color:#ff6877;font-size:34px;font-weight:900;margin-bottom:18px}
#pauseBox .menuBtn{display:block;width:100%}
/* акт 2 — зелёная тема паузы / смерти */
#game.act2 #pauseBox,#game.act2 #gameOverBox{
    background:#111a14;border-color:#3d5a42
}
#game.act2 #pauseTitle,#game.act2 #gameOverTitle{color:#6dff8a}
#game.act2 #restart,#game.act2 #startBtn,#game.act2 #startClassic,#game.act2 #startHardcore,#game.act2 .menuBtn{background:#2d8a4a}
#game.act2 .menuBtn.secondary{background:#1e3a28}
#game.act2 #finalScore{color:#c8e0d0}
#game.act2 #pauseMenu,#game.act2 #gameOver{background:#040805c7}
#game.act2 #pauseBtn{background:rgba(20,40,28,.9);border-color:rgba(100,200,120,.2);color:#d0f0d8}
/* акт 3 — жёлтая тема */
#game.act3 #pauseBox,#game.act3 #gameOverBox{
    background:#1a1810;border-color:#6a5a30
}
#game.act3 #pauseTitle,#game.act3 #gameOverTitle{color:#ffd24a}
#game.act3 #restart,#game.act3 #startBtn,#game.act3 #startClassic,#game.act3 #startHardcore,#game.act3 .menuBtn{background:#b89020}
#game.act3 .menuBtn.secondary{background:#3a3018}
#game.act3 #finalScore{color:#e8e0c0}
#game.act3 #pauseMenu,#game.act3 #gameOver{background:#0a0804c7}
#game.act3 #pauseBtn{background:rgba(40,35,18,.9);border-color:rgba(220,180,60,.25);color:#f0e8c0}
/* акт 4 — голубая тема (финал) */
#game.act4 #pauseBox,#game.act4 #gameOverBox{
    background:#0e1820;border-color:#2a5a78
}
#game.act4 #pauseTitle,#game.act4 #gameOverTitle{color:#5ec8ff}
#game.act4 #restart,#game.act4 #startBtn,#game.act4 #startClassic,#game.act4 #startHardcore,#game.act4 .menuBtn{background:#1a6a9a}
#game.act4 .menuBtn.secondary{background:#0e3048}
#game.act4 #finalScore{color:#c0e0f0}
#game.act4 #pauseMenu,#game.act4 #gameOver{background:#040810c7}
#game.act4 #pauseBtn{background:rgba(18,35,50,.9);border-color:rgba(80,180,255,.25);color:#c0e8ff}
</style>
</head>

<body>
<div id="game">
<canvas id="canvas"></canvas>

<div id="hud">
<div id="topRow">
<div id="playerPanel" class="panel">
<div id="hp"></div>
<div id="shield"></div>
<div id="score">Счёт: 0</div>
</div>
<div id="wavePanel" class="panel">
<div id="waveTitle">ВОЛНА</div>
<div id="waveNumber">1 / 10</div>
<div id="waveBar"><div id="waveProgress"></div></div>
<div id="timer">00:00</div>
</div>
</div>
</div>

<div id="bossUI">
<div id="bossName">THE ABOMINATION</div>
<div id="bossBar"><div id="bossHealth"></div></div>
</div>

<div id="waveMessage"></div>

<div id="joystick"><div id="stick"></div></div>

<div id="shootButtons">
<button class="shoot" id="up">▲</button>
<button class="shoot" id="left">◀</button>
<button class="shoot" id="right">▶</button>
<button class="shoot" id="down">▼</button>
</div>

<div id="gameOver">
<div id="gameOverBox">
<div id="gameOverTitle">ПОГИБ</div>
<div id="finalTime" style="color:#e9e1e9;font-size:14px;font-weight:bold;margin-bottom:8px"></div>
<div id="finalScore"></div>
<button id="restart">ИГРАТЬ СНОВА</button>
</div>
</div>

<div id="startScreen">
<div id="startBox">
<div id="startTitle">DREAMER</div>
<button id="startClassic" type="button">КЛАССИКА</button>
<button id="startHardcore" type="button">ХАРДКОР</button>
</div>
</div>

<button id="pauseBtn" type="button">❚❚</button>

<div id="pauseMenu">
<div id="pauseBox">
<div id="pauseTitle">ПАУЗА</div>
<button class="menuBtn" id="pauseResume">ПРОДОЛЖИТЬ</button>
<button class="menuBtn" id="pauseRestart">НАЧАТЬ ЗАНОВО</button>
<button class="menuBtn" id="pauseQuit">ВЫЙТИ</button>
</div>
</div>

<div id="passivePick">
<div id="passiveTitle">ВЫБЕРИ ПАССИВКУ</div>
<div id="passiveCards"></div>
</div>
</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

/* Базовый размер для ПК (мобилка берёт размер контейнера как раньше) */
const BASE_W=360, BASE_H=640;
let W=360, H=640, DPR=Math.min(devicePixelRatio||1,2);

function isDesktopDevice(){
    // мышь / трекпад и нет основного тач-экрана
    const fine=window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    const coarse=window.matchMedia("(pointer: coarse)").matches;
    return fine && !coarse;
}

function resize(){
    const gameEl=document.getElementById("game");
    const desktop=isDesktopDevice();
    document.body.classList.toggle("is-desktop", desktop);
    DPR=Math.min(devicePixelRatio||1,2);

    if(desktop){
        // ПК: вся игра целиком масштабируется, пропорции и сложность как на мобилке
        W=BASE_W;
        H=BASE_H;
        gameEl.style.width=BASE_W+"px";
        gameEl.style.height=BASE_H+"px";
        const pad=24;
        const scale=Math.min(
            (window.innerWidth-pad)/BASE_W,
            (window.innerHeight-pad)/BASE_H
        );
        gameEl.style.transform=`scale(${scale})`;
    }else{
        // мобилка: прежнее поведение — контейнер на весь экран
        gameEl.style.width="";
        gameEl.style.height="";
        gameEl.style.transform="";
        const r=gameEl.getBoundingClientRect();
        W=r.width;
        H=r.height;
    }

    canvas.width=W*DPR;
    canvas.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
addEventListener("orientationchange",()=>setTimeout(resize,100));
resize();

const TOTAL_WAVES=31;
let gameRunning=false,paused=false,wave=1,score=0,waveKills=0,waveTotal=0;
let gameMode="classic"; // "classic" | "hardcore"
let act=1; // 1 фиолетовый (1–10), 2 зелёный (11–20), 3 жёлтый (21–30), 4 голубой (31)
let lastTime=performance.now(),gameTime=0;
let gameTimer=0; // секунды активного игрового времени

const keys={up:false,down:false,left:false,right:false};
const shoot={up:false,down:false,left:false,right:false};

const player={
    x:W/2,y:H/2,radius:17,speed:3.45,
    hp:3,maxHp:3,shootCooldown:0,invincible:0,
    faceX:0,faceY:1,walk:0,hurtFlash:0,
    lastMoveX:0,lastMoveY:0,
    // buffs
    hasPill:false,      // beam attack
    hasCookie:false,    // big bullets
    hasEye:false,       // homing attacks
    hasCola:false,      // triple shot
    hasMirror:false,    // dual parallel shots
    hasMagnet:false,    // orbiting layers around player
    hasHat:false,       // ricochet to nearby enemies (2 bounces)
    hasTentacle:false,  // 8-direction shot
    hasRubik:false,     // wall bounce (2) + pierce enemies
    hasSock:false,      // poison: slow + delayed damage
    shield:0,           // 0-3
    beamDamageTimer:0,
    beamActive:false,
    slowTimer:0,        // замедление от луж глаза
    // постоянные пассивки (после боссов)
    passives:{
        critKill:false,    // 2.5% слабое место (на боссах 50 урона)
        shieldBurst:false, // взрыв при потере щита
        dmgBoost:false,    // +15% урон
        lifesteal:false,   // 5% вампиризм при убийстве
        dodge:false,       // 10% блок урона
        speedBoost:false   // +40% скорость
    }
};

let enemies=[],bullets=[],enemyBullets=[],particles=[],floatingTexts=[],stars=[],pickups=[];
let tearPuddles=[]; // лужицы слёз летающего глаза
let door={open:false,x:0,y:0,w:56,h:28,green:false,yellow:false,cyan:false};
let spawnQueue=[]; // отложенный спавн
let waitingForBuff=false; // волна ждёт выбора баффа
let waitingForPassive=false;
let passiveAfterPick=null; // callback после выбора пассивки
// границы комнаты (стены)
const WALL=14;

function rand(a,b){return a+Math.random()*(b-a)}
function randi(a,b){return Math.floor(rand(a,b+1))}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function norm(x,y){let l=Math.hypot(x,y)||1;return{x:x/l,y:y/l}}
function circleHit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.radius+b.radius}
function hitsEnemy(b,e){
    if(e.type==="worm"){
        if(Math.hypot(b.x-e.x,b.y-e.y)<b.radius+(e.radius||20)) return true;
        if(e.segments){
            for(const s of e.segments){
                if(Math.hypot(b.x-s.x,b.y-s.y)<b.radius+(s.r||16)) return true;
            }
        }
        return false;
    }
    return circleHit(b,e);
}

for(let i=0;i<65;i++)
stars.push({x:Math.random(),y:Math.random(),r:rand(.4,1.5),a:rand(.08,.35),p:rand(0,7)});

/* BACKGROUND */
function drawBackground(t){
    const theme=act>=4?"cyan":act>=3?"yellow":act>=2?"green":"purple";
    // пол
    let g=ctx.createLinearGradient(0,0,0,H);
    if(theme==="cyan"){
        g.addColorStop(0,"#0e1822");g.addColorStop(.45,"#0a141c");g.addColorStop(1,"#081018");
    }else if(theme==="yellow"){
        g.addColorStop(0,"#1a1810");g.addColorStop(.45,"#14120c");g.addColorStop(1,"#0e0c08");
    }else if(theme==="green"){
        g.addColorStop(0,"#121a14");g.addColorStop(.45,"#0e1510");g.addColorStop(1,"#0a100c");
    }else{
        g.addColorStop(0,"#1a1522");g.addColorStop(.45,"#14101a");g.addColorStop(1,"#0c0a10");
    }
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

    const tile=48;
    for(let ty=0;ty<H;ty+=tile)for(let tx=0;tx<W;tx+=tile){
        const odd=((tx/tile+ty/tile)|0)%2;
        if(theme==="cyan"){
            ctx.fillStyle=odd?"rgba(80,200,255,0.03)":"rgba(5,30,50,0.08)";
            ctx.strokeStyle="rgba(60,160,220,0.05)";
        }else if(theme==="yellow"){
            ctx.fillStyle=odd?"rgba(255,220,80,0.03)":"rgba(40,30,5,0.08)";
            ctx.strokeStyle="rgba(220,180,60,0.05)";
        }else if(theme==="green"){
            ctx.fillStyle=odd?"rgba(120,255,140,0.025)":"rgba(0,40,10,0.08)";
            ctx.strokeStyle="rgba(100,200,120,0.04)";
        }else{
            ctx.fillStyle=odd?"rgba(255,255,255,0.018)":"rgba(0,0,0,0.06)";
            ctx.strokeStyle="rgba(255,255,255,0.03)";
        }
        ctx.fillRect(tx,ty,tile,tile);
        ctx.strokeRect(tx+0.5,ty+0.5,tile-1,tile-1);
    }

    ctx.strokeStyle="rgba(0,0,0,0.12)";ctx.lineWidth=1;
    for(let i=0;i<12;i++){
        const px=(i*97+40)%W,py=(i*151+100)%H;
        ctx.beginPath();
        ctx.moveTo(px,py);
        ctx.lineTo(px+8,py+5);
        ctx.lineTo(px+3,py+12);
        ctx.stroke();
    }

    for(const s of stars){
        let col;
        if(theme==="cyan") col=`rgba(140,220,255,${s.a*(.5+.4*Math.sin(t*.002+s.p))})`;
        else if(theme==="yellow") col=`rgba(255,230,140,${s.a*(.5+.4*Math.sin(t*.002+s.p))})`;
        else if(theme==="green") col=`rgba(160,255,180,${s.a*(.5+.4*Math.sin(t*.002+s.p))})`;
        else col=`rgba(220,200,255,${s.a*(.5+.4*Math.sin(t*.002+s.p))})`;
        ctx.fillStyle=col;
        ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r*0.9,0,7);ctx.fill();
    }

    let v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);
    v.addColorStop(0,"#0000");v.addColorStop(1,"#00000090");
    ctx.fillStyle=v;ctx.fillRect(0,0,W,H);

    const topY=78;
    const wallGrad=ctx.createLinearGradient(0,0,0,H);
    if(theme==="cyan"){
        wallGrad.addColorStop(0,"#122030");
        wallGrad.addColorStop(1,"#0a141c");
    }else if(theme==="yellow"){
        wallGrad.addColorStop(0,"#1e1a10");
        wallGrad.addColorStop(1,"#14120c");
    }else if(theme==="green"){
        wallGrad.addColorStop(0,"#152018");
        wallGrad.addColorStop(1,"#0e1510");
    }else{
        wallGrad.addColorStop(0,"#1e1826");
        wallGrad.addColorStop(1,"#14101a");
    }
    ctx.fillStyle=wallGrad;
    ctx.fillRect(0,0,W,topY);
    ctx.fillRect(0,H-WALL,W,WALL);
    ctx.fillRect(0,0,WALL,H);
    ctx.fillRect(W-WALL,0,WALL,H);

    ctx.strokeStyle=theme==="cyan"?"rgba(80,200,255,0.05)":theme==="yellow"?"rgba(255,210,80,0.05)":theme==="green"?"rgba(120,255,140,0.04)":"rgba(255,255,255,0.03)";
    ctx.lineWidth=1;
    for(let i=0;i<8;i++){
        const yy=topY+8+i*((H-topY-WALL-16)/8);
        ctx.beginPath();ctx.moveTo(WALL+4,yy);ctx.lineTo(W-WALL-4,yy);ctx.stroke();
    }

    ctx.strokeStyle=theme==="cyan"?"#2a6088":theme==="yellow"?"#6a5a30":theme==="green"?"#3d5a42":"#4a3d58";
    ctx.lineWidth=3;
    ctx.strokeRect(WALL+1.5,topY+1.5,W-WALL*2-3,H-topY-WALL-3);
    ctx.strokeStyle=theme==="cyan"?"rgba(60,180,255,0.25)":theme==="yellow"?"rgba(220,180,60,0.25)":theme==="green"?"rgba(80,200,100,0.2)":"rgba(157,78,221,0.15)";
    ctx.lineWidth=1.5;
    ctx.strokeRect(WALL+5,topY+5,W-WALL*2-10,H-topY-WALL-10);

    ctx.fillStyle=theme==="cyan"?"#1a3048":theme==="yellow"?"#2e2818":theme==="green"?"#1e3024":"#2e2538";
    const c=12;
    [[WALL,topY],[W-WALL-c,topY],[WALL,H-WALL-c],[W-WALL-c,H-WALL-c]].forEach(([cx,cy])=>{
        ctx.fillRect(cx,cy,c,c);
        ctx.strokeStyle=theme==="cyan"?"#3a90c0":theme==="yellow"?"#a89040":theme==="green"?"#4a7a58":"#5a4a70";ctx.lineWidth=1.5;ctx.strokeRect(cx+.5,cy+.5,c-1,c-1);
    });
}

/* WAVES — фиксированный состав: рост сложности + разная тактика */

function buildWaveRoster(w){
    const def=WAVE_DEFS[w];
    return def?def.roster.slice():["chaser"];
}

function getSpawnPos(pattern,index,total){
    const topY=95, botY=H-40, leftX=40, rightX=W-40;
    let x,y,tries=0;
    do{
        if(pattern===0){ // со всех сторон
            const side=randi(0,3);
            if(side===0){x=rand(leftX,rightX);y=-40}
            else if(side===1){x=W+40;y=rand(topY,botY)}
            else if(side===2){x=rand(leftX,rightX);y=H+40}
            else{x=-40;y=rand(topY,botY)}
        }else if(pattern===1){ // одна случайная сторона
            const side=getSpawnPos._side!=null?getSpawnPos._side:(getSpawnPos._side=randi(0,3));
            if(side===0){x=rand(leftX,rightX);y=-40}
            else if(side===1){x=W+40;y=rand(topY,botY)}
            else if(side===2){x=rand(leftX,rightX);y=H+40}
            else{x=-40;y=rand(topY,botY)}
        }else if(pattern===2){ // углы
            const corners=[[-40,-40],[W+40,-40],[-40,H+40],[W+40,H+40]];
            const c=corners[index%4];
            x=c[0]+rand(-15,15);y=c[1]+rand(-15,15);
        }else if(pattern===3){ // кольцо вокруг комнаты
            const a=(index/total)*Math.PI*2+rand(-0.2,0.2);
            x=W/2+Math.cos(a)*(W*0.55+30);
            y=H/2+Math.sin(a)*(H*0.4+30);
        }else{ // сверху и снизу волнами
            if(index%2===0){x=rand(leftX,rightX);y=-40}
            else{x=rand(leftX,rightX);y=H+40}
        }
        tries++;
    }while(Math.hypot(x-player.x,y-player.y)<160&&tries<15);
    return{x,y};
}

function startWave(w){
    wave=w;waveKills=0;waveTotal=0;
    act=w>=31?4:w>=21?3:w>=11?2:1;
    applyActUITheme();
    enemies=[];enemyBullets=[];bullets=[];pickups=[];spawnQueue=[];tearPuddles=[];
    door.open=false;
    door.green=false;
    door.yellow=false;
    door.cyan=false;
    getSpawnPos._side=undefined;
    player.hasPill=false;
    player.hasCookie=false;
    player.hasEye=false;
    player.hasCola=false;
    player.hasMirror=false;
    player.hasMagnet=false;
    player.hasHat=false;
    player.hasTentacle=false;
    player.hasRubik=false;
    player.hasSock=false;
    player.beamActive=false;
    player.beamDamageTimer=0;

    document.getElementById("waveNumber").textContent=`${wave} / ${TOTAL_WAVES}`;
    document.getElementById("waveProgress").style.width="0%";
    document.getElementById("bossUI").style.display="none";

    // хардкор: без баффов — сразу враги
    if(gameMode==="hardcore"){
        waitingForBuff=false;
        showMessage(w===31?"ФИНАЛ":("ВОЛНА "+w));
        spawnWave(w);
        return;
    }

    waitingForBuff=true;
    showMessage("ВЫБЕРИ БАФФ");
    // сначала только баффы в центре — враги после выбора
    spawnPickups();
}

function spawnWave(w){
    if(w===10){
        spawnEnemy("boss",W/2,Math.max(135,H*.27));
        waveTotal=1;
        document.getElementById("bossName").textContent="THE ABOMINATION";
        document.getElementById("bossUI").style.display="block";
        return;
    }
    if(w===20){
        spawnEnemy("devil",W/2,78+WALL+55);
        waveTotal=1;
        document.getElementById("bossName").textContent="THE DEVIL";
        document.getElementById("bossUI").style.display="block";
        return;
    }
    if(w===30){
        spawnEnemy("worm",W/2,(78+H)/2);
        waveTotal=1;
        document.getElementById("bossName").textContent="THE WORM";
        document.getElementById("bossUI").style.display="block";
        return;
    }
    if(w===31){
        spawnEnemy("crystal",W/2,78+WALL+95);
        waveTotal=1;
        document.getElementById("bossName").textContent="THE CRYSTAL";
        document.getElementById("bossUI").style.display="block";
        return;
    }

    const def=WAVE_DEFS[w]||{roster:["chaser"],pattern:0,staggered:false};
    const roster=def.roster.slice();
    waveTotal=roster.length;
    const pattern=def.pattern;
    const staggered=def.staggered;

    if(!staggered){
        for(let i=0;i<roster.length;i++){
            const pos=getSpawnPos(pattern,i,roster.length);
            spawnEnemy(roster[i],pos.x,pos.y);
        }
    }else{
        // порциями с задержкой
        let delay=0;
        const batchSize=Math.max(2,Math.ceil(roster.length/3));
        for(let i=0;i<roster.length;i++){
            if(i>0&&i%batchSize===0) delay+=rand(40,65);
            const pos=getSpawnPos(pattern,i,roster.length);
            spawnQueue.push({type:roster[i],x:pos.x,y:pos.y,delay:delay+i*rand(2,6)});
        }
    }
}

function updateSpawnQueue(dt){
    for(let i=spawnQueue.length-1;i>=0;i--){
        spawnQueue[i].delay-=dt;
        if(spawnQueue[i].delay<=0){
            const s=spawnQueue[i];
            spawnEnemy(s.type,s.x,s.y);
            spawnQueue.splice(i,1);
        }
    }
}

function spawnPickups(){
    // два разных случайных баффа в центре комнаты
    let all=["pill","cookie","medkit","shield","eye","cola","mirror","magnet","hat","tentacle","sock","rubik"];
    // аптечка не выпадает при полном HP, щит — при полном щите
    if(player.hp>=player.maxHp) all=all.filter(t=>t!=="medkit");
    if(player.shield>=3) all=all.filter(t=>t!=="shield");
    for(let i=all.length-1;i>0;i--){
        const j=randi(0,i);
        [all[i],all[j]]=[all[j],all[i]];
    }
    const chosen=all.slice(0,Math.min(2,all.length));
    const cx=W/2;
    const cy=(78+H-WALL)/2;
    const spacing=80;

    for(let i=0;i<chosen.length;i++){
        pickups.push({
            type:chosen[i],
            x:cx-spacing/2+i*spacing+(chosen.length===1?spacing/2:0),
            y:cy,
            radius:16,
            bob:rand(0,Math.PI*2),
            taken:false
        });
    }
}

            e.evMarkers=[];
            // угол «далёкого» сектора
            e.evHomeAng=rand(0,Math.PI*2);
            e.platePhase=[rand(0,7),rand(0,7),rand(0,7)];
            break;

        case"cowboy":
            e.radius=16;e.hp=Math.round(10*scale);e.maxHp=e.hp;
            e.speed=(.55+wave*.01)*rand(0.9,1.1);
            e.damage=0.25;
            e.cowboyPhase="patrol"; // patrol → telegraph → shoot
            e.cowboyTimer=rand(104,182); // +30% к 80–140
            e.shotAng=0;
            e.shotPath=[];
            e.edgeSlot=(enemies.filter(o=>o.type==="cowboy").length);
            break;

        case"crystal":
            e.radius=40;
            e.hp=552;e.maxHp=552; // 4× первого босса (138)
            e.speed=0.55;
            e.damage=0.25;
            e.crystalPhase="idle"; // idle → telegraph → fire
            e.crystalTimer=90;
            e.crystalAtk=0; // 0=projectiles, 1=radial lasers, 2=map lasers, 3=explosions
            e.crystalBeams=[];
            e.crystalAge=0;
            e.crystalMarkers=[];
            e.crystalSpin=0;
            e.crystalRayAng=0;
            e.enteredMap=true;
            break;
    }
    e.speed*=0.94; // −6% скорость мобов
    if(type==="angel") e.speed=player.speed*0.375;
    if(type==="lantern") e.speed=player.speed*0.375;
    if(type==="devil"){e.speed=0;e.x=W/2;e.y=78+WALL+55}
    if(type==="crystal"){e.speed=0.55;e.x=W/2;e.y=78+WALL+95}
    enemies.push(e);
}

/* Паттерны лучей дьявола: axis v/h/diag */
function buildDevilPattern(kind){
    const bw=W/8, bh=H/8;
    const L=WALL, R=W-WALL, T=78+WALL, B=H-WALL;
    const cx=W/2, midY=(T+B)/2;
    // steps: [{at, dur, beams}] at/dur in frames
    if(kind===0){ // левый + правый край
        return[{at:0,dur:90,beams:[
            {axis:"v",pos:L+bw/2,w:bw},
            {axis:"v",pos:R-bw/2,w:bw}
        ]}];
    }
    if(kind===1){ // низ
        return[{at:0,dur:90,beams:[{axis:"h",pos:B-bh/2,h:bh}]}];
    }
    if(kind===2){ // Z — все линии сразу
        return[{at:0,dur:100,beams:[
            {axis:"h",pos:T+bh/2,h:bh},
            {axis:"diag",x1:R-bw,y1:T+bh,x2:L+bw,y2:B-bh,w:bw},
            {axis:"h",pos:B-bh/2,h:bh}
        ]}];
    }
    if(kind===3){ // перевёрнутая Z — все сразу
        return[{at:0,dur:100,beams:[
            {axis:"h",pos:T+bh/2,h:bh},
            {axis:"diag",x1:L+bw,y1:T+bh,x2:R-bw,y2:B-bh,w:bw},
            {axis:"h",pos:B-bh/2,h:bh}
        ]}];
    }
    if(kind===4){ // крест
        return[{at:0,dur:100,beams:[
            {axis:"v",pos:cx,w:bw},
            {axis:"h",pos:midY,h:bh}
        ]}];
    }
    if(kind===5){ // крест накрест (X)
        return[{at:0,dur:100,beams:[
            {axis:"diag",x1:L,y1:T,x2:R,y2:B,w:bw},
            {axis:"diag",x1:R,y1:T,x2:L,y2:B,w:bw}
        ]}];
    }
    // последовательные: +0.5 сек между лучами (было ~28 → ~58 кадров)
    const gap=58, beamDur=42;
    if(kind===6){ // слева направо
        const steps=[];
        const n=5;
        for(let i=0;i<n;i++){
            const x=L+bw/2+i*((R-L-bw)/(n-1));
            steps.push({at:i*gap,dur:beamDur,beams:[{axis:"v",pos:x,w:bw}]});
        }
        return steps;
    }
    if(kind===7){ // справа налево
        const steps=[];
        const n=5;
        for(let i=0;i<n;i++){
            const x=R-bw/2-i*((R-L-bw)/(n-1));
            steps.push({at:i*gap,dur:beamDur,beams:[{axis:"v",pos:x,w:bw}]});
        }
        return steps;
    }
    if(kind===8){ // снизу вверх
        const steps=[];
        const n=5;
        for(let i=0;i<n;i++){
            const y=B-bh/2-i*((B-T-bh)/(n-1));
            steps.push({at:i*gap,dur:beamDur,beams:[{axis:"h",pos:y,h:bh}]});
        }
        return steps;
    }
    if(kind===9){ // сверху вниз
        const steps=[];
        const n=5;
        for(let i=0;i<n;i++){
            const y=T+bh/2+i*((B-T-bh)/(n-1));
            steps.push({at:i*gap,dur:beamDur,beams:[{axis:"h",pos:y,h:bh}]});
        }
        return steps;
    }
    if(kind===10){ // рамка: все 4 края
        return[{at:0,dur:100,beams:[
            {axis:"v",pos:L+bw/2,w:bw},
            {axis:"v",pos:R-bw/2,w:bw},
            {axis:"h",pos:T+bh/2,h:bh},
            {axis:"h",pos:B-bh/2,h:bh}
        ]}];
    }
    if(kind===11){ // 3 вертикали: лево / центр / право
        return[{at:0,dur:100,beams:[
            {axis:"v",pos:L+(R-L)*0.2,w:bw},
            {axis:"v",pos:cx,w:bw},
            {axis:"v",pos:L+(R-L)*0.8,w:bw}
        ]}];
    }
    if(kind===12){ // 3 горизонтали
        return[{at:0,dur:100,beams:[
            {axis:"h",pos:T+(B-T)*0.2,h:bh},
            {axis:"h",pos:midY,h:bh},
            {axis:"h",pos:T+(B-T)*0.8,h:bh}
        ]}];
    }
    if(kind===13){ // крест + края (клетка)
        return[{at:0,dur:110,beams:[
            {axis:"v",pos:cx,w:bw},
            {axis:"h",pos:midY,h:bh},
            {axis:"v",pos:L+bw/2,w:bw},
            {axis:"v",pos:R-bw/2,w:bw}
        ]}];
    }
    if(kind===14){ // диагонали + низ
        return[{at:0,dur:110,beams:[
            {axis:"diag",x1:L,y1:T,x2:R,y2:B,w:bw},
            {axis:"diag",x1:R,y1:T,x2:L,y2:B,w:bw},
            {axis:"h",pos:B-bh/2,h:bh}
        ]}];
    }
    // ===== атаки по центру (заставляют двигаться) =====
    if(kind===15){ // широкий центр вертикаль
        return[{at:0,dur:100,beams:[{axis:"v",pos:cx,w:bw*1.6}]}];
    }
    if(kind===16){ // широкий центр горизонталь
        return[{at:0,dur:100,beams:[{axis:"h",pos:midY,h:bh*1.6}]}];
    }
    if(kind===17){ // двойной крест: центр + смещённые оси
        return[{at:0,dur:110,beams:[
            {axis:"v",pos:cx,w:bw},
            {axis:"h",pos:midY,h:bh},
            {axis:"v",pos:cx-bw*1.2,w:bw*0.85},
            {axis:"v",pos:cx+bw*1.2,w:bw*0.85},
            {axis:"h",pos:midY-bh*1.1,h:bh*0.85},
            {axis:"h",pos:midY+bh*1.1,h:bh*0.85}
        ]}];
    }
    if(kind===18){ // плюс + крест до углов
        return[{at:0,dur:110,beams:[
            {axis:"v",pos:cx,w:bw},
            {axis:"h",pos:midY,h:bh},
            {axis:"diag",x1:L,y1:T,x2:R,y2:B,w:bw},
            {axis:"diag",x1:R,y1:T,x2:L,y2:B,w:bw}
        ]}];
    }
    // kind 19: пульс центра — сначала центр, потом кольцо вокруг
    return[
        {at:0,dur:45,beams:[
            {axis:"v",pos:cx,w:bw},
            {axis:"h",pos:midY,h:bh}
        ]},
        {at:40,dur:55,beams:[
            {axis:"v",pos:cx-bw*1.5,w:bw},
            {axis:"v",pos:cx+bw*1.5,w:bw},
            {axis:"h",pos:midY-bh*1.4,h:bh},
            {axis:"h",pos:midY+bh*1.4,h:bh}
        ]}
    ];
}

function devilBeamHit(beam,px,py,pr){
    const T=78+WALL, B=H-WALL, L=WALL, R=W-WALL;
    if(beam.axis==="v"){
        const half=(beam.w||W/8)/2;
        return Math.abs(px-beam.pos)<half+pr && py>T-pr && py<B+pr;
    }
    if(beam.axis==="h"){
        const half=(beam.h||H/8)/2;
        return Math.abs(py-beam.pos)<half+pr && px>L-pr && px<R+pr;
    }
    if(beam.axis==="diag"){
        // расстояние до отрезка
        const x1=beam.x1,y1=beam.y1,x2=beam.x2,y2=beam.y2;
        const dx=x2-x1,dy=y2-y1,len2=dx*dx+dy*dy||1;
        let t=((px-x1)*dx+(py-y1)*dy)/len2;
        t=clamp(t,0,1);
        const cx=x1+dx*t, cy=y1+dy*t;
        const half=(beam.w||W/8)/2;
        return Math.hypot(px-cx,py-cy)<half+pr;
    }
    return false;
}

function getActiveDevilBeams(e){
    const steps=e.devilBeams||[];
    const age=e.devilAge||0;
    const active=[];
    for(const s of steps){
        if(age>=s.at && age<s.at+s.dur){
            for(const b of s.beams) active.push(b);
        }
    }
    return active;
}

/* INPUT */
let joy={active:false,id:null,x:0,y:0};

function updateJoystick(cx,cy){
    const r=joystick.getBoundingClientRect();
    let dx=cx-(r.left+r.width/2),dy=cy-(r.top+r.height/2);
    const max=r.width*.32,d=Math.hypot(dx,dy);
    if(d>max){dx=dx/d*max;dy=dy/d*max}
    joy.x=dx/max;joy.y=dy/max;
    stick.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
function resetJoystick(){
    joy.active=false;joy.x=0;joy.y=0;
    stick.style.transform="translate(-50%,-50%)";
}
joystick.addEventListener("touchstart",e=>{
    e.preventDefault();joy.active=true;joy.id=e.changedTouches[0].identifier;
    let t=e.changedTouches[0];updateJoystick(t.clientX,t.clientY);
},{passive:false});
joystick.addEventListener("touchmove",e=>{
    e.preventDefault();
    for(const t of e.changedTouches)if(t.identifier===joy.id)updateJoystick(t.clientX,t.clientY);
},{passive:false});

/* PLAYER */
function updatePlayer(dt){
    let mx=0,my=0;

    if(joy.active){mx=joy.x;my=joy.y}
    else{
        if(keys.left)mx--;if(keys.right)mx++;
        if(keys.up)my--;if(keys.down)my++;
        if(mx||my){let n=norm(mx,my);mx=n.x;my=n.y}
    }

    if(player.slowTimer>0) player.slowTimer-=dt;
    if(mx||my){
        let spdMul=player.slowTimer>0?0.85:1; // −15% от луж
        if(player.passives.speedBoost) spdMul*=1.4;
        player.x+=mx*player.speed*spdMul*dt;
        player.y+=my*player.speed*spdMul*dt;
        player.faceX=mx;player.faceY=my;
        player.lastMoveX=mx;player.lastMoveY=my;
        player.walk+=dt*.32;
    }

    // границы комнаты (стены)
    // когда дверь открыта — можно пройти в верхний проём
    let topBound=78+WALL+player.radius;
    if(door.open && Math.abs(player.x-door.x)<door.w/2+4){
        topBound=door.y-4; // пускаем в дверь
    }
    const botBound=H-WALL-player.radius;
    const leftBound=WALL+player.radius;
    const rightBound=W-WALL-player.radius;
    player.x=clamp(player.x,leftBound,rightBound);
    player.y=clamp(player.y,topBound,botBound);

    if(player.invincible>0)player.invincible-=dt;
    if(player.hurtFlash>0)player.hurtFlash-=dt;
    if(player.shootCooldown>0)player.shootCooldown-=dt;
    if(player.beamDamageTimer>0)player.beamDamageTimer-=dt;

    let sx=0,sy=0;
    if(shoot.left)sx--;if(shoot.right)sx++;
    if(shoot.up)sy--;if(shoot.down)sy++;

    player.beamActive=false;
    const fireHeld=!!(sx||sy);

    // магнит: при отпускании кнопки атаки — сброс всех орбитальных снарядов
    if(player.hasMagnet && player.magnetWasHeld && !fireHeld){
        for(let i=bullets.length-1;i>=0;i--){
            if(bullets[i].orbit){
                createBurst(bullets[i].x,bullets[i].y,"spark");
                bullets.splice(i,1);
            }
        }
    }
    player.magnetWasHeld=fireHeld;

    if(fireHeld){
        let n=norm(sx,sy);
        // глаз: луч целится в ближайшего врага
        if(player.hasEye&&player.hasPill){
            const t=nearestEnemy(player.x,player.y);
            if(t){n=norm(t.x-player.x,t.y-player.y)}
        }
        player.faceX=n.x;player.faceY=n.y;

        if(player.hasPill){
            player.beamActive=true;
            updateBeam(n.x,n.y,dt);
        }else if(player.shootCooldown<=0){
            if(player.hasTentacle){
                // щупальце: 12 направлений, урон 1, кулдаун ~0.94 сек
                fireTentacleBurst();
                player.shootCooldown=56; // +25% к 0.75 сек
            }else{
                firePlayerBullet(n.x,n.y);
                // кола: 0.76 сек; печенье медленнее; носок +25%; магнит медленнее
                if(player.hasCola) player.shootCooldown=46;
                else if(player.hasCookie) player.shootCooldown=20;
                else if(player.hasSock) player.shootCooldown=18;
                else if(player.hasMagnet) player.shootCooldown=44;
                else player.shootCooldown=14;
            }
        }
    }

    // pickup collision — поднял один, второй исчезает, затем старт волны
    for(let i=pickups.length-1;i>=0;i--){
        const p=pickups[i];
        if(p.taken)continue;
        if(circleHit(player,p)){
            applyPickup(p);
            for(const other of pickups){
                if(other!==p && !other.taken){
                    other.taken=true;
                    createBurst(other.x,other.y,"spark");
                }
            }
            pickups.length=0;

            if(waitingForBuff){
                waitingForBuff=false;
                if(wave===10){
                    showMessage("БОСС");
                    document.getElementById("bossUI").style.display="block";
                }else if(wave===20){
                    showMessage("ДЬЯВОЛ");
                    document.getElementById("bossUI").style.display="block";
                }else if(wave===30){
                    showMessage("ЧЕРВЬ");
                    document.getElementById("bossUI").style.display="block";
                }else if(wave===31){
                    showMessage("ФИНАЛ");
                    document.getElementById("bossUI").style.display="block";
                }else{
                    showMessage(`ВОЛНА ${wave}`);
                }
                spawnWave(wave);
            }
            break;
        }
    }
}

function nearestEnemy(x,y){
    let best=null,bestD=1e9;
    for(const e of enemies){
        if(e.dead||e.intangible)continue;
        const d=Math.hypot(e.x-x,e.y-y);
        if(d<bestD){bestD=d;best=e}
    }
    return best;
}

function fireTentacleBurst(){
    // 10 направлений: короткий вылет → самонаведение; скорость −25%
    const dmg=0.7;
    const spd=5.5*0.75; // 4.125
    const rad=5.3*1.3;
    for(let i=0;i<10;i++){
        const a=i*Math.PI/5;
        const bx=Math.cos(a),by=Math.sin(a);
        bullets.push({
            x:player.x+bx*18,y:player.y+by*18,
            vx:bx*spd,vy:by*spd,
            radius:rad,
            life:320,
            damage:dmg,
            baseDamage:dmg,
            bounceCount:0,
            baseSpeed:spd,
            tentacle:true,
            tentaclePhase:"out", // out → seek
            tentacleOutDist:0,
            tentacleOutMax:48, // небольшое расстояние
            homing:false,
            ricochets:0,
            lastHitId:-1
        });
    }
    for(let i=0;i<6;i++){
        const a=Math.random()*Math.PI*2;
        particles.push({
            x:player.x,y:player.y,
            vx:Math.cos(a)*rand(.5,2),vy:Math.sin(a)*rand(.5,2),

        });
    }
}

// магнит: 3 орбитальных слоя (урон 1 / 1.5 / 2)
const MAGNET_LAYERS=[
    {max:12,dmg:1,  r:42,spd:0.045},
    {max:16,dmg:1.5,r:68,spd:0.035},
    {max:20,dmg:2,  r:94,spd:0.028}
];

function countOrbitLayer(layer){
    let n=0;
    for(const b of bullets) if(b.orbit&&b.orbitLayer===layer) n++;
    return n;
}

function addMagnetOrbit(dirAngle){
    // заполняем слои по порядку
    for(let L=0;L<MAGNET_LAYERS.length;L++){
        const cfg=MAGNET_LAYERS[L];
        if(countOrbitLayer(L)>=cfg.max) continue;

        // собираем углы уже существующих на слое
        const angles=[];
        for(const b of bullets) if(b.orbit&&b.orbitLayer===L) angles.push(b.orbitAngle);
        let ang=dirAngle;
        if(angles.length===0){
            ang=dirAngle;
        }else{
            // ставим в середину самого большого промежутка (равномерные интервалы)
            angles.sort((a,b)=>a-b);
            let bestGap=-1,bestAng=angles[0]+Math.PI;
            for(let i=0;i<angles.length;i++){
                const a0=angles[i];
                const a1=angles[(i+1)%angles.length]+(i===angles.length-1?Math.PI*2:0);
                const gap=a1-a0;
                if(gap>bestGap){
                    bestGap=gap;
                    bestAng=a0+gap*0.5;
                }
            }
            ang=bestAng;
        }

        bullets.push({
            x:player.x+Math.cos(ang)*cfg.r,
            y:player.y+Math.sin(ang)*cfg.r,
            vx:0,vy:0,
            radius:4.8+L*0.6,
            life:99999,
            damage:cfg.dmg,
            orbit:true,
            orbitLayer:L,
            orbitAngle:ang,
            orbitRadius:cfg.r,
            orbitSpeed:cfg.spd*(L%2===0?1:-1),
            spin:0,
            minSep:(Math.PI*2)/cfg.max // минимальный угловой зазор
        });
        return true;
    }
    return false;
}

function firePlayerBullet(dx,dy){
    const sizeMul=player.hasCookie?2:1;
    // глаз −30% урона
    let dmg=player.hasCookie?2:(player.hasEye?0.7:1);
    const baseAngle=Math.atan2(dy,dx);

    // магнит: вместо обычных выстрелов — орбитальные снаряды
    if(player.hasMagnet){
        addMagnetOrbit(baseAngle);
        for(let i=0;i<2;i++)particles.push({
            x:player.x+dx*16,y:player.y+dy*16,
            vx:-dx*rand(.2,1),vy:-dy*rand(.2,1),
            life:12,maxLife:12,size:rand(2,3),type:"spark"
        });
        return;
    }

    // кола: три снаряда веером, иначе один
    const spreads=player.hasCola?[-0.22,0,0.22]:[0];
    // зеркало: две параллельные линии (смещение перпендикулярно направлению)
    const parallelOffsets=player.hasMirror?[-8,8]:[0];

    // кола медленнее; печенье −30% скорости снаряда
    let bulletSpd=6.4;
    if(player.hasCola) bulletSpd=3.726;
    else if(player.hasCookie) bulletSpd=6.4*0.7; // 4.48
    for(const spread of spreads){
        const a=baseAngle+spread;
        const bx=Math.cos(a),by=Math.sin(a);
        // перпендикуляр к направлению выстрела
        const px=-by,py=bx;
        for(const off of parallelOffsets){
            bullets.push({
                x:player.x+bx*18+px*off,y:player.y+by*18+py*off,
                vx:bx*bulletSpd,vy:by*bulletSpd,
                radius:5.3*sizeMul,
                life:400,
                damage:dmg,
                baseDamage:dmg,
                baseSpeed:bulletSpd,
                bounceCount:0,
                homing:player.hasEye,
                ricochets:player.hasHat?2:0,
                wallBounces:player.hasRubik?2:0,
                pierce:!!player.hasRubik,
                lastHitId:-1,
                hitSet:null
            });
        }
    }
    for(let i=0;i<3;i++)particles.push({
        x:player.x+dx*18,y:player.y+dy*18,
        vx:-dx*rand(.2,1),vy:-dy*rand(.2,1),
        life:16,maxLife:16,size:rand(2,4)*sizeMul,type:"spark"
    });
}

function getWallRange(sx,sy,dx,dy,maxR){
    // максимальная длина луча/снаряда до стены
    const topY=78, botY=H-WALL, leftX=WALL, rightX=W-WALL;
    let tMax=maxR;
    if(dx>0.001) tMax=Math.min(tMax,(rightX-sx)/dx);
    if(dx<-0.001) tMax=Math.min(tMax,(leftX-sx)/dx);
    if(dy>0.001) tMax=Math.min(tMax,(botY-sy)/dy);
    if(dy<-0.001) tMax=Math.min(tMax,(topY-sy)/dy);
    return Math.max(0,tMax);
}

// полный путь рикошета: сегменты до maxBounces отскоков + финальное касание стены
function getRicochetPath(sx,sy,ang,maxBounces){
    const topY=78, botY=H-WALL, leftX=WALL, rightX=W-WALL;
    const segs=[];
    const hits=[];
    let x=sx, y=sy;
    let dx=Math.cos(ang), dy=Math.sin(ang);
    const eps=0.5;
    for(let b=0;b<=maxBounces;b++){
        let t=1e9, hit="none";
        if(dx>0.001){const tt=(rightX-x)/dx;if(tt<t&&tt>0){t=tt;hit="r"}}
        if(dx<-0.001){const tt=(leftX-x)/dx;if(tt<t&&tt>0){t=tt;hit="l"}}
        if(dy>0.001){const tt=(botY-y)/dy;if(tt<t&&tt>0){t=tt;hit="b"}}
        if(dy<-0.001){const tt=(topY-y)/dy;if(tt<t&&tt>0){t=tt;hit="t"}}
        if(t>=1e9) break;
        const nx=x+dx*t, ny=y+dy*t;
        segs.push({x1:x,y1:y,x2:nx,y2:ny});
        hits.push(hit);
        if(b===maxBounces) break;
        x=nx;y=ny;
        if(hit==="r"||hit==="l"){dx=-dx;x+=hit==="r"?-eps:eps}
        else{dy=-dy;y+=hit==="b"?-eps:eps}
    }
    segs.hits=hits;
    return segs;
}

// соседние стены (не противоположные)
function wallsAdjacent(a,b){
    if(!a||!b||a==="none"||b==="none") return false;
    if((a==="l"&&b==="r")||(a==="r"&&b==="l")) return false;
    if((a==="t"&&b==="b")||(a==="b"&&b==="t")) return false;
    return a!==b;
}

// угол: к игроку, но путь рикошетит по соседним стенам
function pickCowboyShotAng(sx,sy){
    const base=Math.atan2(player.y-sy,player.x-sx);
    let best=base, bestScore=-1e9;
    // перебор углов около направления на игрока + углы в углы арены
    const candidates=[];
    for(let i=-8;i<=8;i++) candidates.push(base+i*0.12);
    const L=WALL, R=W-WALL, T=78, B=H-WALL;
    for(const c of [{x:L,y:T},{x:R,y:T},{x:L,y:B},{x:R,y:B}]){
        candidates.push(Math.atan2(c.y-sy,c.x-sx)+rand(-0.15,0.15));
    }
    for(const ang of candidates){
        const path=getRicochetPath(sx,sy,ang,2);
        const h=path.hits||[];
        let score=0;
        // соседние стены на первых отскоках
        if(h.length>=2&&wallsAdjacent(h[0],h[1])) score+=5;
        if(h.length>=3&&wallsAdjacent(h[1],h[2])) score+=3;
        // штраф за противоположные
        if(h.length>=2&&!wallsAdjacent(h[0],h[1])&&h[0]!==h[1]) score-=8;
        // ближе к направлению на игрока
        let da=Math.abs(ang-base);
        while(da>Math.PI) da=Math.abs(da-Math.PI*2);
        score-=da*1.5;
        // путь проходит рядом с игроком
        let minD=1e9;
        for(const s of path){
            // расстояние точка-отрезок упрощённо
            const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2;
            minD=Math.min(minD,Math.hypot(player.x-mx,player.y-my));
        }
        score-=minD*0.01;
        if(score>bestScore){bestScore=score;best=ang}
    }
    return best;
}

function updateBeam(dx,dy,dt){
    const maxRange=240; // ~25% короче
    const beamWidth=14;
    const startX=player.x+dx*20;
    const startY=player.y+dy*20;
    const range=getWallRange(startX,startY,dx,dy,maxRange);
    const endX=startX+dx*range;
    const endY=startY+dy*range;
    player.beamEndX=endX;
    player.beamEndY=endY;
    player.beamRange=range;

    // visual particles along beam
    if(Math.random()<0.45 && range>10){
        const t=Math.random();
        particles.push({
            x:startX+(endX-startX)*t+rand(-3,3),
            y:startY+(endY-startY)*t+rand(-3,3),
            vx:dx*rand(.3,1.2),vy:dy*rand(.3,1.2),
            life:10,maxLife:10,size:rand(1.5,3.5),type:"beam"
        });
    }

    if(player.beamDamageTimer<=0){
        player.beamDamageTimer=10;
        for(const e of enemies){
            if(e.dead||e.intangible)continue;
            const px=e.x-startX,py=e.y-startY;
            const proj=px*dx+py*dy;
            if(proj<0||proj>range)continue;
            const closestX=startX+dx*proj;
            const closestY=startY+dy*proj;
            const dist=Math.hypot(e.x-closestX,e.y-closestY);
            if(dist<e.radius+beamWidth/2){
                applyHitEffects(e,1);
                createBurst(e.x,e.y,"hit");
                if(player.hasSock) applyPoison(e);
                if(e.hp<=0)killEnemy(e);
            }
        }
    }
}
