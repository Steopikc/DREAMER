/* POISON (носок) */
function applyPoison(e){
    e.poisonTimer=300; // 5 сек замедления
    // каждый хит → +0.5 урона через 1 сек (стакается)
    if(!e.poisonDots) e.poisonDots=[];
    e.poisonDots.push(60); // ~1 сек
}

function updatePoison(e,dt){
    // в инвизе (фонарь) яд не тикает и не проявляется
    if(e.intangible) return;
    if(e.poisonTimer>0) e.poisonTimer-=dt;
    if(!e.poisonDots||!e.poisonDots.length) return;
    for(let i=e.poisonDots.length-1;i>=0;i--){
        e.poisonDots[i]-=dt;
        if(e.poisonDots[i]<=0){
            e.poisonDots.splice(i,1);
            if(!e.dead){
                e.hp-=0.5;
                e.hitFlash=4;
                if(e.hp<=0) killEnemy(e);
            }
        }
    }
}

/* ENEMY AI */
function updateEnemies(dt){
    for(const e of enemies){
        if(e.dead)continue;

        e.anim+=dt;e.hitFlash=Math.max(0,e.hitFlash-dt);
        updatePoison(e,dt);
        if(e.dead)continue;

        const dx=player.x-e.x,dy=player.y-e.y;
        const d=Math.hypot(dx,dy)||1;
        const nx=dx/d,ny=dy/d;
        const pmx=player.lastMoveX||0,pmy=player.lastMoveY||0;
        // яд: −50% скорость
        const spd=e.speed*e.aggression*(e.poisonTimer>0?0.5:1);

        // смена режима поведения
        e.modeTimer-=dt;
        if(e.modeTimer<=0){
            e.mode=randi(0,2);
            e.modeTimer=rand(60,160);
            e.strafeDir=Math.random()<0.5?-1:1;
            e.desiredDist=rand(150,240);
        }
        e.brainTimer-=dt;
        if(e.brainTimer<=0){
            e.strafeDir*=Math.random()<0.7?-1:1;
            e.brainTimer=rand(30,100)*e.jitter;
        }

        const roomTop=78+WALL+e.radius;
        const roomBot=H-WALL-e.radius;
        const roomLeft=WALL+e.radius;
        const roomRight=W-WALL-e.radius;
        if(e.x>=roomLeft&&e.x<=roomRight&&e.y>=roomTop&&e.y<=roomBot) e.enteredMap=true;
        if(e.type==="boss"||e.type==="devil"||e.type==="worm"||e.type==="crystal") e.enteredMap=true;

        // плавный вход с краёв — без телепорта, без атак пока снаружи
        if(!e.enteredMap){
            const cx=W/2, cy=(roomTop+roomBot)/2;
            const margin=50;
            let tx=clamp(player.x, roomLeft+margin, roomRight-margin);
            let ty=clamp(player.y, roomTop+margin, roomBot-margin);
            tx=tx*0.5+cx*0.5;
            ty=ty*0.5+cy*0.5;
            const ax=tx-e.x, ay=ty-e.y, ad=Math.hypot(ax,ay)||1;
            // медленный плавный вход (не влёт)
            const enterSpd=Math.max(spd*0.4,player.speed*0.32);
            e.x+=(ax/ad)*enterSpd*dt;
            e.y+=(ay/ad)*enterSpd*dt;
            e.angle=Math.atan2(ay,ax);
            continue; // не запускаем боевой AI до входа
        }
        /* CHASER */
        else if(e.type==="chaser"){
            let predMul=e.mode===1?55:e.mode===2?25:42;
            const prediction=clamp(d/95,.25,1.3)*e.aggression;
            const txp=player.x+pmx*predMul*prediction+rand(-12,12)*e.jitter;
            const typ=player.y+pmy*predMul*prediction+rand(-12,12)*e.jitter;
            const ax=txp-e.x,ay=typ-e.y,ad=Math.hypot(ax,ay)||1;
            const tx=ax/ad,ty=ay/ad;
            let side=e.mode===2?0.55:(d>100?0.38:0.18);
            if(e.mode===1) side*=0.4; // агрессивный — меньше обхода, больше прямо
            e.x+=(tx+(-ty*e.strafeDir*side))*spd*dt;
            e.y+=(ty+( tx*e.strafeDir*side))*spd*dt;
            // случайный рывок
            if(Math.random()<0.008*e.aggression){e.x+=tx*4;e.y+=ty*4}
            e.angle=Math.atan2(typ-e.y,txp-e.x);
        }

        /* DASHER */
        else if(e.type==="dasher"){
            e.dashTimer-=dt;
            if(Math.abs(e.vx)+Math.abs(e.vy)<.3){
                const prediction=clamp(d/110,.25,1.1);
                const txp=player.x+pmx*50*prediction,typ=player.y+pmy*50*prediction;
                const ax=txp-e.x,ay=typ-e.y,ad=Math.hypot(ax,ay)||1;
                const orbit=e.mode===2?0.5:0.25;
                e.x+=(ax/ad+(-ay/ad*e.strafeDir*orbit))*spd*dt;
                e.y+=(ay/ad+( ax/ad*e.strafeDir*orbit))*spd*dt;
            }
            if(e.dashTimer<=0){
                // иногда бьёт мимо / вбок / с опережением
                let aimX=player.x,aimY=player.y;
                if(e.mode===0){aimX+=pmx*60;aimY+=pmy*60}
                else if(e.mode===2){aimX+=rand(-80,80);aimY+=rand(-80,80)}
                else{aimX+=pmx*40;aimY+=pmy*40}
                const ax=aimX-e.x,ay=aimY-e.y,ad=Math.hypot(ax,ay)||1;
                const dashSpd=7.2+rand(0,2.5)*e.aggression;
                e.vx=ax/ad*dashSpd;e.vy=ay/ad*dashSpd;
                e.dashTimer=rand(70,190)*e.jitter;
                createBurst(e.x,e.y,"dash");
            }
            e.x+=e.vx*dt;e.y+=e.vy*dt;
            e.vx*=Math.pow(.93,dt);e.vy*=Math.pow(.93,dt);
            e.angle=Math.atan2(e.vy||dy,e.vx||dx);
        }

        /* SHOOTER */
        else if(e.type==="shooter"){
            const desired=e.desiredDist;
            if(d>desired+40){e.x+=nx*spd*dt;e.y+=ny*spd*dt}
            else if(d<desired-40){e.x-=nx*spd*dt;e.y-=ny*spd*dt}
            const s=Math.sin(gameTime*.0015+e.phase)*e.strafeDir*(e.mode===2?1.3:0.8);
            e.x+=-ny*s*.85*dt;e.y+=nx*s*.85*dt;
            if(d<140){e.x+=-ny*e.strafeDir*.7*dt;e.y+=nx*e.strafeDir*.7*dt}
            // иногда резко меняет сторону
            if(Math.random()<0.01) e.strafeDir*=-1;

            e.attackTimer-=dt;
            if(e.attackTimer<=0){
                const pred=clamp(d/150,.2,.9)*e.aggression;
                let aimX=player.x+pmx*35*pred,aimY=player.y+pmy*35*pred;
                if(e.mode===2){aimX+=rand(-40,40);aimY+=rand(-40,40)}
                const ax=aimX-e.x,ay=aimY-e.y,ad=Math.hypot(ax,ay)||1;
                enemyShoot(e,ax/ad,ay/ad);
                // иногда двойной выстрел
                if(e.mode===1&&Math.random()<0.4){
                    const spread=0.18;
                    enemyShoot(e,Math.cos(Math.atan2(ay,ax)+spread),Math.sin(Math.atan2(ay,ax)+spread));
                }
                e.attackTimer=Math.max(55,130-wave*2)*rand(0.7,1.3);
            }
            e.angle=Math.atan2(dy,dx);
        }

        /* TANK */
        else if(e.type==="tank"){
            // держит центр, прикрывает стрелков/союзников от игрока
            const cx=W/2, cy=H/2+20;
            // базовая точка — сектор вокруг центра (распыление)
            const slot=e.phase||0;
            const spreadR=50+ (slot%1)*40+20;
            let guardX=cx+Math.cos(slot*2.1)*spreadR;
            let guardY=cy+Math.sin(slot*1.7)*spreadR*0.75;

            // если есть дальний союзник — встать между ним и игроком
            let ally=null, allyD=1e9;
            for(const o of enemies){
                if(o===e||o.dead)continue;
                if(o.type==="shooter"||o.type==="spinner"||o.type==="skeleton"){
                    const od=Math.hypot(o.x-e.x,o.y-e.y);
                    if(od<allyD){allyD=od;ally=o}
                }
            }
            if(ally){
                const adx=ally.x-player.x, ady=ally.y-player.y;
                const adn=Math.hypot(adx,ady)||1;
                // точка на линии игрок→союзник, ближе к союзнику
                guardX=player.x+adx/adn*(adn*0.45);
                guardY=player.y+ady/adn*(adn*0.45);
                // не уходим далеко от центра
                guardX=guardX*0.55+cx*0.45;
                guardY=guardY*0.55+cy*0.45;
            }

            // расталкивание от других танков
            for(const o of enemies){
                if(o===e||o.dead||o.type!=="tank")continue;
                const dxo=e.x-o.x, dyo=e.y-o.y;
                const dist=Math.hypot(dxo,dyo)||0.01;
                if(dist<70){
                    guardX+=(dxo/dist)*(70-dist)*0.5;
                    guardY+=(dyo/dist)*(70-dist)*0.5;
                }
            }

            const ax=guardX-e.x, ay=guardY-e.y, ad=Math.hypot(ax,ay)||1;
            e.x+=(ax/ad)*spd*0.9*dt;
            e.y+=(ay/ad)*spd*0.9*dt;
            e.angle=Math.atan2(player.y-e.y,player.x-e.x);
        }

        /* SPINNER */
        else if(e.type==="spinner"){
            const near=e.mode===1?90:110,far=e.mode===1?140:170;
            if(d>far){e.x+=nx*spd*dt;e.y+=ny*spd*dt}
            else if(d<near){e.x-=nx*spd*dt;e.y-=ny*spd*dt}
            const s=Math.sin(gameTime*.0012+e.phase)*(e.mode===2?1.4:1);
            e.x+=-ny*s*e.strafeDir*.65*dt;
            e.y+= nx*s*e.strafeDir*.65*dt;
            e.angle+=(.02+e.aggression*.01)*dt*(e.strafeDir);

            e.attackTimer-=dt;
            if(e.attackTimer<=0){
                spinnerAttack(e);
                e.attackTimer=Math.max(90,150-wave)*rand(0.8,1.2);
            }
        }

        /* SKELETON — по краям, на расстоянии друг от друга, обстрел по кругу */
        else if(e.type==="skeleton"){
            const desired=e.desiredDist||185;
            const maxRange=220;
            // слот по кругу среди живых скелетов
            let skCount=0, myIdx=0;
            for(const o of enemies){
                if(o.type!=="skeleton"||o.dead)continue;
                if(o===e) myIdx=skCount;
                skCount++;
            }
            const ang=(myIdx/Math.max(skCount,1))*Math.PI*2 + (e.phase||0)*0.15 + gameTime*0.00025;

            // точка вокруг игрока
            let tx=player.x+Math.cos(ang)*desired;
            let ty=player.y+Math.sin(ang)*desired;

            // прижимаем к краям комнаты
            const m=48;
            const roomL=WALL+m, roomR=W-WALL-m;
            const roomT=78+WALL+m, roomB=H-WALL-m;
            tx=clamp(tx,roomL,roomR);
            ty=clamp(ty,roomT,roomB);
            // если всё ещё близко к центру — выталкиваем к ближайшему краю
            const cx=W/2, cy=(78+H)/2;
            if(Math.hypot(tx-cx,ty-cy)<130){
                const n=norm(tx-cx||0.01,ty-cy||0.01);
                tx=clamp(cx+n.x*170,roomL,roomR);
                ty=clamp(cy+n.y*150,roomT,roomB);
            }

            // не кучковаться с другими скелетами
            for(const o of enemies){
                if(o===e||o.dead||o.type!=="skeleton")continue;
                const dxo=e.x-o.x, dyo=e.y-o.y;
                const dist=Math.hypot(dxo,dyo)||0.01;
                if(dist<110){
                    tx+=(dxo/dist)*(110-dist)*0.6;
                    ty+=(dyo/dist)*(110-dist)*0.6;
                }
            }
            tx=clamp(tx,roomL,roomR);
            ty=clamp(ty,roomT,roomB);

            // если игрок вне ренжа — подойти, иначе занять слот по краю
            if(d>maxRange){
                e.x+=nx*spd*1.15*dt;
                e.y+=ny*spd*1.15*dt;
            }else{
                const ax=tx-e.x, ay=ty-e.y, ad=Math.hypot(ax,ay)||1;
                e.x+=(ax/ad)*spd*dt;
                e.y+=(ay/ad)*spd*dt;
            }

            e.angle=Math.atan2(dy,dx);
            e.attackTimer-=dt;
            if(e.attackTimer<=0 && d<=maxRange){
                throwScythe(e);
                e.attackTimer=rand(64,107);
            }
        }

        /* FLYING EYE — по касательной: то ближе, то дальше + лужицы слёз */
        else if(e.type==="flyingeye"){
            e.angle=Math.atan2(dy,dx);
            // хаотично меняем радиус орбиты
            e.orbitRVel=(e.orbitRVel||0)+rand(-0.03,0.03)*dt;
            e.orbitRVel=clamp(e.orbitRVel,-0.55,0.55);
            e.orbitR=(e.orbitR||160)+e.orbitRVel*spd*dt;
            if(e.orbitR<100){e.orbitR=100;e.orbitRVel=Math.abs(e.orbitRVel)}
            if(e.orbitR>210){e.orbitR=210;e.orbitRVel=-Math.abs(e.orbitRVel)}
            // движение по касательной вокруг игрока
            e.orbitAngle=(e.orbitAngle||0)+0.028*dt*(e.orbitDir||1)*(spd/1.1);
            const tx=player.x+Math.cos(e.orbitAngle)*e.orbitR;
            const ty=player.y+Math.sin(e.orbitAngle)*e.orbitR;
            const to=norm(tx-e.x,ty-e.y);
            e.x+=to.x*spd*1.25*dt;
            e.y+=to.y*spd*1.25*dt;

            // лужицы слёз каждые 1.5 сек
            e.tearTimer=(e.tearTimer||0)-dt;
            if(e.tearTimer<=0){
                tearPuddles.push({
                    x:e.x,y:e.y,
                    radius:e.radius,
                    life:180, // 3 сек
                    maxLife:180
                });
                e.tearTimer=90; // 1.5 сек
            }
        }

        /* LASER BOT — встаёт выше/ниже игрока, бьёт вертикальным лазером */
        else if(e.type==="laserbot"){
            e.laserTimer=(e.laserTimer||0)-dt;
            const phase=e.laserPhase||"idle";

            // целевая позиция: та же X что у игрока, Y выше или ниже
            const offsetY=110;
            const targetY=e.preferAbove?player.y-offsetY:player.y+offsetY;
            const targetX=player.x;
            const tdx=targetX-e.x, tdy=targetY-e.y;
            const td=Math.hypot(tdx,tdy)||1;

            if(phase==="idle"||phase==="cooldown"){
                // подстраивается под игрока
                e.x+=(tdx/td)*spd*dt;
                e.y+=(tdy/td)*spd*dt;
                // лёгкий стрейф
                e.x+=Math.sin(gameTime*0.002+e.phase)*0.3*dt;
                if(phase==="idle"&&e.laserTimer<=0&&Math.abs(e.x-player.x)<40){
                    e.laserPhase="charge";
                    e.laserTimer=50; // ~0.8 сек зарядка, глаз краснеет
                }else if(phase==="cooldown"&&e.laserTimer<=0){
                    e.laserPhase="idle";
                    e.preferAbove=Math.random()<0.5;
                    e.laserTimer=rand(20,50);
                }
            }else if(phase==="charge"){
                // почти на месте, донастраивает X
                e.x+=(player.x-e.x)*0.04*dt;
                if(e.laserTimer<=0){
                    e.laserPhase="fire";
                    e.laserTimer=180; // 3 сек лазер
                    e.laserX=e.x; // фиксируем X луча
                }
            }else if(phase==="fire"){
                // стоит, лазер активен
                e.x+=(e.laserX-e.x)*0.08*dt;
                // урон: вертикальная полоса через всю комнату
                const topY=78+WALL, botY=H-WALL;
                const lx=e.laserX!=null?e.laserX:e.x;
                const halfW=8;
                if(player.invincible<=0 &&
                   player.x>lx-halfW-player.radius && player.x<lx+halfW+player.radius &&
                   player.y>topY && player.y<botY){
                    hurtPlayer(0.5);
                }
                if(e.laserTimer<=0){
                    e.laserPhase="cooldown";
                    e.laserTimer=180; // 3 сек кулдаун
                }
            }
        }

        /* LASER BOT H — слева/справа, обычная скорость как у оранжевых */
        else if(e.type==="laserboth"){
            e.laserTimer=(e.laserTimer||0)-dt;
            const phase=e.laserPhase||"idle";
            const offsetX=120;
            const targetX=e.preferLeft?player.x-offsetX:player.x+offsetX;
            const targetY=player.y;
            const tdx=targetX-e.x, tdy=targetY-e.y;
            const td=Math.hypot(tdx,tdy)||1;

            if(phase==="idle"||phase==="cooldown"){
                // обычный ход к точке сбоку на одной Y с игроком
                e.x+=(tdx/td)*spd*dt;
                e.y+=(tdy/td)*spd*dt;
                e.y+=Math.sin(gameTime*0.002+e.phase)*0.3*dt;
                if(phase==="idle"&&e.laserTimer<=0&&Math.abs(e.y-player.y)<40){
                    e.laserPhase="charge";
                    e.laserTimer=50;
                }else if(phase==="cooldown"&&e.laserTimer<=0){
                    e.laserPhase="idle";
                    e.preferLeft=Math.random()<0.5;
                    e.laserTimer=rand(20,50);
                }
            }else if(phase==="charge"){
                // донастраивает Y (как оранжевый донастраивает X)
                e.y+=(player.y-e.y)*0.04*dt;
                if(e.laserTimer<=0){
                    e.laserPhase="fire";
                    e.laserTimer=180;
                    e.laserY=e.y;
                }
            }else if(phase==="fire"){
                e.y+=(e.laserY-e.y)*0.08*dt;
                const leftX=WALL, rightX=W-WALL;
                const ly=e.laserY!=null?e.laserY:e.y;
                const halfH=8;
                if(player.invincible<=0 &&
                   player.y>ly-halfH-player.radius && player.y<ly+halfH+player.radius &&
                   player.x>leftX && player.x<rightX){
                    hurtPlayer(0.5);
                }
                if(e.laserTimer<=0){
                    e.laserPhase="cooldown";
                    e.laserTimer=180;
                }
            }
        }

        /* ANGEL — статуя: хаотичный ход → стоп 2с → 8 лазеров 2с → КД 4с */
        else if(e.type==="angel"){
            e.angelTimer=(e.angelTimer||0)-dt;
            const phase=e.angelPhase||"wander";

            if(phase==="wander"){
                e.wanderTimer=(e.wanderTimer||0)-dt;
                if(e.wanderTimer<=0){
                    e.wanderAngle=rand(0,Math.PI*2);
                    e.wanderTimer=rand(35,80);
                }
                e.x+=Math.cos(e.wanderAngle)*e.speed*dt;
                e.y+=Math.sin(e.wanderAngle)*e.speed*dt;
                // от стен
                const L=WALL+e.radius, R=W-WALL-e.radius;
                const T=78+WALL+e.radius, B=H-WALL-e.radius;
                if(e.x<L||e.x>R){e.wanderAngle=Math.PI-e.wanderAngle;e.x=clamp(e.x,L,R)}
                if(e.y<T||e.y>B){e.wanderAngle=-e.wanderAngle;e.y=clamp(e.y,T,B)}
                if(e.angelTimer<=0){
                    e.angelPhase="stop";
                    e.angelTimer=120; // 2 сек стоп
                }
            }else if(phase==="stop"){
                // стоит 2 сек перед атакой
                if(e.angelTimer<=0){
                    e.angelPhase="fire";
                    e.angelTimer=120; // 2 сек лазер
                    e.laserOriginX=e.x;
                    e.laserOriginY=e.y;
                }
            }else if(phase==="fire"){
                // 8 лазеров от центра статуи
                const ox=e.laserOriginX!=null?e.laserOriginX:e.x;
                const oy=e.laserOriginY!=null?e.laserOriginY:e.y;
                const halfW=7;
                for(let i=0;i<8;i++){
                    const a=i*Math.PI/4;
                    const ca=Math.cos(a), sa=Math.sin(a);
                    // проекция игрока на луч
                    const px=player.x-ox, py=player.y-oy;
                    const along=px*ca+py*sa;
                    if(along<0) continue;
                    const closestX=ox+ca*along, closestY=oy+sa*along;
                    const dist=Math.hypot(player.x-closestX,player.y-closestY);
                    if(dist<halfW+player.radius && player.invincible<=0){
                        hurtPlayer(0.5);
                        break;
                    }
                }
                if(e.angelTimer<=0){
                    e.angelPhase="cooldown";
                    e.angelTimer=240; // 4 сек кулдаун
                }
            }else if(phase==="cooldown"){
                // стоит / слегка дрейфует
                e.x+=Math.cos(e.wanderAngle||0)*e.speed*0.25*dt;
                e.y+=Math.sin(e.wanderAngle||0)*e.speed*0.25*dt;
                if(e.angelTimer<=0){
                    e.angelPhase="wander";
                    e.angelTimer=rand(100,200);
                    e.wanderAngle=rand(0,Math.PI*2);
                }
            }
        }

        /* REAPER — Смерть: медленный ход, веерная тёмная атака */
        else if(e.type==="reaper"){
            e.reaperTimer=(e.reaperTimer||0)-dt;
            const phase=e.reaperPhase||"chase";
            const range=e.slashRange||140;
            const half=e.slashHalf||0.55;

            if(phase==="chase"){
                // скорость как у глаза, держит среднюю дистанцию
                if(d>140){e.x+=nx*spd*dt;e.y+=ny*spd*dt}
                else if(d<90){e.x-=nx*spd*0.6*dt;e.y-=ny*spd*0.6*dt}
                else{
                    e.x+=-ny*e.strafeDir*spd*0.4*dt;
                    e.y+=nx*e.strafeDir*spd*0.4*dt;
                }
                e.angle=Math.atan2(dy,dx);
                if(e.reaperTimer<=0 && d<range+40){
                    e.reaperPhase="telegraph";
                    e.reaperTimer=60; // 1 сек предупреждение
                    e.slashAngle=Math.atan2(dy,dx);
                }
            }else if(phase==="telegraph"){
                // стоит, показывает веер
                e.angle=e.slashAngle;
                // тёмные частицы вдоль дуги телеграфа
                if(Math.random()<0.35){
                    const a=e.slashAngle+rand(-half,half);
                    const rr=rand(40,range*0.85);
                    particles.push({
                        x:e.x+Math.cos(a)*rr,y:e.y+Math.sin(a)*rr,
                        vx:Math.cos(a)*rand(-0.3,0.8),vy:Math.sin(a)*rand(-0.3,0.8),
                        life:14,maxLife:14,size:rand(2,4),type:"reaperFx"
                    });
                }
                if(e.reaperTimer<=0){
                    e.reaperPhase="slash";
                    e.reaperTimer=22; // чуть дольше для анимации
                    e.slashProgress=0;
                    // урон в конусе
                    if(player.invincible<=0){
                        const pa=Math.atan2(player.y-e.y,player.x-e.x);
                        let da=pa-e.slashAngle;
                        while(da>Math.PI) da-=Math.PI*2;
                        while(da<-Math.PI) da+=Math.PI*2;
                        if(Math.abs(da)<=half && d<=range){
                            hurtPlayer(0.5);
                        }
                    }
                    // вспышка дуги косы
                    particles.push({
                        x:e.x,y:e.y,vx:0,vy:0,
                        life:16,maxLife:16,size:6,
                        type:"slashArc",radius:range*0.92,
                        a0:e.slashAngle-half,a1:e.slashAngle+half,
                        color:"#d080ff"
                    });
                    particles.push({
                        x:e.x,y:e.y,vx:0,vy:0,
                        life:12,maxLife:12,size:3,
                        type:"slashArc",radius:range*0.55,
                        a0:e.slashAngle-half*0.7,a1:e.slashAngle+half*0.7,
                        color:"#f0c0ff"
                    });
                    // россыпь тёмной энергии
                    for(let i=0;i<14;i++){
                        const a=e.slashAngle+rand(-half,half);
                        const rr=rand(25,range);
                        particles.push({
                            x:e.x+Math.cos(a)*rr,y:e.y+Math.sin(a)*rr,
                            vx:Math.cos(a)*rand(1,3.5),vy:Math.sin(a)*rand(1,3.5),
                            life:rand(14,24),maxLife:24,size:rand(2,6),type:"reaperFx"
                        });
                    }
                }
            }else if(phase==="slash"){
                e.angle=e.slashAngle;
                e.slashProgress=(e.slashProgress||0)+dt;
                if(e.reaperTimer<=0){
                    e.reaperPhase="chase";
                    e.reaperTimer=rand(100,160);
                    e.strafeDir=Math.random()<0.5?-1:1;
                    e.slashProgress=0;
                }
            }
        }

        /* LANTERN — синий фонарь: невидимость → ренж → удар → пауза */
        else if(e.type==="lantern"){
            e.lanternTimer=(e.lanternTimer||0)-dt;
            const phase=e.lanternPhase||"invisible";

            if(phase==="invisible"){
                e.intangible=true;
                // хаотично, но около игрока (неудобное появление)
                e.wanderTimer=(e.wanderTimer||0)-dt;
                if(e.wanderTimer<=0){
                    e.wanderAngle=rand(0,Math.PI*2);
                    e.wanderTimer=rand(40,100);
                }
                // целевая зона: рядом с игроком (не вплотную)
                const nearR=rand(70,120);
                const nearA=e.phase||0;
                const tx=player.x+Math.cos(nearA+gameTime*0.001)*nearR;
                const ty=player.y+Math.sin(nearA+gameTime*0.0012)*nearR;
                const toP=norm(tx-e.x,ty-e.y);
                const wx=Math.cos(e.wanderAngle), wy=Math.sin(e.wanderAngle);
                // 40% хаос + 60% к зоне у игрока
                e.x+=(wx*0.4+toP.x*0.6)*e.speed*dt;
                e.y+=(wy*0.4+toP.y*0.6)*e.speed*dt;
                // не скучиваться с другими фонарями
                for(const o of enemies){
                    if(o===e||o.dead||o.type!=="lantern")continue;
                    const dxo=e.x-o.x, dyo=e.y-o.y;
                    const dist=Math.hypot(dxo,dyo)||0.01;
                    if(dist<100){
                        e.x+=(dxo/dist)*(100-dist)*0.04*dt;
                        e.y+=(dyo/dist)*(100-dist)*0.04*dt;
                    }
                }
                const L=WALL+e.radius+20, R=W-WALL-e.radius-20;
                const T=78+WALL+e.radius+20, B=H-WALL-e.radius-20;
                if(e.x<L||e.x>R){e.wanderAngle=Math.PI-e.wanderAngle;e.x=clamp(e.x,L,R)}
                if(e.y<T||e.y>B){e.wanderAngle=-e.wanderAngle;e.y=clamp(e.y,T,B)}
                if(e.lanternTimer<=0){
                    e.lanternPhase="telegraph";
                    e.lanternTimer=60;
                    e.intangible=false;
                }
            }else if(phase==="telegraph"){
                e.intangible=false;
                // пульсирующие искры на границе ренжа
                if(Math.random()<0.4){
                    const ar=e.attackRadius||72;
                    const a=rand(0,Math.PI*2);
                    particles.push({
                        x:e.x+Math.cos(a)*ar,y:e.y+Math.sin(a)*ar,
                        vx:Math.cos(a)*rand(-0.5,0.5),vy:Math.sin(a)*rand(-0.5,0.5),
                        life:12,maxLife:12,size:rand(2,4),type:"lanternFx"
                    });
                }
                if(e.lanternTimer<=0){
                    e.lanternPhase="attack";
                    e.lanternTimer=16;
                    const ar=e.attackRadius||72;
                    if(player.invincible<=0 && Math.hypot(player.x-e.x,player.y-e.y)<ar+player.radius){
                        hurtPlayer(0.5);
                    }
                    // взрыв света + кольца
                    for(let k=0;k<2;k++){
                        particles.push({
                            x:e.x,y:e.y,vx:0,vy:0,
                            life:18-k*4,maxLife:18-k*4,size:ar*(0.4+k*0.15),
                            type:"ring",ringColor:k===0?"#80e0ff":"#40a0ff",
                            ringGrow:ar/(18-k*4)*1.1,ringWidth:4-k
                        });
                    }
                    for(let i=0;i<20;i++){
                        const a=i/20*Math.PI*2;
                        particles.push({
                            x:e.x,y:e.y,
                            vx:Math.cos(a)*rand(2,5.5),vy:Math.sin(a)*rand(2,5.5),
                            life:rand(14,24),maxLife:24,size:rand(2,5),type:"lanternFx"
                        });
                    }
                }
            }else if(phase==="attack"){
                e.intangible=false;
                if(e.lanternTimer<=0){
                    e.lanternPhase="idle";
                    e.lanternTimer=180; // 3 сек стоит
                }
            }else if(phase==="idle"){
                e.intangible=false;
                if(e.lanternTimer<=0){
                    e.lanternPhase="invisible";
                    e.lanternTimer=420; // 7 сек невидимость
                    e.intangible=true;
                    e.wanderAngle=rand(0,Math.PI*2);
                }
            }
        }

        /* DEVIL — финальный босс наверху, лучевые паттерны */
        else if(e.type==="devil"){
            e.x=W/2;
            e.y=78+WALL+55;
            e.devilTimer=(e.devilTimer||0)-dt;
            const phase=e.devilPhase||"idle";

            if(phase==="idle"){
                if(e.devilTimer<=0){
                    e.devilPattern=randi(0,19); // + атаки по центру
                    e.devilBeams=buildDevilPattern(e.devilPattern);
                    e.devilPhase="telegraph";
                    e.devilTimer=60; // 1 сек предупреждение
                    e.devilAge=0;
                }
            }else if(phase==="telegraph"){
                e.devilAge=(e.devilAge||0)+dt;
                if(e.devilTimer<=0){
                    e.devilPhase="fire";
                    // длительность = конец последнего шага
                    let maxEnd=90;
                    for(const s of e.devilBeams) maxEnd=Math.max(maxEnd,s.at+s.dur);
                    e.devilTimer=maxEnd;
                    e.devilAge=0;
                }
            }else if(phase==="fire"){
                e.devilAge=(e.devilAge||0)+dt;
                const beams=getActiveDevilBeams(e);
                if(player.invincible<=0){
                    for(const beam of beams){
                        if(devilBeamHit(beam,player.x,player.y,player.radius)){
                            hurtPlayer(0.5);
                            break;
                        }
                    }
                }
                if(e.devilTimer<=0){
                    e.devilPhase="idle";
                    e.devilTimer=rand(40,80); // ещё −0.2 сек
                    e.devilBeams=[];
                }
            }
        }

        /* CRYSTAL — финальный босс: снаряды, радиальные лазеры, лучи карты, взрывы */
        else if(e.type==="crystal"){
            updateCrystal(e,dt);
        }

        /* WALLE — робот: рядом с игроком, раз в 3с рывок по ренжу */
        else if(e.type==="walle"){
            e.walleTimer=(e.walleTimer||0)-dt;
            const phase=e.wallePhase||"chase";
            const WL=WALL+e.radius, WR=W-WALL-e.radius;
            const WT=78+WALL+e.radius, WB=H-WALL-e.radius;
            // дистанция до стены по лучу
            function distToWall(x,y,ang){
                const c=Math.cos(ang), s=Math.sin(ang);
                let t=1e9;
                if(c>0.001) t=Math.min(t,(WR-x)/c);
                if(c<-0.001) t=Math.min(t,(WL-x)/c);
                if(s>0.001) t=Math.min(t,(WB-y)/s);
                if(s<-0.001) t=Math.min(t,(WT-y)/s);
                return Math.max(0,t);
            }
            if(phase==="chase"){
                // слоты вокруг арены / игрока — не кучковаться
                const idx=enemies.filter(o=>o.type==="walle"&&!o.dead).indexOf(e);
                const nWall=Math.max(1,enemies.filter(o=>o.type==="walle"&&!o.dead).length);
                const slotA=(idx/nWall)*Math.PI*2+gameTime*0.0004;
                const slotR=100+idx*18;
                const tx=player.x+Math.cos(slotA)*slotR;
                const ty=player.y+Math.sin(slotA)*slotR;
                const toSlot=norm(tx-e.x,ty-e.y);
                e.x+=toSlot.x*spd*0.85*dt;
                e.y+=toSlot.y*spd*0.85*dt;
                // расталкивание от других Валли
                for(const o of enemies){
                    if(o===e||o.dead||o.type!=="walle")continue;
                    const dxo=e.x-o.x, dyo=e.y-o.y;
                    const dist=Math.hypot(dxo,dyo)||0.01;
                    if(dist<95){
                        e.x+=(dxo/dist)*(95-dist)*0.05*dt;
                        e.y+=(dyo/dist)*(95-dist)*0.05*dt;
                    }
                }
                e.x=clamp(e.x,WL,WR);e.y=clamp(e.y,WT,WB);
                e.angle=Math.atan2(dy,dx);
                if(e.walleTimer<=0){
                    e.wallePhase="telegraph";
                    e.walleTimer=60;
                    // цель: в игрока или чуть вперёд по его движению
                    let aimX=player.x, aimY=player.y;
                    if(Math.random()<0.5){
                        // чуть вперёд (предсказание)
                        const lead=55+rand(0,30);
                        aimX+=player.faceX*lead;
                        aimY+=player.faceY*lead;
                    }
                    e.chargeAng=Math.atan2(aimY-e.y,aimX-e.x);
                    // длина до стены, не дальше
                    const maxLen=distToWall(e.x,e.y,e.chargeAng)-4;
                    e.chargeLen=Math.max(40,Math.min(160,maxLen));
                    e.chargeTraveled=0;
                }
            }else if(phase==="telegraph"){
                e.angle=e.chargeAng;
                // на телеграфе тоже подрезаем длину (если сдвинулся)
                const maxLen=distToWall(e.x,e.y,e.chargeAng)-4;
                e.chargeLen=Math.max(40,Math.min(e.chargeLen||160,maxLen));
                if(e.walleTimer<=0){
                    e.wallePhase="charge";
                    e.walleTimer=90;
                }
            }else if(phase==="charge"){
                const cs=e.chargeSpeed||player.speed*2.2;
                const step=cs*dt;
                e.x+=Math.cos(e.chargeAng)*step;
                e.y+=Math.sin(e.chargeAng)*step;
                e.chargeTraveled=(e.chargeTraveled||0)+step;
                if(e.x<WL||e.x>WR||e.y<WT||e.y>WB){
                    e.x=clamp(e.x,WL,WR);e.y=clamp(e.y,WT,WB);
                    e.wallePhase="chase";
                    e.walleTimer=180;
                    e.strafeDir=Math.random()<0.5?-1:1;
                }else if(e.chargeTraveled>=e.chargeLen){
                    e.wallePhase="chase";
                    e.walleTimer=180;
                    e.strafeDir=Math.random()<0.5?-1:1;
                }
            }
        }

        /* COWBOY — края арены, рикошет-выстрел */
        else if(e.type==="cowboy"){
            e.cowboyTimer=(e.cowboyTimer||0)-dt;
            const phase=e.cowboyPhase||"patrol";
            const L=WALL+e.radius+18, R=W-WALL-e.radius-18;
            const T=78+WALL+e.radius+18, B=H-WALL-e.radius-18;
            // слоты по периметру
            const cowboys=enemies.filter(o=>o.type==="cowboy"&&!o.dead);
            const idx=Math.max(0,cowboys.indexOf(e));
            const n=Math.max(1,cowboys.length);
            const perim=2*((R-L)+(B-T));
            const t=((idx+0.5)/n+gameTime*0.00008)%1;
            let dist=t*perim, tx=L, ty=T;
            const w=R-L, h=B-T;
            if(dist<w){tx=L+dist;ty=T}
            else if(dist<w+h){tx=R;ty=T+(dist-w)}
            else if(dist<w+h+w){tx=R-(dist-w-h);ty=B}
            else{tx=L;ty=B-(dist-w-h-w)}
            if(phase==="patrol"){
                const to=norm(tx-e.x,ty-e.y);
                e.x+=to.x*spd*0.9*dt;
                e.y+=to.y*spd*0.9*dt;
                // расталкивание
                for(const o of cowboys){
                    if(o===e)continue;
                    const dxo=e.x-o.x, dyo=e.y-o.y;
                    const dd=Math.hypot(dxo,dyo)||0.01;
                    if(dd<90){e.x+=(dxo/dd)*(90-dd)*0.04*dt;e.y+=(dyo/dd)*(90-dd)*0.04*dt}
                }
                e.x=clamp(e.x,L,R);e.y=clamp(e.y,T,B);
                e.angle=Math.atan2(dy,dx);
                if(e.cowboyTimer<=0){
                    e.cowboyPhase="telegraph";
                    e.cowboyTimer=55;
                    e.shotAng=pickCowboyShotAng(e.x,e.y);
                    e.shotPath=getRicochetPath(e.x,e.y,e.shotAng,2);
                }
            }else if(phase==="telegraph"){
                e.angle=e.shotAng;
                e.shotPath=getRicochetPath(e.x,e.y,e.shotAng,2);
                if(e.cowboyTimer<=0){
                    e.cowboyPhase="patrol";
                    e.cowboyTimer=rand(130,208); // +30% к 100–160
                    const baseSpd=4.2*0.7; // −30% скорости
                    const c=Math.cos(e.shotAng), s=Math.sin(e.shotAng);
                    enemyBullets.push({
                        type:"cowboy",
                        x:e.x+c*12,y:e.y+s*12,
                        vx:c*baseSpd,vy:s*baseSpd,
                        radius:6,damage:0.25,
                        baseSpeed:baseSpd,
                        bounceCount:0,maxBounces:2,
                        life:600,trail:[]
                    });
                }
            }
        }

        /* EV9 — далёкий «мирный» робот, раз в 5с ярость: 5 кругов-взрывов */
        else if(e.type==="ev9"){
            e.evTimer=(e.evTimer||0)-dt;
            e.evShotCd=Math.max(0,(e.evShotCd||0)-dt);
            if(!e.evMarkers) e.evMarkers=[];
            const phase=e.evPhase||"idle";
            const L=WALL+e.radius+30, R=W-WALL-e.radius-30;
            const T=78+WALL+e.radius+30, B=H-WALL-e.radius-30;

            // обновление маркеров взрыва
            for(let mi=e.evMarkers.length-1;mi>=0;mi--){
                const m=e.evMarkers[mi];
                m.timer-=dt;
                if(m.timer<=0){
                    // взрыв
                    const dist=Math.hypot(player.x-m.x,player.y-m.y);
                    if(player.invincible<=0 && dist<m.r+player.radius){
                        hurtPlayer(0.5);
                    }
                    createBurst(m.x,m.y,"boss");
                    for(let k=0;k<8;k++){
                        const a=k*Math.PI/4;
                        particles.push({
                            x:m.x,y:m.y,
                            vx:Math.cos(a)*rand(1,3),vy:Math.sin(a)*rand(1,3),
                            life:16,maxLife:16,size:rand(2,5),type:"magic"
                        });
                    }
                    e.evMarkers.splice(mi,1);
                }
            }

            if(phase==="idle"){
                // держится вдалеке от игрока
                const homeR=Math.min(W,H)*0.32;
                const hx=W/2+Math.cos(e.evHomeAng||0)*homeR;
                const hy=(78+H)/2+Math.sin(e.evHomeAng||0)*homeR;
                // если игрок близко — отползает
                if(d<160){
                    e.x-=nx*spd*1.1*dt;e.y-=ny*spd*1.1*dt;
                }else{
                    const to=norm(hx-e.x,hy-e.y);
                    e.x+=to.x*spd*0.6*dt;e.y+=to.y*spd*0.6*dt;
                }
                e.x=clamp(e.x,L,R);e.y=clamp(e.y,T,B);
                e.angle=Math.atan2(dy,dx);
                if(e.evTimer<=0){
                    e.evPhase="rage";
                    e.evShots=0;
                    e.evShotCd=0;
                    e.evTimer=400; // запас на серию
                }
            }else if(phase==="rage"){
                // стоит / слегка дрожит на месте
                e.x+=rand(-0.3,0.3);e.y+=rand(-0.3,0.3);
                e.x=clamp(e.x,L,R);e.y=clamp(e.y,T,B);
                // до 5 кругов: телеграф 1с → взрыв
                if(e.evShots<5 && e.evShotCd<=0){
                    const r=48;
                    // центр и радиус не выходят за стены
                    const mx=clamp(player.x+rand(-8,8), WALL+r, W-WALL-r);
                    const my=clamp(player.y+rand(-8,8), 78+WALL+r, H-WALL-r);
                    e.evMarkers.push({
                        x:mx,y:my,r:r,
                        timer:60 // 1 сек
                    });
                    e.evShots++;
                    e.evShotCd=14; // интервал между кругами
                }
                if(e.evShots>=5 && e.evMarkers.length===0){
                    e.evPhase="idle";
                    e.evTimer=300; // 5 сек до следующей ярости
                    e.evHomeAng=rand(0,Math.PI*2);
                }
            }
        }

        else if(e.type==="boss")updateBoss(e,dt);
        else if(e.type==="worm")updateWorm(e,dt);

        // контактный урон (невидимый фонарь неосязаем)
        if(player.invincible<=0 && !e.intangible && e.type!=="devil"){
            let hit=false, hx=e.x, hy=e.y;
            if(e.type==="worm" && e.segments && e.segments.length){
                for(const s of e.segments){
                    if(Math.hypot(player.x-s.x,player.y-s.y)<(s.r||e.segR||16)+player.radius){
                        hit=true;hx=s.x;hy=s.y;break;
                    }
                }
            }else if(circleHit(e,player)){
                hit=true;hx=e.x;hy=e.y;
            }
            if(hit){
                hurtPlayer(e.damage);
                const p=norm(player.x-hx,player.y-hy);
                player.x+=p.x*20;player.y+=p.y*20;
            }
        }

        // лёгкое расталкивание мобов — не накладываются полностью
        if(e.type!=="boss"&&e.type!=="worm"&&e.type!=="devil"&&e.type!=="crystal"){
            for(const o of enemies){
                if(o===e||o.dead||o.type==="boss"||o.type==="worm"||o.type==="devil"||o.type==="crystal")continue;
                const dxo=e.x-o.x, dyo=e.y-o.y;
                const dist=Math.hypot(dxo,dyo)||0.01;
                const minD=(e.radius+o.radius)*0.85;
                if(dist<minD){
                    const push=(minD-dist)*0.35;
                    e.x+=(dxo/dist)*push;
                    e.y+=(dyo/dist)*push;
                }
            }
        }

        // после входа — не выходить за стены
        if(e.type!=="boss"){
            if(e.enteredMap){
                e.x=clamp(e.x,roomLeft,roomRight);
                e.y=clamp(e.y,roomTop,roomBot);
                if(e.x<=roomLeft||e.x>=roomRight) e.vx=0;
                if(e.y<=roomTop||e.y>=roomBot) e.vy=0;
            }else{
                e.x=clamp(e.x,-80,W+80);
                e.y=clamp(e.y,-80,H+80);
            }
        }else{
            e.x=clamp(e.x,roomLeft,roomRight);
            e.y=clamp(e.y,roomTop,roomBot);
        }
    }
}

function enemyShoot(e,nx,ny){
    const speed=(2.8+wave*.045)*0.9; // −10% скорость снарядов врагов
    enemyBullets.push({
        x:e.x+nx*e.radius,y:e.y+ny*e.radius,
        vx:nx*speed,vy:ny*speed,radius:5,life:9999,color:"purple",trail:[]
    });
    createBurst(e.x+nx*e.radius,e.y+ny*e.radius,"magic");
}

function spinnerAttack(e){
    for(let i=0;i<8;i++){
        const a=e.angle+i*Math.PI/4;
        enemyBullets.push({
            x:e.x+Math.cos(a)*e.radius,y:e.y+Math.sin(a)*e.radius,
            vx:Math.cos(a)*2.34,vy:Math.sin(a)*2.34,
            radius:4.5,life:9999,color:"red",trail:[]
        });
    }
    createBurst(e.x,e.y,"circle");
}

function hasActiveScythe(owner){
    for(const b of enemyBullets){
        if(b.type==="scythe"&&b.owner===owner) return true;
    }
    return false;
}

function throwScythe(e){
    if(hasActiveScythe(e)) return; // пока коса в полёте — нельзя кидать снова
    const sx=e.x, sy=e.y;
    const n=norm(player.x-sx,player.y-sy);
    const spd=1.35*1.2*1.2*1.1; // +10%
    enemyBullets.push({
        type:"scythe",
        x:sx+n.x*e.radius,y:sy+n.y*e.radius,
        vx:n.x*spd,vy:n.y*spd,
        radius:11,
        phase:"out",
        originX:sx,originY:sy,
        owner:e,
        maxDist:216,
        spin:0,
        age:0,
        trail:[],
        damage:0.25
    });
    createBurst(sx,sy,"magic");
}

/* BOSS */
function updateBoss(e,dt){
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    const nx=dx/d,ny=dy/d;
    e.angle=Math.atan2(dy,dx);

    // пороги ярости: 75% / 50% / 25% HP → 7 секунд круговых атак
    const hpPct=(e.hp/e.maxHp)*100;
    if(!e.rageTriggered[75] && hpPct<=75){
        e.rageTriggered[75]=true;
        startBossRage(e);
    }else if(!e.rageTriggered[50] && hpPct<=50){
        e.rageTriggered[50]=true;
        startBossRage(e);
    }else if(!e.rageTriggered[25] && hpPct<=25){
        e.rageTriggered[25]=true;
        startBossRage(e);
    }

    const inRage=e.rageTimer>0;
    let moveSpd=inRage?e.speed*1.35:e.speed;
    if(e.poisonTimer>0) moveSpd*=0.5;

    if(d>230){
        e.x+=nx*moveSpd*dt;e.y+=ny*moveSpd*dt;
    }else{
        const s=Math.sin(gameTime*.0012);
        e.x+=-ny*s*(inRage?0.85:0.55)*dt;e.y+=nx*s*(inRage?0.85:0.55)*dt;
    }

    if(inRage){
        e.rageTimer-=dt;
        e.ragePulse-=dt;
        // периодические круговые залпы во время ярости
        if(e.ragePulse<=0){
            bossRageCircleAttack(e);
            e.ragePulse=45; // ~0.75 сек между залпами
        }
        // обычный таймер атак не крутим в ярости — только круги
        return;
    }

    e.attackTimer-=dt;

    if(e.attackTimer<=0){
        const a=randi(0,2);
        if(a===0)bossTargetAttack(e);
        if(a===1)bossFanAttack(e);
        if(a===2)bossCircleAttack(e);
        e.attackTimer=110;
    }
}

function startBossRage(e){
    e.rageTimer=420; // ~7 секунд
    e.ragePulse=0;   // сразу первый залп
    e.hitFlash=12;
    showMessage("ЯРОСТЬ!");
    createBurst(e.x,e.y,"boss");
}

function bossRageCircleAttack(e){
    // плотнее обычного круга — 12 снарядов
    for(let i=0;i<12;i++){
        const a=i*Math.PI*2/12+e.angle*0.15;
        enemyBullets.push({
            x:e.x+Math.cos(a)*e.radius,y:e.y+Math.sin(a)*e.radius,
            vx:Math.cos(a)*2.1,vy:Math.sin(a)*2.1,
            radius:5.5,life:9999,color:"red",trail:[]
        });
    }
    createBurst(e.x,e.y,"circle");
}

function bossTargetAttack(e){
    for(let i=-1;i<=1;i++){
        const a=e.angle+i*.13;
        enemyBullets.push({
            x:e.x+Math.cos(a)*e.radius,y:e.y+Math.sin(a)*e.radius,
            vx:Math.cos(a)*3.0,vy:Math.sin(a)*3.0,
            radius:6,life:9999,color:"red",trail:[]
        });
    }
    createBurst(e.x,e.y,"boss");
}

function bossFanAttack(e){
    // меньше зарядов, шире разлёт — проще уклоняться
    for(let i=-2;i<=2;i++){
        const a=e.angle+i*.32;
        enemyBullets.push({
            x:e.x+Math.cos(a)*e.radius,y:e.y+Math.sin(a)*e.radius,
            vx:Math.cos(a)*2.25,vy:Math.sin(a)*2.25,
            radius:5,life:9999,color:"red",trail:[]
        });
    }
    createBurst(e.x,e.y,"boss");
}

function bossCircleAttack(e){
    // 8 зарядов вместо 14
    for(let i=0;i<8;i++){
        const a=i*Math.PI*2/8;
        enemyBullets.push({
            x:e.x+Math.cos(a)*e.radius,y:e.y+Math.sin(a)*e.radius,
            vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8,
            radius:5,life:9999,color:"purple",trail:[]
        });
    }
    createBurst(e.x,e.y,"circle");
}

/* CRYSTAL — финальный босс */
function crystalShoot(e,ang,spd,rad){
    enemyBullets.push({
        x:e.x+Math.cos(ang)*e.radius,y:e.y+Math.sin(ang)*e.radius,
        vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
        radius:rad||5.5,life:9999,color:"cyan",trail:[]
    });
}
function crystalIdleCd(){return rand(12,28)} // короткая пауза между атаками

function updateCrystal(e,dt){
    e.crystalSpin=(e.crystalSpin||0)+0.018*dt;
    e.crystalTimer=(e.crystalTimer||0)-dt;
    const phase=e.crystalPhase||"idle";
    const roomTop=78+WALL+e.radius;
    const roomBot=H-WALL-e.radius;
    const roomLeft=WALL+e.radius;
    const roomRight=W-WALL-e.radius;

    // дрейф в верхней зоне (не в центр — чтобы не наезжать на игрока у баффов)
    const cx=W/2, cy=78+WALL+110;
    const tx=cx+(player.x-cx)*0.12;
    const ty=cy+(player.y-cy)*0.06;
    const ax=tx-e.x, ay=ty-e.y, ad=Math.hypot(ax,ay)||1;
    if(phase==="idle"||phase==="telegraph"){
        e.x+=(ax/ad)*e.speed*dt;
        e.y+=(ay/ad)*e.speed*dt;
    }
    e.x=clamp(e.x,roomLeft,roomRight);
    e.y=clamp(e.y,roomTop,roomBot);
    e.angle=Math.atan2(player.y-e.y,player.x-e.x);

    // обновление маркеров взрывов (в т.ч. «догоняющие»)
    if(e.crystalMarkers&&e.crystalMarkers.length){
        for(let i=e.crystalMarkers.length-1;i>=0;i--){
            const m=e.crystalMarkers[i];
            if(m.chase){
                // слегка тянется к игроку пока тикает
                const cd=Math.hypot(player.x-m.x,player.y-m.y)||1;
                m.x+=(player.x-m.x)/cd*0.9*dt;
                m.y+=(player.y-m.y)/cd*0.9*dt;
            }
            if(m.maxTimer==null) m.maxTimer=m.timer;
            m.timer-=dt;
            if(m.timer<=0){
                // ===== эффект взрыва кристалла =====
                const R=m.r||48;
                for(let k=0;k<4;k++){
                    particles.push({
                        x:m.x,y:m.y,vx:0,vy:0,
                        life:26-k*4,maxLife:26-k*4,size:R*(0.25+k*0.12),
                        type:"ring",ringColor:k%2===0?"#80e8ff":"#40b0ff",
                        ringGrow:R/(26-k*4)*1.35,ringWidth:5-k*0.8
                    });
                }
                particles.push({
                    x:m.x,y:m.y,vx:0,vy:0,
                    life:12,maxLife:12,size:10,
                    type:"ring",ringColor:"#e8ffff",ringGrow:R/12*0.85,ringWidth:3
                });
                for(let k=0;k<22;k++){
                    const a=k/22*Math.PI*2+rand(-0.1,0.1);
                    const sp=rand(2.5,7);
                    particles.push({
                        x:m.x+Math.cos(a)*8,y:m.y+Math.sin(a)*8,
                        vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
                        life:rand(18,34),maxLife:34,size:rand(2.5,6.5),type:"magic"
                    });
                }
                for(let k=0;k<16;k++){
                    const a=rand(0,Math.PI*2);
                    particles.push({
                        x:m.x,y:m.y,
                        vx:Math.cos(a)*rand(0.5,3.5),vy:Math.sin(a)*rand(0.5,3.5)-rand(0.5,2),
                        life:rand(10,22),maxLife:22,size:rand(2,5),type:"spark",color:"#a0e8ff"
                    });
                }
                createBurst(m.x,m.y,"boss");
                for(let k=0;k<6;k++){
                    particles.push({
                        x:m.x+rand(-6,6),y:m.y+rand(-6,6),
                        vx:rand(-1,1),vy:rand(-1,1),
                        life:8,maxLife:8,size:rand(8,16),type:"beam"
                    });
                }
                if(player.invincible<=0 && Math.hypot(player.x-m.x,player.y-m.y)<R+player.radius){
                    hurtPlayer(0.5);
                }
                e.crystalMarkers.splice(i,1);
            }
        }
    }

    // во время огня: доп. тикающие залпы (спирaль / burst-волны)
    if(phase==="fire" && e.crystalPulseCd!=null){
        e.crystalPulseCd-=dt;
        if(e.crystalPulseCd<=0 && e.crystalAtk===4){
            // спираль: 2 снаряда за тик
            const a0=e.crystalSpin*3+(e.crystalPulseN||0)*0.55;
            crystalShoot(e,a0,2.4,5);
            crystalShoot(e,a0+Math.PI,2.4,5);
            e.crystalPulseN=(e.crystalPulseN||0)+1;
            e.crystalPulseCd=14; // медленнее спираль
        }
        if(e.crystalPulseCd<=0 && e.crystalAtk===5){
            // волны: 3 залпа веером в игрока
            const base=Math.atan2(player.y-e.y,player.x-e.x);
            for(let i=-2;i<=2;i++) crystalShoot(e,base+i*0.22,3.0,5.5);
            e.crystalPulseN=(e.crystalPulseN||0)+1;
            e.crystalPulseCd=28; // медленнее между веерами
        }
    }

    if(phase==="idle"){
        if(e.crystalTimer<=0){
            // 0..7 — больше разнообразия; избегаем повтора той же атаки
            let atk=randi(0,7);
            if(atk===(e.lastCrystalAtk||-1)) atk=(atk+1+randi(0,3))%8;
            e.lastCrystalAtk=atk;
            e.crystalAtk=atk;
            e.crystalPhase="telegraph";
            e.crystalAge=0;
            e.crystalPulseCd=null;
            e.crystalPulseN=0;
            e.crystalRaySpin=0;

            if(atk===0){
                // быстрый залп снарядов
                e.crystalTimer=22;
            }else if(atk===1){
                // радиальные лазеры (статичные)
                e.crystalRayAng=rand(0,Math.PI/4);
                e.crystalTimer=32;
            }else if(atk===2){
                // лучи на карте
                e.crystalBeams=buildDevilPattern(randi(0,19));
                e.crystalTimer=36;
                e.crystalAge=0;
            }else if(atk===3){
                // круги-взрывы (быстрее)
                e.crystalMarkers=e.crystalMarkers||[];
                const n=randi(4,7);
                for(let i=0;i<n;i++){
                    const ang=rand(0,Math.PI*2);
                    const dist=rand(40,150);
                    const tm=38+i*6;
                    e.crystalMarkers.push({
                        x:clamp(player.x+Math.cos(ang)*dist*0.45+rand(-30,30),WALL+28,W-WALL-28),
                        y:clamp(player.y+Math.sin(ang)*dist*0.45+rand(-30,30),78+WALL+28,H-WALL-28),
                        r:rand(38,55),
                        timer:tm,maxTimer:tm
                    });
                }
                e.crystalMarkers.push({x:player.x,y:player.y,r:48,timer:48,maxTimer:48});
                e.crystalTimer=55;
            }else if(atk===4){
                // спираль снарядов
                e.crystalTimer=20;
            }else if(atk===5){
                // волны вееров
                e.crystalTimer=20;
            }else if(atk===6){
                // вращающиеся радиальные лазеры
                e.crystalRayAng=rand(0,Math.PI);
                e.crystalRaySpin=(Math.random()<0.5?1:-1)*0.008; // медленнее вращение
                e.crystalTimer=28;
            }else{
                // догоняющие бомбы + 1–2 обычных круга
                e.crystalMarkers=e.crystalMarkers||[];
                for(let i=0;i<3;i++){
                    const tm=50+i*12;
                    e.crystalMarkers.push({
                        x:player.x+rand(-50,50),y:player.y+rand(-50,50),
                        r:44,timer:tm,maxTimer:tm,chase:true
                    });
                }
                e.crystalMarkers.push({
                    x:clamp(e.x+rand(-80,80),WALL+30,W-WALL-30),
                    y:clamp(e.y+rand(-80,80),78+WALL+30,H-WALL-30),
                    r:52,timer:40,maxTimer:40
                });
                e.crystalTimer=50;
            }
        }
    }else if(phase==="telegraph"){
        e.crystalAge=(e.crystalAge||0)+dt;
        if(e.crystalTimer<=0){
            e.crystalPhase="fire";
            const atk=e.crystalAtk;
            if(atk===0){
                const kind=randi(0,3);
                if(kind===0){
                    // 3 быстрых одиночных подряд почти сразу
                    const n=norm(player.x-e.x,player.y-e.y);
                    for(let k=0;k<3;k++){
                        enemyBullets.push({
                            x:e.x+n.x*e.radius,y:e.y+n.y*e.radius,
                            vx:n.x*(3.6+k*0.15),vy:n.y*(3.6+k*0.15),
                            radius:6.5,life:9999,color:"cyan",trail:[]
                        });
                    }
                }else if(kind===1){
                    const base=Math.atan2(player.y-e.y,player.x-e.x);
                    for(let i=-4;i<=4;i++) crystalShoot(e,base+i*0.24,2.9,5.5);
                }else if(kind===2){
                    for(let i=0;i<14;i++) crystalShoot(e,i*Math.PI*2/14+e.crystalSpin,2.2,5);
                }else{
                    // крест + диагонали
                    for(let i=0;i<8;i++) crystalShoot(e,i*Math.PI/4+e.crystalSpin*0.5,2.7,5.5);
                }
                createBurst(e.x,e.y,"boss");
                e.crystalTimer=10;
            }else if(atk===1){
                e.crystalTimer=70; // ~1.15 сек
            }else if(atk===2){
                let maxEnd=70;
                for(const s of (e.crystalBeams||[])) maxEnd=Math.max(maxEnd,s.at+s.dur);
                e.crystalTimer=maxEnd;
                e.crystalAge=0;
            }else if(atk===3||atk===7){
                e.crystalTimer=70;
            }else if(atk===4){
                e.crystalPulseCd=0;
                e.crystalPulseN=0;
                e.crystalTimer=75; // спираль ~1.25 сек
            }else if(atk===5){
                e.crystalPulseCd=0;
                e.crystalPulseN=0;
                e.crystalTimer=60;
            }else if(atk===6){
                e.crystalTimer=85; // вращающиеся лазеры
            }
        }
    }else if(phase==="fire"){
        e.crystalAge=(e.crystalAge||0)+dt;
        const atk=e.crystalAtk;

        if(atk===1||atk===6){
            if(atk===6) e.crystalRayAng=(e.crystalRayAng||0)+(e.crystalRaySpin||0.008)*dt;
            const halfW=atk===6?7:8;
            const nRays=atk===6?6:8;
            for(let i=0;i<nRays;i++){
                const a=(e.crystalRayAng||0)+i*(Math.PI*2/nRays);
                const ca=Math.cos(a), sa=Math.sin(a);
                const px=player.x-e.x, py=player.y-e.y;
                const along=px*ca+py*sa;
                if(along<0) continue;
                const closestX=e.x+ca*along, closestY=e.y+sa*along;
                if(Math.hypot(player.x-closestX,player.y-closestY)<halfW+player.radius && player.invincible<=0){
                    hurtPlayer(0.5);
                    break;
                }
            }
        }else if(atk===2){
            const steps=e.crystalBeams||[];
            const age=e.crystalAge||0;
            if(player.invincible<=0){
                outer: for(const s of steps){
                    if(age>=s.at && age<s.at+s.dur){
                        for(const b of s.beams){
                            if(devilBeamHit(b,player.x,player.y,player.radius)){
                                hurtPlayer(0.5);
                                break outer;
                            }
                        }
                    }
                }
            }
        }

        const markersDone=!e.crystalMarkers||e.crystalMarkers.length===0;
        if(e.crystalTimer<=0 && (atk===3||atk===7?markersDone:true)){
            e.crystalPhase="idle";
            e.crystalTimer=crystalIdleCd();
            e.crystalBeams=[];
            e.crystalPulseCd=null;
        }
    }

    // контактный урон
    if(player.invincible<=0 && circleHit(e,player)){
        hurtPlayer(e.damage);
        const p=norm(player.x-e.x,player.y-e.y);
        player.x+=p.x*18;player.y+=p.y*18;
    }
}

/* WORM BOSS — песочный червь */
function wormPathPoint(pattern,t,L,R,T,B){
    const cx=(L+R)/2, cy=(T+B)/2;
    const w=R-L, h=B-T;
    t=((t%1)+1)%1;
    if(pattern===0){ // круг — почти вся арена
        const a=t*Math.PI*2;
        return {x:cx+Math.cos(a)*w*0.48, y:cy+Math.sin(a)*h*0.48};
    }
    if(pattern===1){ // вертикальная восьмёрка
        const a=t*Math.PI*2;
        return {x:cx+Math.sin(a)*w*0.44, y:cy+Math.sin(2*a)*h*0.47};
    }
    if(pattern===2){ // Z на всю карту
        if(t<1/3){const u=t*3;return {x:L+u*w, y:T}}
        if(t<2/3){const u=(t-1/3)*3;return {x:R-u*w, y:T+u*h}}
        {const u=(t-2/3)*3;return {x:L+u*w, y:B}}
    }
    if(pattern===3){ // обратная Z
        if(t<1/3){const u=t*3;return {x:R-u*w, y:T}}
        if(t<2/3){const u=(t-1/3)*3;return {x:L+u*w, y:T+u*h}}
        {const u=(t-2/3)*3;return {x:R-u*w, y:B}}
    }
    if(pattern===4){ // змейка снизу вверх (плотная)
        const rows=7, seg=1/rows;
        const row=Math.min(rows-1,Math.floor(t/seg));
        const u=(t-row*seg)/seg;
        const y=B-h*(row+0.5)/rows;
        const goRight=row%2===0;
        return {x:goRight?L+u*w:R-u*w, y:y};
    }
    if(pattern===5){ // змейка сверху вниз
        const rows=7, seg=1/rows;
        const row=Math.min(rows-1,Math.floor(t/seg));
        const u=(t-row*seg)/seg;
        const y=T+h*(row+0.5)/rows;
        const goRight=row%2===0;
        return {x:goRight?L+u*w:R-u*w, y:y};
    }
    if(pattern===6){ // змейка справа налево
        const cols=7, seg=1/cols;
        const col=Math.min(cols-1,Math.floor(t/seg));
        const u=(t-col*seg)/seg;
        const x=R-w*(col+0.5)/cols;
        const goDown=col%2===0;
        return {x:x, y:goDown?T+u*h:B-u*h};
    }
    if(pattern===7){ // змейка слева направо
        const cols=7, seg=1/cols;
        const col=Math.min(cols-1,Math.floor(t/seg));
        const u=(t-col*seg)/seg;
        const x=L+w*(col+0.5)/cols;
        const goDown=col%2===0;
        return {x:x, y:goDown?T+u*h:B-u*h};
    }
    if(pattern===8){ // горизонтальная восьмёрка
        const a=t*Math.PI*2;
        return {x:cx+Math.sin(2*a)*w*0.46, y:cy+Math.sin(a)*h*0.42};
    }
    if(pattern===9){ // спираль от центра к краю и обратно
        const a=t*Math.PI*4;
        const r=t<0.5?(t*2):(1-(t-0.5)*2);
        return {x:cx+Math.cos(a)*w*0.48*r, y:cy+Math.sin(a)*h*0.48*r};
    }
    if(pattern===10){ // X / крест по диагоналям
        if(t<0.25){const u=t/0.25;return {x:L+u*w, y:T+u*h}}
        if(t<0.5){const u=(t-0.25)/0.25;return {x:R-u*w, y:B-u*h}}
        if(t<0.75){const u=(t-0.5)/0.25;return {x:L+u*w, y:B-u*h}}
        {const u=(t-0.75)/0.25;return {x:R-u*w, y:T+u*h}}
    }
    // pattern 11: периметр по часовой (вся рамка арены)
    {
        const per=2*(w+h);
        const d=t*per;
        if(d<w) return {x:L+d, y:T};
        if(d<w+h) return {x:R, y:T+(d-w)};
        if(d<2*w+h) return {x:R-(d-w-h), y:B};
        return {x:L, y:B-(d-2*w-h)};
    }
}

function wormBuildPath(pattern,L,R,T,B){
    const n=140, pts=[];
    for(let i=0;i<=n;i++) pts.push(wormPathPoint(pattern,i/n,L,R,T,B));
    return pts;
}

function wormPickNextPattern(cur){
    let p;
    do{p=randi(0,11)}while(p===cur && Math.random()<0.9);
    return p;
}

function updateWorm(e,dt){
    const L=WALL+e.segR+6, R=W-WALL-e.segR-6;
    const T=78+WALL+e.segR+6, B=H-WALL-e.segR-6;
    const moveSpd=(e.wormMoveSpd!=null?e.wormMoveSpd:5.6)*dt; // быстрее

    // инициализация
    if(!e.wormReady){
        e.wormPattern=randi(0,11);
        e.wormPts=wormBuildPath(e.wormPattern,L,R,T,B);
        e.wormIdx=0;
        e.wormPhase="path"; // path | transit
        e.wormReady=true;
        e.x=e.wormPts[0].x;e.y=e.wormPts[0].y;
    }

    let remain=moveSpd;
    while(remain>0.01){
        if(e.wormPhase==="transit"){
            const tx=e.wormTransitX, ty=e.wormTransitY;
            const dx=tx-e.x, dy=ty-e.y;
            const d=Math.hypot(dx,dy)||0.01;
            if(d<=remain+2){
                e.x=tx;e.y=ty;
                remain-=d;
                e.wormPhase="path";
                e.wormIdx=0;
            }else{
                e.x+=dx/d*remain;e.y+=dy/d*remain;
                remain=0;
            }
        }else{
            // движение по точкам пути
            if(e.wormIdx>=e.wormPts.length-1){
                // конец схемы → случайная следующая, плавный переход
                const next=wormPickNextPattern(e.wormPattern);
                e.wormPattern=next;
                e.wormPts=wormBuildPath(next,L,R,T,B);
                e.wormTransitX=e.wormPts[0].x;
                e.wormTransitY=e.wormPts[0].y;
                e.wormPhase="transit";
                e.wormIdx=0;
                continue;
            }
            const tgt=e.wormPts[e.wormIdx+1];
            const dx=tgt.x-e.x, dy=tgt.y-e.y;
            const d=Math.hypot(dx,dy)||0.01;
            if(d<=remain){
                e.x=tgt.x;e.y=tgt.y;
                e.wormIdx++;
                remain-=d;
            }else{
                e.x+=dx/d*remain;e.y+=dy/d*remain;
                remain=0;
            }
        }
    }

    // след головы
    if(!e.trail) e.trail=[];
    e.trail.unshift({x:e.x,y:e.y});
    const maxTrail=(e.segCount||20)*8;
    if(e.trail.length>maxTrail) e.trail.length=maxTrail;

    // сегменты вдоль следа — весь корпус бьётся
    e.segments=[];
    const spacing=e.segR*1.25;
    let distAcc=0, segI=0;
    for(let i=1;i<e.trail.length && segI<e.segCount;i++){
        const a=e.trail[i-1], b=e.trail[i];
        const d=Math.hypot(a.x-b.x,a.y-b.y)||0.01;
        distAcc+=d;
        while(distAcc>=spacing && segI<e.segCount){
            distAcc-=spacing;
            const f=distAcc/d;
            e.segments.push({
                x:b.x+(a.x-b.x)*f,
                y:b.y+(a.y-b.y)*f,
                r:e.segR*(1-segI*0.012)
            });
            segI++;
        }
    }
    if(e.trail.length>3){
        e.angle=Math.atan2(e.trail[0].y-e.trail[3].y, e.trail[0].x-e.trail[3].x);
    }
}

/* BULLETS */
function hitWall(x,y,r){
    const topY=78, botY=H-WALL, leftX=WALL, rightX=W-WALL;
    return x-r<leftX||x+r>rightX||y-r<topY||y+r>botY;
}

function updateBullets(dt){
    for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i];

        // ===== ОРБИТА (магнит) =====
        if(b.orbit){
            b.orbitAngle+=b.orbitSpeed*dt;
            b.spin=(b.spin||0)+0.35*dt;

            // лёгкое отталкивание от соседей на том же слое (дистанция)
            const minSep=b.minSep||0.4;
            for(const o of bullets){
                if(!o.orbit||o===b||o.orbitLayer!==b.orbitLayer) continue;
                let dAng=b.orbitAngle-o.orbitAngle;
                while(dAng>Math.PI) dAng-=Math.PI*2;
                while(dAng<-Math.PI) dAng+=Math.PI*2;
                if(Math.abs(dAng)<minSep && Math.abs(dAng)>0.001){
                    const push=(minSep-Math.abs(dAng))*0.15*Math.sign(dAng||1);
                    b.orbitAngle+=push*dt;
                }
            }

            b.x=player.x+Math.cos(b.orbitAngle)*b.orbitRadius;
            b.y=player.y+Math.sin(b.orbitAngle)*b.orbitRadius;

            // стена: не разбивается, просто не видно (продолжает летать)
            b.hidden=hitWall(b.x,b.y,b.radius);

            // враг: урон, но снаряд НЕ разбивается (кд чтобы не тикал каждый кадр)
            b.dmgCd=Math.max(0,(b.dmgCd||0)-dt);
            if(b.dmgCd<=0 && !b.hidden){
                for(const e of enemies){
                    if(e.dead||e.intangible)continue;
                    if(hitsEnemy(b,e)){
                        applyHitEffects(e,b.damage||1);
                        createBurst(b.x,b.y,"hit");
                        if(player.hasSock) applyPoison(e);
                        if(e.hp<=0)killEnemy(e);
                        b.dmgCd=28; // ~0.45 сек до следующего удара этим снарядом
                        break;
                    }
                }
            }
            continue;
        }

        // ===== ЩУПАЛЬЦЕ: короткий вылет → поиск ближайшего =====
        if(b.tentacle&&b.tentaclePhase==="out"){
            const step=Math.hypot(b.vx,b.vy)*dt;
            b.tentacleOutDist=(b.tentacleOutDist||0)+step;
            if(b.tentacleOutDist>=(b.tentacleOutMax||48)){
                b.tentaclePhase="seek";
                b.homing=true;
            }
        }

        // ===== ОБЫЧНЫЕ СНАРЯДЫ =====
        // самонаведение на ближайшего врага
        if(b.homing){
            const t=nearestEnemy(b.x,b.y);
            if(t){
                const spd=Math.hypot(b.vx,b.vy)||6.4;
                // щупальце чуть агрессивнее поворачивает
                const turn=b.tentacle?0.28:0.18;
                const keep=1-turn;
                const desired=norm(t.x-b.x,t.y-b.y);
                b.vx=b.vx*keep+desired.x*spd*turn;
                b.vy=b.vy*keep+desired.y*spd*turn;
                const cur=Math.hypot(b.vx,b.vy)||1;
                b.vx=b.vx/cur*spd;
                b.vy=b.vy/cur*spd;
            }
        }

        b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;

        if(hitWall(b.x,b.y,b.radius)){
            // кубик Рубика: до 2 отскоков от стены в случайном направлении
            if((b.wallBounces||0)>0){
                b.wallBounces--;
                const topY=78+b.radius, botY=H-WALL-b.radius, leftX=WALL+b.radius, rightX=W-WALL-b.radius;
                b.x=clamp(b.x,leftX,rightX);
                b.y=clamp(b.y,topY,botY);
                const spd=Math.hypot(b.vx,b.vy)||(b.baseSpeed||6.4);
                const a=rand(0,Math.PI*2);
                b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;
                // чуть оттолкнуть от стены
                b.x+=b.vx*0.4;b.y+=b.vy*0.4;
                createBurst(b.x,b.y,"spark");
                if(b.hitSet) b.hitSet.clear(); // можно снова бить тех же после отскока
            }else{
                createBurst(b.x,b.y,"spark");
                bullets.splice(i,1);continue;
            }
        }
        if(b.life<=0){
            bullets.splice(i,1);continue;
        }

        particles.push({
            x:b.x-b.vx*.35,y:b.y-b.vy*.35,vx:0,vy:0,
            life:7,maxLife:7,size:2.4,type:"trail"
        });

        for(const e of enemies){
            if(e.dead||e.intangible)continue;
            const eid=enemies.indexOf(e);
            if(eid===b.lastHitId) continue; // не бить того же сразу после рикошета колпачка
            if(b.pierce){
                if(!b.hitSet) b.hitSet=new Set();
                if(b.hitSet.has(eid)) continue;
            }
            if(hitsEnemy(b,e)){
                // урон: 1-е попадание 100%, после 1-го рикошета колпачка 75%, после 2-го 50%
                const bc=b.bounceCount||0;
                const base=b.baseDamage!=null?b.baseDamage:(b.damage||1);
                const mul=bc<=0?1:bc===1?0.75:0.5;
                const dmgNow=base*mul;
                applyHitEffects(e,dmgNow);
                createBurst(b.x,b.y,"hit");
                if(player.hasSock) applyPoison(e);
                if(e.hp<=0)killEnemy(e);

                // кубик: пробивает врага и летит дальше
                if(b.pierce){
                    b.hitSet.add(eid);
                    continue;
                }

                // колпачок: рикошет в видимых врагов (не в инвиз-фонари)
                if((b.ricochets||0)>0){
                    let best=null,bestD=1e9;
                    for(const o of enemies){
                        if(o.dead||o===e||o.intangible)continue;
                        const d=Math.hypot(o.x-b.x,o.y-b.y);
                        if(d<bestD){bestD=d;best=o}
                    }
                    b.ricochets--;
                    b.bounceCount=(b.bounceCount||0)+1;
                    const baseSpd=b.baseSpeed||6.4;
                    const spdMul=b.bounceCount===1?0.85:0.75;
                    const spd=baseSpd*spdMul;
                    if(best){
                        const n=norm(best.x-b.x,best.y-b.y);
                        b.vx=n.x*spd;b.vy=n.y*spd;
                        b.x+=n.x*(e.radius+b.radius+2);
                        b.y+=n.y*(e.radius+b.radius+2);
                    }else{
                        const a=rand(0,Math.PI*2);
                        b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;
                        b.x+=b.vx*0.5;b.y+=b.vy*0.5;
                    }
                    b.lastHitId=eid;
                    break;
                }
                // нет рикошета — снаряд пропадает
                bullets.splice(i,1);
                break;
            }
        }
    }
}

function updateEnemyBullets(dt){
    const floorY=H-WALL-8;
    for(let i=enemyBullets.length-1;i>=0;i--){
        const b=enemyBullets[i];

        if(b.type==="scythe"){
            b.age=(b.age||0)+dt;
            b.spin=(b.spin||0)+0.18*dt;
            const spd=2.138; // +10% к прошлому

            if(b.phase==="out"){
                b.x+=b.vx*dt;b.y+=b.vy*dt;
                const dist=Math.hypot(b.x-(b.originX||0),b.y-(b.originY||0));
                if(dist>=(b.maxDist||216) || hitWall(b.x,b.y,b.radius)){
                    b.phase="return";
                }
            }else{
                // возврат к скелету (или к точке броска)
                const ox=b.owner&&!b.owner.dead?b.owner.x:(b.originX||0);
                const oy=b.owner&&!b.owner.dead?b.owner.y:(b.originY||0);
                const to=norm(ox-b.x,oy-b.y);
                b.vx=to.x*spd*1.1;b.vy=to.y*spd*1.1;
                b.x+=b.vx*dt;b.y+=b.vy*dt;
                if(Math.hypot(b.x-ox,b.y-oy)<14){
                    enemyBullets.splice(i,1);
                    continue;
                }
            }

            b.trail.push({x:b.x,y:b.y});
            if(b.trail.length>6)b.trail.shift();

            if(circleHit(b,player)){
                hurtPlayer(0.5); // как любой удар: 0.5 HP или 1 щит
                createBurst(b.x,b.y,"boss");
                enemyBullets.splice(i,1);
                continue;
            }
            if(b.age>400){enemyBullets.splice(i,1);continue}
            continue;
        }

        // ковбойский рикошет: 2 отскока, +15% скорости каждый
        if(b.type==="cowboy"){
            b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
            b.trail.push({x:b.x,y:b.y});
            if(b.trail.length>8)b.trail.shift();
            const topY=78, botY=H-WALL, leftX=WALL, rightX=W-WALL;
            let bounced=false;
            if(b.x-b.radius<leftX){b.x=leftX+b.radius;b.vx=Math.abs(b.vx);bounced=true}
            else if(b.x+b.radius>rightX){b.x=rightX-b.radius;b.vx=-Math.abs(b.vx);bounced=true}
            if(b.y-b.radius<topY){b.y=topY+b.radius;b.vy=Math.abs(b.vy);bounced=true}
            else if(b.y+b.radius>botY){b.y=botY-b.radius;b.vy=-Math.abs(b.vy);bounced=true}
            if(bounced){
                b.bounceCount=(b.bounceCount||0)+1;
                if(b.bounceCount>(b.maxBounces||2)){
                    createBurst(b.x,b.y,"magic");
                    enemyBullets.splice(i,1);continue;
                }
                // +15% от базовой скорости
                const base=b.baseSpeed||4.2;
                const spd=base*(1+0.15*b.bounceCount);
                const n=norm(b.vx,b.vy);
                b.vx=n.x*spd;b.vy=n.y*spd;
                createBurst(b.x,b.y,"spark");
            }
            if(b.life<=0){enemyBullets.splice(i,1);continue}
            if(circleHit(b,player)){
                hurtPlayer(b.damage||0.5);
                createBurst(b.x,b.y,"boss");
                enemyBullets.splice(i,1);
            }
            continue;
        }

        b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
        b.trail.push({x:b.x,y:b.y});
        if(b.trail.length>5)b.trail.shift();

        if(hitWall(b.x,b.y,b.radius)){
            createBurst(b.x,b.y,"magic");
            enemyBullets.splice(i,1);continue;
        }
        if(b.life<=0){
            createBurst(b.x,b.y,"spark");
            enemyBullets.splice(i,1);continue;
        }

        if(circleHit(b,player)){
            hurtPlayer(0.5);enemyBullets.splice(i,1);
        }
    }
}

function drawPassiveIcon(canvas,type){
    const c=canvas.getContext("2d");
    const s=canvas.width;
    c.clearRect(0,0,s,s);
    c.translate(s/2,s/2);
    if(type==="claws"){
        c.strokeStyle="#e84b5b";c.lineWidth=4;c.lineCap="round";
        for(const x of[-14,0,14]){
            c.beginPath();c.moveTo(x,-18);c.quadraticCurveTo(x+6,0,x,20);c.stroke();
        }
    }else if(type==="shield"){
        c.fillStyle="#5a9fd8";c.strokeStyle="#2a5080";c.lineWidth=2;
        c.beginPath();c.moveTo(0,-22);c.lineTo(20,-10);c.lineTo(16,14);c.quadraticCurveTo(0,26,-16,14);c.lineTo(-20,-10);c.closePath();
        c.fill();c.stroke();
        c.fillStyle="#a8d4ff";c.beginPath();c.arc(0,0,7,0,7);c.fill();
    }else if(type==="wings"){
        c.fillStyle="#e8e0ff";c.strokeStyle="#8a7ab8";c.lineWidth=1.5;
        for(const side of[-1,1]){
            c.beginPath();
            c.moveTo(0,4);
            c.bezierCurveTo(side*8,-16,side*28,-18,side*30,0);
            c.bezierCurveTo(side*26,10,side*12,14,0,8);
            c.closePath();c.fill();c.stroke();
        }
    }else if(type==="fangs"){
        c.fillStyle="#f0e8e8";c.strokeStyle="#603040";c.lineWidth=1.5;
        c.beginPath();c.moveTo(-12,-8);c.lineTo(-6,16);c.lineTo(0,-4);c.lineTo(6,16);c.lineTo(12,-8);c.closePath();c.fill();c.stroke();
        c.fillStyle="#c02040";c.beginPath();c.arc(-4,-2,2.5,0,7);c.arc(4,-2,2.5,0,7);c.fill();
    }else if(type==="book"){
        c.fillStyle="#6a4a2a";c.fillRect(-18,-16,36,32);
        c.fillStyle="#f5ecd8";c.fillRect(-14,-12,28,24);
        c.strokeStyle="#4a3020";c.lineWidth=1.5;c.strokeRect(-18,-16,36,32);
        c.beginPath();c.moveTo(0,-12);c.lineTo(0,12);c.stroke();
        c.strokeStyle="#9d4edd";c.lineWidth=2;
        c.beginPath();c.moveTo(-8,-4);c.lineTo(8,-4);c.moveTo(-8,2);c.lineTo(8,2);c.moveTo(-8,8);c.lineTo(4,8);c.stroke();
    }else if(type==="boot"){
        c.fillStyle="#5a4030";c.strokeStyle="#2a1810";c.lineWidth=2;
        c.beginPath();c.moveTo(-8,-16);c.lineTo(6,-16);c.lineTo(8,4);c.lineTo(18,8);c.quadraticCurveTo(22,14,14,18);c.lineTo(-10,18);c.quadraticCurveTo(-14,12,-10,6);c.closePath();
        c.fill();c.stroke();
        c.fillStyle="#8a6040";c.fillRect(-6,-16,10,6);
    }
    c.setTransform(1,0,0,1,0,0);
}

function showPassivePick(tier,after){
    waitingForPassive=true;
    passiveAfterPick=after;
    const wrap=document.getElementById("passiveCards");
    wrap.innerHTML="";
    const list=PASSIVE_DEFS[tier]||[];
    for(const p of list){
        const card=document.createElement("div");
        card.className="pCard";
        const icon=document.createElement("canvas");
        icon.className="pIcon";icon.width=72;icon.height=72;
        drawPassiveIcon(icon,p.icon);
        const name=document.createElement("div");name.className="pName";name.textContent=p.name;
        const desc=document.createElement("div");desc.className="pDesc";desc.textContent=p.desc;
        card.appendChild(icon);card.appendChild(name);card.appendChild(desc);
        card.onclick=()=>{
            player.passives[p.id]=true;
            floatingTexts.push({x:player.x,y:player.y-30,text:p.name+"!",life:50});
