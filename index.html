function getDmgMul(){
    return player.passives.dmgBoost?1.15:1;
}

function applyHitEffects(e,rawDmg){
    let dmg=rawDmg*getDmgMul();
    if(player.passives.critKill && Math.random()<0.025){
        const isBoss=e.type==="boss"||e.type==="devil"||e.type==="worm"||e.type==="crystal";
        if(isBoss){
            dmg=50;
        }else{
            dmg=e.hp+999;
        }
        floatingTexts.push({x:e.x,y:e.y-e.radius-8,text:"СЛАБОЕ!",life:35});
        createBurst(e.x,e.y,"boss");
    }
    e.hp-=dmg;e.hitFlash=5;
}

function doShieldBurst(){
    const R=130;
    // центральная вспышка щита
    createBurst(player.x,player.y,"boss");
    // 3 расширяющихся кольца (фиолетовый щит)
    for(let k=0;k<3;k++){
        particles.push({
            x:player.x,y:player.y,vx:0,vy:0,
            life:28-k*4,maxLife:28-k*4,size:R*(0.35+k*0.12),
            type:"ring",ringColor:"#9b5de5",ringGrow:R/(28-k*4)*1.15,
            ringWidth:5-k
        });
    }
    // внутреннее яркое кольцо
    particles.push({
        x:player.x,y:player.y,vx:0,vy:0,
        life:14,maxLife:14,size:18,
        type:"ring",ringColor:"#e0b0ff",ringGrow:R/14*0.9,ringWidth:3
    });
    // осколки щита по кругу
    for(let i=0;i<32;i++){
        const a=i/32*Math.PI*2+rand(-0.08,0.08);
        const sp=rand(3.5,7.5);
        particles.push({
            x:player.x+Math.cos(a)*12,y:player.y+Math.sin(a)*12,
            vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
            life:rand(20,32),maxLife:32,size:rand(3,7),type:"magic"
        });
    }
    // вторичные искры
    for(let i=0;i<18;i++){
        const a=rand(0,Math.PI*2);
        particles.push({
            x:player.x,y:player.y,
            vx:Math.cos(a)*rand(1,4),vy:Math.sin(a)*rand(1,4)-rand(0.5,2),
            life:rand(12,22),maxLife:22,size:rand(2,5),type:"spark"
        });
    }
    floatingTexts.push({x:player.x,y:player.y-40,text:"УДАРНАЯ ВОЛНА!",life:48});
    for(const e of enemies){
        if(e.dead||e.intangible)continue;
        let hit=false;
        if(e.type==="worm"&&e.segments){
            for(const s of e.segments){
                if(Math.hypot(s.x-player.x,s.y-player.y)<R+(s.r||16)){hit=true;break}
            }
            if(Math.hypot(e.x-player.x,e.y-player.y)<R+e.radius) hit=true;
        }else if(Math.hypot(e.x-player.x,e.y-player.y)<R+e.radius) hit=true;
        if(hit){
            e.hp-=50;e.hitFlash=10;
            createBurst(e.x,e.y,"magic");
            if(e.hp<=0)killEnemy(e);
        }
    }
}

/* DAMAGE */
function hurtPlayer(amount){
    if(player.invincible>0||!gameRunning)return;
    // пассивка: 10% шанс не получить урон (только классика)
    if(gameMode!=="hardcore" && player.passives.dodge && Math.random()<0.1){
        floatingTexts.push({x:player.x,y:player.y-24,text:"БЛОК!",life:28});
        player.hurtFlash=8;
        return;
    }

    // хардкор: 1/3 HP — любое попадание/столкновение убивает
    if(gameMode==="hardcore"){
        player.hp=0;
        player.shield=0;
        player.hurtFlash=18;
        createBurst(player.x,player.y,"playerHit");
        updateHP();
        gameOver();
        return;
    }

    const prevShield=player.shield;
    // любой удар: 1/3 HP или 1/2 щита
    if(player.shield>0){
        player.shield=Math.max(0,Math.round((player.shield-0.5)*100)/100);
    }else{
        player.hp=Math.max(0,Math.round((player.hp-1/3)*1000)/1000);
    }

    // ударная волна при полном разрушении щита
    if(player.passives.shieldBurst && prevShield>0 && player.shield<=0){
        doShieldBurst();
    }

    player.invincible=120; // ~2 секунды неуязвимости
    player.hurtFlash=18;
    createBurst(player.x,player.y,"playerHit");
    updateHP();

    if(player.hp<=0)gameOver();
}

function killEnemy(e){
    if(e.dead)return;
    e.dead=true;waveKills++;

    let points=10;
    if(e.type==="dasher")points=15;
    if(e.type==="shooter")points=20;
    if(e.type==="tank")points=30;
    if(e.type==="spinner")points=40;
    if(e.type==="skeleton")points=25;
    if(e.type==="flyingeye")points=22;
    if(e.type==="laserbot")points=28;
    if(e.type==="laserboth")points=28;
    if(e.type==="angel")points=30;
    if(e.type==="reaper")points=32;
    if(e.type==="lantern")points=28;
    if(e.type==="boss")points=500;
    if(e.type==="devil")points=1000;
    if(e.type==="worm")points=1500;
    if(e.type==="crystal")points=2500;
    if(e.type==="walle")points=26;
    if(e.type==="ev9")points=35;
    if(e.type==="cowboy")points=28;

    score+=points;
    createDeathEffect(e);

    floatingTexts.push({x:e.x,y:e.y-e.radius,text:"+"+points,life:40});

    // вампиризм: 5% шанс восстановить ⅓ HP или ½ щита при убийстве
    if(player.passives.lifesteal && Math.random()<0.05){
        if(player.hp<player.maxHp-0.001){
            player.hp=Math.min(player.maxHp,Math.round((player.hp+1/3)*1000)/1000);
            floatingTexts.push({x:player.x,y:player.y-28,text:"+⅓ HP",life:30});
        }else{
            player.shield=Math.min(3,Math.round((player.shield+0.5)*100)/100);
            floatingTexts.push({x:player.x,y:player.y-28,text:"+½ ЩИТ",life:30});
        }
        updateHP();
    }

    if(e.type==="boss"||e.type==="devil"||e.type==="worm"||e.type==="crystal"){
        document.getElementById("bossUI").style.display="none";
        const openActDoor=(green,yellow,cyan,msg)=>{
            door.open=true;
            door.x=W/2;door.y=78+WALL/2;door.w=56;door.h=28;
            door.green=!!green;door.yellow=!!yellow;door.cyan=!!cyan;
            showMessage(msg);
        };
        if(e.type==="boss" && wave===10){
            setTimeout(()=>{
                if(!gameRunning)return;
                if(gameMode==="hardcore") openActDoor(true,false,false,"УРОВЕНЬ 2");
                else showPassivePick(1,()=>openActDoor(true,false,false,"УРОВЕНЬ 2"));
            },700);
        }
        if(e.type==="devil" && wave===20){
            setTimeout(()=>{
                if(!gameRunning)return;
                if(gameMode==="hardcore") openActDoor(false,true,false,"УРОВЕНЬ 3");
                else showPassivePick(2,()=>openActDoor(false,true,false,"УРОВЕНЬ 3"));
            },700);
        }
        if(e.type==="worm" && wave===30){
            setTimeout(()=>{
                if(!gameRunning)return;
                if(gameMode==="hardcore") openActDoor(false,false,true,"ФИНАЛ");
                else showPassivePick(3,()=>{if(gameRunning)openActDoor(false,false,true,"ФИНАЛ")});
            },800);
        }
        if(e.type==="crystal" && wave===31){
            setTimeout(()=>{
                if(gameRunning)winGame();
            },900);
        }
    }
    updateHUD();
}

/* PARTICLES */
function createBurst(x,y,type){
    let count=7;
    if(type==="boss")count=14;
    if(type==="circle")count=16;

    for(let i=0;i<count;i++){
        const a=Math.random()*7,s=rand(.5,2.8);
        particles.push({
            x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
            life:rand(10,25),maxLife:25,size:rand(1.5,4),type
        });
    }
}

function createDeathEffect(e){
    const count=e.type==="boss"?45:16;
    for(let i=0;i<count;i++){
        const a=Math.random()*7,s=rand(.5,4);
        particles.push({
            x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
            life:rand(20,50),maxLife:50,size:rand(2,7),type:"death"
        });
    }
}

function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];
        if(p.type==="ring"){
            p.size+=(p.ringGrow||4)*dt;
            p.life-=dt;
            if(p.life<=0)particles.splice(i,1);
            continue;
        }
        p.x+=p.vx*dt;p.y+=p.vy*dt;
        p.vx*=Math.pow(.94,dt);p.vy*=Math.pow(.94,dt);
        p.life-=dt;
        if(p.life<=0)particles.splice(i,1);
    }

    for(let i=floatingTexts.length-1;i>=0;i--){
        const f=floatingTexts[i];f.y-=.55*dt;f.life-=dt;
        if(f.life<=0)floatingTexts.splice(i,1);
    }
}

/* DRAW HELPERS */
function shadowCircle(x,y,r,a=.35){
    const g=ctx.createRadialGradient(x,y+r*.65,1,x,y+r*.65,r*.9);
    g.addColorStop(0,`rgba(0,0,0,${a})`);
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.ellipse(x,y+r*.7,r*.85,r*.32,0,0,7);ctx.fill();
}

function drawEye(x,y,rx,ry,lx,ly){
    ctx.fillStyle="#f4eee9";ctx.strokeStyle="#241d25";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill();ctx.stroke();

    const n=norm(lx,ly);
    ctx.fillStyle="#241923";
    ctx.beginPath();ctx.ellipse(x+n.x*rx*.28,y+n.y*ry*.25,rx*.48,ry*.56,0,0,7);ctx.fill();
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(x+n.x*rx*.13,y+n.y*ry*.1,Math.max(1.2,rx*.16),0,7);ctx.fill();
}

function drawMouth(x,y,w,h){
    ctx.fillStyle="#160d13";ctx.strokeStyle="#24151d";ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle="#eee4d8";
    for(let i=0;i<4;i++){
        const tx=x-w*.55+i*w*.36;
        ctx.beginPath();ctx.moveTo(tx,y-h*.7);ctx.lineTo(tx+w*.12,y-h*.05);
        ctx.lineTo(tx+w*.24,y-h*.7);ctx.fill();
    }
}

/* 4-pointed star helper (как на концепте) */
function drawStar4(cx,cy,outerR,innerR,rot=0){
    ctx.beginPath();
    for(let i=0;i<8;i++){
        const a=rot+i*Math.PI/4-Math.PI/2;
        const r=i%2===0?outerR:innerR;
        const px=cx+Math.cos(a)*r;
        const py=cy+Math.sin(a)*r;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
}

/* PLAYER — концепт: растрёпанные русые волосы + зелёные звёздные глаза */
function drawPlayer(){
    const moving=Math.abs(player.lastMoveX)+Math.abs(player.lastMoveY)>0.08;
    const bob=moving?Math.abs(Math.sin(player.walk))*1.8:Math.sin(gameTime*0.0025)*0.35;
    const x=player.x, y=player.y+bob;
    const flash=player.hurtFlash>0&&Math.floor(player.hurtFlash*2)%2===0;

    ctx.save();
    if(player.invincible>0) ctx.globalAlpha=.55+.45*Math.sin(gameTime*.025)**2;

    shadowCircle(x,y+6,11,.38);

    const outline="#1a1520";
    const skin=flash?"#ffe8e0":"#e8c4b0";
    const body=flash?"#ffffff":"#f0e6dc";
    const hair=flash?"#c8b090":"#8a6e50";
    const hairDark=flash?"#a89070":"#6a5238";
    const eyeGreen="#7dff4a";
    const eyeCore="#c8ff90";

    // ===== НОГИ =====
    ctx.fillStyle="#1a1520";
    ctx.beginPath();ctx.ellipse(x-4.2,y+17.5,3.8,2.8,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+4.2,y+17.5,3.8,2.8,0,0,7);ctx.fill();

    // ===== ТЕЛО (маленькое, округлое) =====
    ctx.fillStyle=body;
    ctx.strokeStyle=outline;ctx.lineWidth=2;
    ctx.beginPath();
    ctx.roundRect(x-8,y+1,16,13,5);
    ctx.fill();ctx.stroke();

    // ===== ГОЛОВА =====
    ctx.fillStyle=skin;
    ctx.strokeStyle=outline;ctx.lineWidth=2.3;
    ctx.beginPath();
    ctx.arc(x,y-5,13.5,0,7);
    ctx.fill();ctx.stroke();

    // ===== ВОЛОСЫ — растрёпанные русые, как на концепте =====
    ctx.fillStyle=hair;
    // основная масса волос
    ctx.beginPath();
    ctx.moveTo(x-14,y-2);
    ctx.bezierCurveTo(x-16,y-10,x-13,y-18,x-7,y-21);
    ctx.bezierCurveTo(x-2,y-24,x+5,y-24,x+10,y-21);
    ctx.bezierCurveTo(x+15,y-17,x+16,y-10,x+14,y-2);
    ctx.bezierCurveTo(x+10,y-6,x+3,y-8,x,y-7);
    ctx.bezierCurveTo(x-3,y-8,x-10,y-6,x-14,y-2);
    ctx.closePath();
    ctx.fill();

    // шипы / пряди
    const spikes=[
        [-12,-24, -14,-14, -7,-15],
        [-6,-28, -9,-17, -2,-18],
        [0,-30, -3,-18,  3,-19],
        [5,-27,  1,-17,  8,-17],
        [10,-25,  6,-15, 13,-14],
        [14,-21, 10,-13, 15,-11],
        [-14,-19, -16,-11, -11,-12],
        [15,-18, 11,-11, 16,-9],
        [-8,-21, -11,-13, -4,-14],
        [3,-23, -1,-15,  6,-15],
        [-4,-25, -7,-16, 0,-16]
    ];
    for(const [tx,ty,ax,ay,bx,by] of spikes){
        ctx.beginPath();
        ctx.moveTo(x+ax,y+ay);
        ctx.quadraticCurveTo(x+tx,y+ty,x+bx,y+by);
        ctx.lineTo(x+(ax+bx)/2,y+(ay+by)/2+1.2);
        ctx.closePath();
        ctx.fill();
    }

    // чёлка / пряди спереди
    const bangs=[
        [-10,-13, -12,-6, -7,-6],
        [-5,-15, -7,-6, -2,-6],
        [0,-16, -2,-7,  3,-7],
        [5,-15,  2,-6,  8,-6],
        [9,-13,  6,-6, 12,-6]
    ];
    for(const [tx,ty,ax,ay,bx,by] of bangs){
        ctx.beginPath();
        ctx.moveTo(x+ax,y+ay);
        ctx.quadraticCurveTo(x+tx,y+ty,x+bx,y+by);
        ctx.closePath();
        ctx.fill();
    }

    // тёмные пряди для объёма
    ctx.fillStyle=hairDark;
    ctx.globalAlpha=0.45;
    ctx.beginPath();
    ctx.moveTo(x-11,y-8);
    ctx.quadraticCurveTo(x-13,y-16,x-6,y-18);
    ctx.quadraticCurveTo(x-8,y-12,x-11,y-8);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+4,y-10);
    ctx.quadraticCurveTo(x+8,y-18,x+12,y-14);
    ctx.quadraticCurveTo(x+7,y-12,x+4,y-10);
    ctx.fill();
    ctx.globalAlpha=1;

    // ===== ГЛАЗА — две зелёные четырёхконечные звёздочки =====
    ctx.shadowColor=eyeGreen;
    ctx.shadowBlur=10;
    // левый глаз
    ctx.fillStyle=eyeGreen;
    drawStar4(x-5.5,y-4.5,5.2,2.1,0);
    ctx.fill();
    ctx.fillStyle=eyeCore;
    drawStar4(x-5.5,y-4.5,3.0,1.1,0);
    ctx.fill();
    // правый глаз
    ctx.fillStyle=eyeGreen;
    drawStar4(x+5.5,y-4.5,5.2,2.1,0);
    ctx.fill();
    ctx.fillStyle=eyeCore;
    drawStar4(x+5.5,y-4.5,3.0,1.1,0);
    ctx.fill();
    ctx.shadowBlur=0;

    // лёгкий блик на звёздах
    ctx.fillStyle="rgba(255,255,255,0.7)";
    ctx.beginPath();ctx.arc(x-6.5,y-5.5,1.1,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(x+4.5,y-5.5,1.1,0,7);ctx.fill();

    ctx.restore();
}

/* ENEMIES */
function drawChaser(e){
    shadowCircle(e.x,e.y,e.radius,.38);
    ctx.fillStyle=e.hitFlash>0?"#fff0eb":"#a94e65";
    ctx.strokeStyle="#301c29";ctx.lineWidth=2.4;
    ctx.beginPath();
    for(let i=0;i<14;i++){
        let a=i/14*7,r=e.radius*(1+Math.sin(gameTime*.004+i*2.7)*.035);
        let x=e.x+Math.cos(a)*r,y=e.y+Math.sin(a)*r;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    drawEye(e.x-6,e.y-4,5,6,player.x-e.x,player.y-e.y);
    drawEye(e.x+6,e.y-4,5,6,player.x-e.x,player.y-e.y);
    drawMouth(e.x,e.y+7,8,5);
}

function drawDasher(e){
    // маленький чёрт-летучая мышь
    shadowCircle(e.x,e.y,e.radius,.38);
    const sc=e.radius/16;
    const flash=e.hitFlash>0;
    const body=flash?"#fff":"#6b3d8a";
    const wing=flash?"#f0e0ff":"#4a2a62";
    const outline="#241830";

    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.rotate(e.angle);
    ctx.scale(sc,sc);

    // крылья (за телом, слегка «машут»)
    const flap=Math.sin(gameTime*0.012+e.phase)*0.18;
    ctx.fillStyle=wing;
    ctx.strokeStyle=outline;ctx.lineWidth=2;
    // левое
    ctx.save();ctx.rotate(-0.35+flap);
    ctx.beginPath();
    ctx.moveTo(-2,0);
    ctx.quadraticCurveTo(-18,-10,-22,2);
    ctx.quadraticCurveTo(-16,6,-10,4);
    ctx.quadraticCurveTo(-14,10,-6,8);
    ctx.quadraticCurveTo(-4,3,-2,0);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();
    // правое
    ctx.save();ctx.rotate(0.35-flap);
    ctx.beginPath();
    ctx.moveTo(2,0);
    ctx.quadraticCurveTo(18,-10,22,2);
    ctx.quadraticCurveTo(16,6,10,4);
    ctx.quadraticCurveTo(14,10,6,8);
    ctx.quadraticCurveTo(4,3,2,0);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();

    // тело
    ctx.fillStyle=body;
    ctx.strokeStyle=outline;ctx.lineWidth=2.3;
    ctx.beginPath();ctx.ellipse(0,2,10,11,0,0,7);ctx.fill();ctx.stroke();

    // рожки
    ctx.fillStyle=flash?"#fff":"#3d2048";
    ctx.beginPath();
    ctx.moveTo(-6,-8);ctx.lineTo(-9,-16);ctx.lineTo(-3,-10);ctx.closePath();ctx.fill();
    ctx.beginPath();
    ctx.moveTo(6,-8);ctx.lineTo(9,-16);ctx.lineTo(3,-10);ctx.closePath();ctx.fill();
    ctx.strokeStyle=outline;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-6,-8);ctx.lineTo(-9,-16);ctx.lineTo(-3,-10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(6,-8);ctx.lineTo(9,-16);ctx.lineTo(3,-10);ctx.stroke();

    // глаза
    ctx.fillStyle="#1a1020";
    ctx.beginPath();ctx.ellipse(-4,-1,3.2,3.6,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(4,-1,3.2,3.6,0,0,7);ctx.fill();
    ctx.fillStyle="#ff6b8a";
    ctx.beginPath();ctx.arc(-3.5,-1,1.4,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(4.5,-1,1.4,0,7);ctx.fill();

    // маленький оскал
    ctx.strokeStyle=outline;ctx.lineWidth=1.6;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(0,4,4,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
    // зубки
    ctx.fillStyle="#eee8f0";
    ctx.beginPath();ctx.moveTo(-2,5);ctx.lineTo(-1,8);ctx.lineTo(0,5);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(1,8);ctx.lineTo(2,5);ctx.fill();

    // хвостик
    ctx.strokeStyle=outline;ctx.lineWidth=2;ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(0,12);
    ctx.quadraticCurveTo(-6,18,-2,22);
    ctx.stroke();
    ctx.fillStyle=body;
    ctx.beginPath();
    ctx.moveTo(-2,22);ctx.lineTo(-6,24);ctx.lineTo(-1,26);ctx.lineTo(0,22);ctx.closePath();ctx.fill();

    ctx.restore();

    // след при рывке
    if(Math.hypot(e.vx,e.vy)>2){
        ctx.globalAlpha=.2;
        for(let i=1;i<=3;i++){
            ctx.beginPath();ctx.arc(e.x-e.vx*i*.8,e.y-e.vy*i*.8,e.radius*(1-i*.12),0,7);
            ctx.strokeStyle="#8e58bd";ctx.lineWidth=2;ctx.stroke();
        }
        ctx.globalAlpha=1;
    }
}

function drawCyclops(e,color){
    // color: "purple" | "red"
    const isRed=color==="red";
    shadowCircle(e.x,e.y,e.radius,.4);
    // красный чуть крупнее фиолетового
    const baseR=isRed?18:16;
    const sc=e.radius/baseR;
    const flash=e.hitFlash>0;
    const body=flash?"#fff":(isRed?"#a84858":"#6a4a88");
    const bodyDark=flash?"#ffe8e8":(isRed?"#7a3040":"#4a3262");
    const iris=isRed?"#ff6b7d":"#c070ff";
    const glow=isRed?"#ff5367":"#d06aff";
    const outline="#211a2c";

    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.scale(sc,sc);

    // ноги — короткие, вниз
    ctx.fillStyle=bodyDark;
    ctx.strokeStyle=outline;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.roundRect(-7,12,5,7,2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.roundRect(2,12,5,7,2);ctx.fill();ctx.stroke();

    // туловище (вертикальный овал, без «крыльев»)
    ctx.fillStyle=body;
    ctx.strokeStyle=outline;ctx.lineWidth=2.3;
    ctx.beginPath();ctx.ellipse(0,3,10,12,0,0,7);ctx.fill();ctx.stroke();

    // короткие руки по бокам тела (не как крылья)
    ctx.fillStyle=bodyDark;
    ctx.beginPath();ctx.ellipse(-11,4,3,4.5,0.15,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(11,4,3,4.5,-0.15,0,7);ctx.fill();

    // голова
    ctx.fillStyle=body;
    ctx.strokeStyle=outline;ctx.lineWidth=2.3;
    ctx.beginPath();ctx.arc(0,-9,10.5,0,7);ctx.fill();ctx.stroke();

    // маленький рог
    ctx.fillStyle=bodyDark;
    ctx.beginPath();
    ctx.moveTo(-2.5,-17);ctx.lineTo(0,-23);ctx.lineTo(2.5,-17);ctx.closePath();ctx.fill();
    ctx.strokeStyle=outline;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(-2.5,-17);ctx.lineTo(0,-23);ctx.lineTo(2.5,-17);ctx.stroke();

    // один глаз
    ctx.fillStyle="#1a1020";
    ctx.beginPath();ctx.ellipse(0,-9,6,6.5,0,0,7);ctx.fill();
    ctx.fillStyle=iris;
    ctx.shadowColor=glow;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(0,-9,3.8,0,7);ctx.fill();
    ctx.shadowBlur=0;
    const look=norm(player.x-e.x,player.y-e.y);
    ctx.fillStyle="#120818";
    ctx.beginPath();ctx.arc(look.x*1.6,-9+look.y*1.6,2,0,7);ctx.fill();
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(-1.4,-10.3,1.2,0,7);ctx.fill();

    // рот
    ctx.strokeStyle=outline;ctx.lineWidth=1.5;ctx.lineCap="round";
    ctx.beginPath();ctx.arc(0,-2,3,0.2*Math.PI,0.8*Math.PI);ctx.stroke();

    ctx.restore();
}

function drawShooter(e){
    drawCyclops(e,"purple");
}

function drawTank(e){
    // глыба / ходячий камень
    shadowCircle(e.x,e.y,e.radius,.5);
    const sc=e.radius/22;
    const flash=e.hitFlash>0;
    const rock=flash?"#fff":"#6a6e76";
    const rockDark=flash?"#e8e8e8":"#4a4e56";
    const rockLight=flash?"#fff":"#8a8e96";
    const outline="#1c2026";

    ctx.save();
    ctx.translate(e.x,e.y);
    // лёгкое «шатание» при движении
    ctx.rotate(Math.sin(e.anim*0.08)*0.04);
    ctx.scale(sc,sc);

    // основная глыба — неровный многоугольник
    ctx.fillStyle=rock;
    ctx.strokeStyle=outline;ctx.lineWidth=2.6;
    ctx.beginPath();
    ctx.moveTo(-14,-16);
    ctx.lineTo(-4,-20);
    ctx.lineTo(8,-18);
    ctx.lineTo(16,-10);
    ctx.lineTo(18,4);
    ctx.lineTo(12,16);
    ctx.lineTo(-2,18);
    ctx.lineTo(-14,12);
    ctx.lineTo(-18,0);
    ctx.lineTo(-16,-10);
    ctx.closePath();
    ctx.fill();ctx.stroke();

    // тёмные трещины / грани
    ctx.strokeStyle="rgba(20,24,30,0.45)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-6,-16);ctx.lineTo(-2,2);ctx.lineTo(4,14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(6,-14);ctx.lineTo(10,0);ctx.lineTo(6,12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-12,4);ctx.lineTo(0,6);ctx.lineTo(12,2);ctx.stroke();

    // светлые блики на камне
    ctx.fillStyle=rockLight;
    ctx.globalAlpha=0.35;
    ctx.beginPath();
    ctx.moveTo(-10,-12);
    ctx.lineTo(-2,-16);
    ctx.lineTo(4,-10);
    ctx.lineTo(-4,-6);
    ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;

    // тёмный кусок снизу
    ctx.fillStyle=rockDark;
    ctx.beginPath();
    ctx.moveTo(-12,8);
    ctx.lineTo(2,16);
    ctx.lineTo(14,8);
    ctx.lineTo(10,16);
    ctx.lineTo(-2,18);
    ctx.lineTo(-14,12);
    ctx.closePath();ctx.fill();

    // два глаза-щели в глыбе
    const look=norm(player.x-e.x,player.y-e.y);
    ctx.fillStyle="#1a1520";
    ctx.beginPath();ctx.ellipse(-5+look.x,-4+look.y,3.5,4,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(5+look.x,-4+look.y,3.5,4,0,0,7);ctx.fill();
    ctx.fillStyle="#c8d0d8";
    ctx.beginPath();ctx.arc(-5+look.x*1.2,-4+look.y*1.2,1.4,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(5+look.x*1.2,-4+look.y*1.2,1.4,0,7);ctx.fill();

    // «ноги»-обломки снизу
    ctx.fillStyle=rockDark;
    ctx.strokeStyle=outline;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(-8,18,5,3.5,0,0,7);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(8,18,5,3.5,0,0,7);ctx.fill();ctx.stroke();

    ctx.restore();
}

function drawSpinner(e){
    // красный циклоп (крупнее фиолетового), стреляет вокруг
    drawCyclops(e,"red");
}

function drawBoss(e){
    // сгусток мяса со множеством глаз
    shadowCircle(e.x,e.y,e.radius,.6);
    const pulse=1+Math.sin(gameTime*.003)*.03;
    const sc=e.radius/48;
    const flash=e.hitFlash>0;
    const flesh=flash?"#fff0f0":"#8a3a4a";
    const fleshDark=flash?"#ffd0d0":"#5c2834";
    const outline="#261625";

    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.scale(pulse*sc,pulse*sc);

    // неровные «лопасти» мяса вокруг
    ctx.fillStyle=fleshDark;
    for(let i=0;i<7;i++){
        const a=i/7*Math.PI*2+Math.sin(gameTime*.001+i)*.12;
        const len=42+Math.sin(gameTime*.002+i*1.7)*6;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a)*len*0.55, Math.sin(a)*len*0.55, 14, 18, a, 0, 7);
        ctx.fill();
    }

    // основное тело
    ctx.fillStyle=flesh;
    ctx.strokeStyle=outline;ctx.lineWidth=3.5;
    ctx.beginPath();
    for(let i=0;i<12;i++){
        const a=i/12*Math.PI*2;
        const r=38+Math.sin(a*3+gameTime*.002)*5+Math.cos(a*5)*3;
        const px=Math.cos(a)*r, py=Math.sin(a)*r;
        if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();ctx.fill();ctx.stroke();

    // складки / прожилки
    ctx.strokeStyle="rgba(40,15,20,0.35)";ctx.lineWidth=2;
    for(let i=0;i<5;i++){
        const a=i*1.1+gameTime*.0005;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);
        ctx.quadraticCurveTo(Math.cos(a+0.5)*22,Math.sin(a+0.5)*18,Math.cos(a+1)*32,Math.sin(a+1)*28);
        ctx.stroke();
    }

    // много глаз
    const eyes=[
        [0,-6,11],[16,4,7],[-15,6,7],[8,16,6],[-10,-18,6],
        [20,-12,5],[-22,-8,5],[4,-22,5],[-6,18,5],[22,12,4],[-18,14,4]
    ];
    const look=norm(player.x-e.x,player.y-e.y);
    for(const [ex,ey,er] of eyes){
        // белок
        ctx.fillStyle="#f0e8e0";
        ctx.strokeStyle=outline;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.ellipse(ex,ey,er,er*1.05,0,0,7);ctx.fill();ctx.stroke();
        // радужка
        ctx.fillStyle="#c04050";
        ctx.beginPath();ctx.arc(ex+look.x*er*0.25,ey+look.y*er*0.25,er*0.55,0,7);ctx.fill();
        // зрачок
        ctx.fillStyle="#1a1020";
        ctx.beginPath();ctx.arc(ex+look.x*er*0.35,ey+look.y*er*0.35,er*0.28,0,7);ctx.fill();
        // блик
        ctx.fillStyle="#fff";
        ctx.beginPath();ctx.arc(ex-er*0.25,ey-er*0.3,er*0.15,0,7);ctx.fill();
    }

    ctx.restore();
}

function drawSkeleton(e){
    shadowCircle(e.x,e.y,e.radius,.4);
    const flash=e.hitFlash>0;
    const bone=flash?"#fff":"#e8e0d0";
    const boneDark=flash?"#ddd":"#a09888";
    const outline="#2a2520";
    ctx.save();
    ctx.translate(e.x,e.y);
    // ноги
    ctx.strokeStyle=outline;ctx.lineWidth=2.2;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(-5,8);ctx.lineTo(-6,16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(5,8);ctx.lineTo(6,16);ctx.stroke();
    ctx.fillStyle=bone;
    ctx.beginPath();ctx.ellipse(-6,17,3,2,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(6,17,3,2,0,0,7);ctx.fill();
    // таз / торс
    ctx.fillStyle=bone;
    ctx.strokeStyle=outline;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.ellipse(0,6,8,5,0,0,7);ctx.fill();ctx.stroke();
    // рёбра
    ctx.strokeStyle=boneDark;ctx.lineWidth=1.4;
    for(let i=0;i<3;i++){
        const yy=2+i*3.2;
        ctx.beginPath();ctx.moveTo(-6,yy);ctx.quadraticCurveTo(0,yy+2,6,yy);ctx.stroke();
    }
    // руки
    ctx.strokeStyle=outline;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-8,2);ctx.lineTo(-14,8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(8,2);ctx.lineTo(14,4);ctx.stroke();
    // череп
    ctx.fillStyle=bone;
    ctx.strokeStyle=outline;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,-8,9,0,7);ctx.fill();ctx.stroke();
    // глазницы
    ctx.fillStyle="#1a1510";
    ctx.beginPath();ctx.ellipse(-3.5,-9,2.8,3.2,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(3.5,-9,2.8,3.2,0,0,7);ctx.fill();
    // огонёк в глазах
    ctx.fillStyle="#7dff4a";
    ctx.beginPath();ctx.arc(-3.2,-8.5,1.2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(3.8,-8.5,1.2,0,7);ctx.fill();
    // нос / зубы
    ctx.fillStyle="#2a2520";
    ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(-1.5,-3);ctx.lineTo(1.5,-3);ctx.fill();
    ctx.fillStyle=bone;
    for(let i=-2;i<=2;i++){
        ctx.fillRect(i*2.2-0.7,-2,1.4,2.5);
    }
    ctx.restore();
}

function drawLaserBot(e){
    shadowCircle(e.x,e.y,e.radius,.4);
    const flash=e.hitFlash>0;
    const phase=e.laserPhase||"idle";
    const charging=phase==="charge";
    const firing=phase==="fire";
    ctx.save();
    ctx.translate(e.x,e.y);
    // корпус — серый круг
    ctx.fillStyle=flash?"#ddd":"#8a9098";
    ctx.strokeStyle="#3a4048";ctx.lineWidth=2.2;
    ctx.beginPath();ctx.arc(0,0,e.radius,0,7);ctx.fill();ctx.stroke();
    // оранжевые панели
    ctx.fillStyle=flash?"#ffb070":"#e87830";
    ctx.beginPath();ctx.arc(0,0,e.radius*0.72,0,7);ctx.fill();
    // внутренняя серая пластина
    ctx.fillStyle=flash?"#ccc":"#6a7078";
    ctx.beginPath();ctx.arc(0,0,e.radius*0.52,0,7);ctx.fill();
    // глаз: зелёный → красный перед атакой
    const eyeCol=charging||firing?(flash?"#ff8080":"#e02020"):(flash?"#a0ff80":"#40e050");
    ctx.fillStyle=eyeCol;
    ctx.shadowColor=eyeCol;ctx.shadowBlur=charging||firing?12:6;
    ctx.beginPath();ctx.arc(0,0,e.radius*0.28,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(-e.radius*0.08,-e.radius*0.08,e.radius*0.08,0,7);ctx.fill();
    // треугольники: верхний вершиной вверх, нижний вершиной вниз
    ctx.fillStyle=firing?"#ff9020":"#d06020";
    ctx.strokeStyle="#5a2810";ctx.lineWidth=1.4;
    // верх: вершина вверх
    ctx.beginPath();
    ctx.moveTo(0,-e.radius-13);
    ctx.lineTo(-8,-e.radius-2);
    ctx.lineTo(8,-e.radius-2);
    ctx.closePath();ctx.fill();ctx.stroke();
    // низ: вершина вниз
    ctx.beginPath();
    ctx.moveTo(0,e.radius+13);
    ctx.lineTo(-8,e.radius+2);
    ctx.lineTo(8,e.radius+2);
    ctx.closePath();ctx.fill();ctx.stroke();
    // болты
    ctx.fillStyle="#4a5058";
    [[-10,-8],[10,-8],[-10,8],[10,8]].forEach(([bx,by])=>{
        ctx.beginPath();ctx.arc(bx,by,2.2,0,7);ctx.fill();
    });
    ctx.restore();

    // лазер во время атаки / предупреждение при зарядке
    if(firing||charging){
        const topY=78+WALL, botY=H-WALL;
        const lx=firing&&e.laserX!=null?e.laserX:e.x;
        const pulse=0.5+0.5*Math.sin(gameTime*0.02);
        ctx.save();
        if(charging){
            // предупреждающая линия
            ctx.globalAlpha=0.25+0.2*pulse;
            ctx.strokeStyle="#ff9020";ctx.lineWidth=3;
            ctx.setLineDash([6,6]);
            ctx.beginPath();ctx.moveTo(lx,topY);ctx.lineTo(lx,botY);ctx.stroke();
            ctx.setLineDash([]);
        }else{
            // полный оранжевый лазер
            ctx.globalAlpha=0.2;
            ctx.fillStyle="#ff8020";
            ctx.fillRect(lx-12,topY,24,botY-topY);
            ctx.globalAlpha=0.55+0.2*pulse;
            ctx.fillStyle="#ffb040";
            ctx.fillRect(lx-5,topY,10,botY-topY);
            ctx.globalAlpha=0.9;
            ctx.fillStyle="#ffe0a0";
            ctx.fillRect(lx-2,topY,4,botY-topY);
            // свечение на стрелках
            ctx.globalAlpha=0.7;
            ctx.shadowColor="#ff9020";ctx.shadowBlur=14;
            ctx.fillStyle="#ffcc66";
            ctx.beginPath();ctx.arc(e.x,e.y-e.radius-6,4,0,7);ctx.fill();
            ctx.beginPath();ctx.arc(e.x,e.y+e.radius+6,4,0,7);ctx.fill();
        }
        ctx.restore();
    }
}

function drawLaserBotH(e){
    shadowCircle(e.x,e.y,e.radius,.4);
    const flash=e.hitFlash>0;
    const phase=e.laserPhase||"idle";
    const charging=phase==="charge";
    const firing=phase==="fire";
    ctx.save();
    ctx.translate(e.x,e.y);
    // корпус — серый круг
    ctx.fillStyle=flash?"#ddd":"#8a9098";
    ctx.strokeStyle="#3a4048";ctx.lineWidth=2.2;
    ctx.beginPath();ctx.arc(0,0,e.radius,0,7);ctx.fill();ctx.stroke();
    // синие панели
    ctx.fillStyle=flash?"#80c0ff":"#3080d0";
    ctx.beginPath();ctx.arc(0,0,e.radius*0.72,0,7);ctx.fill();
    // внутренняя пластина
    ctx.fillStyle=flash?"#ccc":"#6a7078";
    ctx.beginPath();ctx.arc(0,0,e.radius*0.52,0,7);ctx.fill();
    // глаз зелёный → красный
    const eyeCol=charging||firing?(flash?"#ff8080":"#e02020"):(flash?"#a0ff80":"#40e050");
    ctx.fillStyle=eyeCol;
    ctx.shadowColor=eyeCol;ctx.shadowBlur=charging||firing?12:6;
    ctx.beginPath();ctx.arc(0,0,e.radius*0.28,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle="#fff";
    ctx.beginPath();ctx.arc(-e.radius*0.08,-e.radius*0.08,e.radius*0.08,0,7);ctx.fill();
    // треугольники слева и справа, вершинами наружу
    ctx.fillStyle=firing?"#40a0ff":"#2060b0";
    ctx.strokeStyle="#103060";ctx.lineWidth=1.4;
    // левый: вершина влево
    ctx.beginPath();
    ctx.moveTo(-e.radius-13,0);
    ctx.lineTo(-e.radius-2,-8);
    ctx.lineTo(-e.radius-2,8);
    ctx.closePath();ctx.fill();ctx.stroke();
    // правый: вершина вправо
    ctx.beginPath();
    ctx.moveTo(e.radius+13,0);
    ctx.lineTo(e.radius+2,-8);
    ctx.lineTo(e.radius+2,8);
    ctx.closePath();ctx.fill();ctx.stroke();
    // болты
    ctx.fillStyle="#4a5058";
    [[-10,-8],[10,-8],[-10,8],[10,8]].forEach(([bx,by])=>{
        ctx.beginPath();ctx.arc(bx,by,2.2,0,7);ctx.fill();
    });
    ctx.restore();

    // горизонтальный лазер
    if(firing||charging){
        const leftX=WALL, rightX=W-WALL;
        const ly=firing&&e.laserY!=null?e.laserY:e.y;
        const pulse=0.5+0.5*Math.sin(gameTime*0.02);
        ctx.save();
        if(charging){
            ctx.globalAlpha=0.25+0.2*pulse;
            ctx.strokeStyle="#40a0ff";ctx.lineWidth=3;
            ctx.setLineDash([6,6]);
            ctx.beginPath();ctx.moveTo(leftX,ly);ctx.lineTo(rightX,ly);ctx.stroke();
            ctx.setLineDash([]);
        }else{
            ctx.globalAlpha=0.2;
            ctx.fillStyle="#2080e0";
            ctx.fillRect(leftX,ly-12,rightX-leftX,24);
            ctx.globalAlpha=0.55+0.2*pulse;
            ctx.fillStyle="#50b0ff";
            ctx.fillRect(leftX,ly-5,rightX-leftX,10);
            ctx.globalAlpha=0.9;
            ctx.fillStyle="#c0e8ff";
            ctx.fillRect(leftX,ly-2,rightX-leftX,4);
            ctx.globalAlpha=0.7;
            ctx.shadowColor="#40a0ff";ctx.shadowBlur=14;
            ctx.fillStyle="#80d0ff";
            ctx.beginPath();ctx.arc(e.x-e.radius-6,e.y,4,0,7);ctx.fill();
            ctx.beginPath();ctx.arc(e.x+e.radius+6,e.y,4,0,7);ctx.fill();
        }
        ctx.restore();
    }
}

function drawAngel(e){
    shadowCircle(e.x,e.y,e.radius,.4);
    const flash=e.hitFlash>0;
    const phase=e.angelPhase||"wander";
    const firing=phase==="fire";
    const stopping=phase==="stop";
    ctx.save();
    ctx.translate(e.x,e.y);

    // сложенные многоперьевые крылья (ближе к телу)
    function drawFoldedWing(side){
        const s=side; // -1 left, +1 right
        const wingCols=flash?["#ffffff","#eef2ff","#d8e0f4"]:["#eef2fa","#d4dceb","#b8c4dc"];
        // 3 слоя перьев, слегка веером вниз и к телу
        for(let i=0;i<3;i++){
            const ox=s*(5+i*2.2);
            const oy=-2+i*3.5;
            ctx.fillStyle=wingCols[i];
            ctx.strokeStyle="#7a8498";ctx.lineWidth=1.1;
            ctx.beginPath();
            ctx.moveTo(ox*0.3,oy-2);
            ctx.quadraticCurveTo(s*(12+i*3),oy-6-i, s*(14+i*2.5),oy+4+i*2);
            ctx.quadraticCurveTo(s*(8+i),oy+10+i, ox*0.2,oy+6);
            ctx.closePath();
            ctx.fill();ctx.stroke();
            // прожилка пера
            ctx.strokeStyle="rgba(100,110,130,0.35)";ctx.lineWidth=0.8;
            ctx.beginPath();
            ctx.moveTo(ox*0.4,oy);
            ctx.quadraticCurveTo(s*(10+i*2),oy+2, s*(12+i*2),oy+6+i);
            ctx.stroke();
        }
    }
    drawFoldedWing(-1);
    drawFoldedWing(1);

    // мантия / статуя
    ctx.fillStyle=flash?"#f4f6ff":"#c8d0e4";
    ctx.strokeStyle="#5a6480";ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(-9,14);
    ctx.quadraticCurveTo(-11,4,-7,-6);
    ctx.quadraticCurveTo(-3,-11,0,-12);
    ctx.quadraticCurveTo(3,-11,7,-6);
    ctx.quadraticCurveTo(11,4,9,14);
    ctx.quadraticCurveTo(0,16,-9,14);
    ctx.closePath();ctx.fill();ctx.stroke();
    // складки мантии
    ctx.strokeStyle="rgba(80,90,120,0.3)";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-3,-4);ctx.quadraticCurveTo(-4,4,-2,12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(3,-4);ctx.quadraticCurveTo(4,4,2,12);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,13);ctx.stroke();

    // руки слегка
    ctx.fillStyle=flash?"#f0e8e0":"#d8d0c8";
    ctx.beginPath();ctx.ellipse(-8,2,3,5,0.3,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(8,2,3,5,-0.3,0,7);ctx.fill();

    // голова
    ctx.fillStyle=flash?"#fff8f0":"#f0e6dc";
    ctx.strokeStyle="#8a7a6a";ctx.lineWidth=1.3;
    ctx.beginPath();ctx.arc(0,-15,6.5,0,7);ctx.fill();ctx.stroke();
    // волосы
    ctx.fillStyle=flash?"#fff0c0":"#e8d090";
    ctx.beginPath();
    ctx.arc(0,-17,6.2,Math.PI*1.1,Math.PI*1.9);
    ctx.quadraticCurveTo(0,-24,0,-17);
    ctx.fill();
    // локоны
    ctx.beginPath();ctx.ellipse(-5,-12,2,3.5,0.2,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(5,-12,2,3.5,-0.2,0,7);ctx.fill();

    // нимб
    ctx.strokeStyle=stopping||firing?"#ffd040":"#e0c860";
    ctx.lineWidth=2.4;
    if(stopping||firing){ctx.shadowColor="#ffd040";ctx.shadowBlur=12}
    ctx.beginPath();ctx.ellipse(0,-24,8.5,3.2,0,0,7);ctx.stroke();
    ctx.shadowBlur=0;
    // внутреннее кольцо нимба
    ctx.globalAlpha=0.4;
    ctx.strokeStyle="#fff0a0";ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(0,-24,6,2.2,0,0,7);ctx.stroke();
    ctx.globalAlpha=1;

    // глаза
    ctx.fillStyle=firing?"#e02828":(stopping?"#c08020":"#3a4860");
    ctx.beginPath();ctx.arc(-2.2,-15,1.4,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(2.2,-15,1.4,0,7);ctx.fill();
    // блики глаз
    ctx.fillStyle="rgba(255,255,255,0.7)";
    ctx.beginPath();ctx.arc(-1.8,-15.4,0.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(2.6,-15.4,0.5,0,7);ctx.fill();

    // постамент / низ статуи
    ctx.fillStyle=flash?"#d0d8e8":"#9aa4b8";
    ctx.strokeStyle="#4a5468";ctx.lineWidth=1.3;
    ctx.beginPath();
    ctx.moveTo(-11,14);ctx.lineTo(-12,18);ctx.lineTo(12,18);ctx.lineTo(11,14);
    ctx.closePath();ctx.fill();ctx.stroke();

    ctx.restore();

    // 8 лазеров
    if(firing||stopping){
        const ox=firing&&e.laserOriginX!=null?e.laserOriginX:e.x;
        const oy=firing&&e.laserOriginY!=null?e.laserOriginY:e.y;
        const pulse=0.5+0.5*Math.sin(gameTime*0.025);
        const reach=Math.max(W,H);
        ctx.save();
        for(let i=0;i<8;i++){
            const a=i*Math.PI/4;
            const ex=ox+Math.cos(a)*reach;
            const ey=oy+Math.sin(a)*reach;
            if(stopping){
                ctx.globalAlpha=0.2+0.15*pulse;
                ctx.strokeStyle="#ffe080";ctx.lineWidth=2;
                ctx.setLineDash([5,5]);
                ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ex,ey);ctx.stroke();
                ctx.setLineDash([]);
            }else{
                ctx.globalAlpha=0.18;
                ctx.strokeStyle="#ffd060";ctx.lineWidth=14;
                ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ex,ey);ctx.stroke();
                ctx.globalAlpha=0.5+0.2*pulse;
                ctx.strokeStyle="#ffe8a0";ctx.lineWidth=5;
                ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ex,ey);ctx.stroke();
                ctx.globalAlpha=0.85;
                ctx.strokeStyle="#fff8e0";ctx.lineWidth=2;
                ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ex,ey);ctx.stroke();
            }
        }
        ctx.restore();
    }
}

function drawReaper(e){
    shadowCircle(e.x,e.y,e.radius,.45);
    const flash=e.hitFlash>0;
    const phase=e.reaperPhase||"chase";
    const telegraph=phase==="telegraph";
    const slash=phase==="slash";
    const ang=e.angle||0;
    const sa=e.slashAngle||ang;
    const range=e.slashRange||140;
    const half=e.slashHalf||0.55;
    const progress=slash?clamp((e.slashProgress||0)/22,0,1):0;

    // веер атаки (под телом)
    if(telegraph||slash){
        ctx.save();
        ctx.translate(e.x,e.y);
        const pulse=telegraph?0.15+0.12*Math.sin(gameTime*0.05):0.45;
        // заполнение сектора
        ctx.globalAlpha=pulse;
        const grad=ctx.createRadialGradient(0,0,8,0,0,range);
        grad.addColorStop(0,slash?"rgba(120,40,180,0.75)":"rgba(70,30,110,0.55)");
        grad.addColorStop(0.55,slash?"rgba(90,20,140,0.35)":"rgba(50,20,80,0.3)");
        grad.addColorStop(1,"rgba(20,0,40,0)");
        ctx.fillStyle=grad;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,range,sa-half,sa+half);
        ctx.closePath();
        ctx.fill();
        // контур веера
        ctx.globalAlpha=telegraph?0.5+0.2*Math.sin(gameTime*0.06):0.85;
        ctx.strokeStyle=slash?"#d070ff":"#9050c8";
        ctx.lineWidth=slash?3:2;
        ctx.shadowColor="#a040e0";ctx.shadowBlur=slash?14:6;
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.arc(0,0,range,sa-half,sa+half);
        ctx.closePath();
        ctx.stroke();
        ctx.shadowBlur=0;
        // дуги-уровни внутри веера
        ctx.globalAlpha=telegraph?0.25:0.4;
        ctx.strokeStyle="#c080ff";
        ctx.lineWidth=1.2;
        for(let r=0.35;r<=0.9;r+=0.28){
            ctx.beginPath();
            ctx.arc(0,0,range*r,sa-half,sa+half);
            ctx.stroke();
        }
        // линия-направление удара
        if(telegraph){
            ctx.globalAlpha=0.55;
            ctx.strokeStyle="#e0a0ff";
            ctx.lineWidth=1.5;
            ctx.setLineDash([4,6]);
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(Math.cos(sa)*range,Math.sin(sa)*range);
            ctx.stroke();
            ctx.setLineDash([]);
        }
        // при ударе — яркая дуга, «прокатывающаяся» по сектору
        if(slash){
            const sweep=sa-half+progress*half*2;
            ctx.globalAlpha=0.9*(1-progress*0.5);
            ctx.strokeStyle="#f8e0ff";
            ctx.lineWidth=5;
            ctx.shadowColor="#e080ff";ctx.shadowBlur=16;
            ctx.beginPath();
            ctx.arc(0,0,range*0.95,sweep-0.12,sweep+0.12);
            ctx.stroke();
            ctx.shadowBlur=0;
        }
        ctx.restore();
    }

    ctx.save();
    ctx.translate(e.x,e.y);

    // мантия / капюшон
    ctx.fillStyle=flash?"#6a6080":"#1a1528";
    ctx.strokeStyle="#0a0810";ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(-12,14);
    ctx.quadraticCurveTo(-14,0,-10,-8);
    ctx.quadraticCurveTo(-6,-16,0,-18);
    ctx.quadraticCurveTo(6,-16,10,-8);
    ctx.quadraticCurveTo(14,0,12,14);
    ctx.quadraticCurveTo(0,16,-12,14);
    ctx.closePath();ctx.fill();ctx.stroke();
    // капюшон
    ctx.fillStyle=flash?"#5a5070":"#12101c";
    ctx.beginPath();
    ctx.arc(0,-12,9,Math.PI*0.15,Math.PI*0.85);
    ctx.quadraticCurveTo(0,-22,0,-12);
    ctx.fill();ctx.stroke();
    // лицо-череп в тени
    ctx.fillStyle=flash?"#e0d8e8":"#c8c0d0";
    ctx.beginPath();ctx.arc(0,-10,5,0,7);ctx.fill();
    ctx.fillStyle="#1a1020";
    ctx.beginPath();ctx.ellipse(-2,-10.5,1.6,2,0,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(2,-10.5,1.6,2,0,0,7);ctx.fill();

    // коса: в покое за спиной, при телеграфе/ударе — вынесена вперёд по углу атаки
    ctx.save();
    if(telegraph||slash){
        const swing=slash?(sa-half+progress*half*2):sa;
        ctx.rotate(swing);
        // древко
        ctx.strokeStyle="#4a3840";ctx.lineWidth=3;ctx.lineCap="round";
        ctx.shadowColor="#a040e0";ctx.shadowBlur=slash?10:0;
        ctx.beginPath();ctx.moveTo(6,4);ctx.lineTo(range*0.72,0);ctx.stroke();
        // лезвие
        ctx.fillStyle=slash?"#e8f0ff":"#b0b8c8";
        ctx.strokeStyle="#303840";ctx.lineWidth=1.4;
        ctx.beginPath();
        ctx.moveTo(range*0.55,-2);
        ctx.quadraticCurveTo(range*0.78,-16,range*0.88,-2);
        ctx.quadraticCurveTo(range*0.78,8,range*0.55,4);
        ctx.closePath();
        ctx.fill();ctx.stroke();
        // блик на лезвии
        ctx.strokeStyle="rgba(255,255,255,0.55)";ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(range*0.6,-3);
        ctx.quadraticCurveTo(range*0.75,-10,range*0.82,-2);
        ctx.stroke();
        ctx.shadowBlur=0;
    }else{
        // коса за плечом
        ctx.strokeStyle="#8a9098";ctx.lineWidth=2.4;ctx.lineCap="round";
        ctx.beginPath();ctx.moveTo(8,-8);ctx.lineTo(10,12);ctx.stroke();
        ctx.fillStyle=flash?"#e0e8f0":"#a0a8b8";
        ctx.strokeStyle="#303840";ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(8,-10);
        ctx.quadraticCurveTo(20,-18,24,-8);
        ctx.quadraticCurveTo(16,-10,8,-6);
        ctx.closePath();ctx.fill();ctx.stroke();
    }
    ctx.restore();

    ctx.restore();
}

function drawLantern(e){
    const phase=e.lanternPhase||"invisible";
    const invisible=phase==="invisible";
    const telegraph=phase==="telegraph";
    const attack=phase==="attack";
    const flash=e.hitFlash>0;
    const bob=Math.sin(gameTime*0.008+(e.phase||0))*2;
    const ar=e.attackRadius||72;

    // синий ренж атаки — многослойный
    if(telegraph||attack){
        const pulse=0.5+0.5*Math.sin(gameTime*0.045);
        const tPulse=telegraph?0.18+0.14*pulse:0.42;
        ctx.save();
        // мягкая заливка
        const rg=ctx.createRadialGradient(e.x,e.y,8,e.x,e.y,ar);
        rg.addColorStop(0,attack?"rgba(120,220,255,0.55)":`rgba(60,160,255,${0.25+0.1*pulse})`);
        rg.addColorStop(0.6,attack?"rgba(40,140,255,0.28)":"rgba(30,100,200,0.12)");
        rg.addColorStop(1,"rgba(20,60,140,0)");
        ctx.globalAlpha=1;
        ctx.fillStyle=rg;
        ctx.beginPath();ctx.arc(e.x,e.y,ar,0,7);ctx.fill();
        // основной контур
        ctx.globalAlpha=telegraph?0.45+0.25*pulse:0.85;
        ctx.strokeStyle=attack?"#c0f0ff":"#70c8ff";
        ctx.lineWidth=attack?3.5:2.5;
        ctx.shadowColor="#40b0ff";ctx.shadowBlur=attack?16:8;
        ctx.beginPath();ctx.arc(e.x,e.y,ar,0,7);ctx.stroke();
        ctx.shadowBlur=0;
        // внутренние кольца-предупреждение
        if(telegraph){
            const shrink=0.55+0.35*((e.lanternTimer||60)/60);
            ctx.globalAlpha=0.35+0.2*pulse;
            ctx.strokeStyle="#a0e0ff";
            ctx.lineWidth=1.5;
            ctx.setLineDash([5,7]);
            ctx.beginPath();ctx.arc(e.x,e.y,ar*shrink,0,7);ctx.stroke();
            ctx.beginPath();ctx.arc(e.x,e.y,ar*0.45,0,7);ctx.stroke();
            ctx.setLineDash([]);
        }
        // вспышка при ударе
        if(attack){
            ctx.globalAlpha=0.5;
            ctx.fillStyle="#e0f8ff";
            ctx.beginPath();ctx.arc(e.x,e.y,ar*0.35,0,7);ctx.fill();
            ctx.globalAlpha=0.7;
            ctx.strokeStyle="#fff";
            ctx.lineWidth=2;
            ctx.beginPath();ctx.arc(e.x,e.y,ar*0.7,0,7);ctx.stroke();
        }
        ctx.restore();
    }

    // в инвизе полностью невидим
    if(invisible) return;

    shadowCircle(e.x,e.y,e.radius,.4);
    ctx.save();
    ctx.translate(e.x,e.y+bob);
    // усиленное свечение при атаке
    const glowR=attack?e.radius*2.2:telegraph?e.radius*1.8:e.radius*1.35;
    const glowA=attack?0.7:telegraph?0.55:0.4;
    ctx.globalAlpha=glowA;
    const glow=ctx.createRadialGradient(0,-4,2,0,-4,glowR);
    glow.addColorStop(0,attack?"#e0f8ff":"#80d0ff");
    glow.addColorStop(0.5,"#40a0ff");
    glow.addColorStop(1,"rgba(20,80,180,0)");
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(0,-4,glowR,0,7);ctx.fill();
    ctx.globalAlpha=1;
    // корпус
    ctx.fillStyle=flash||attack?"#a0d0ff":"#2a5080";
    ctx.strokeStyle="#0a2038";ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-9,8);ctx.lineTo(-11,-2);ctx.lineTo(-7,-12);
    ctx.lineTo(7,-12);ctx.lineTo(11,-2);ctx.lineTo(9,8);
    ctx.closePath();ctx.fill();ctx.stroke();
    // огонёк
    const g=ctx.createRadialGradient(0,-2,1,0,-2,attack?12:9);
    g.addColorStop(0,"#ffffff");
    g.addColorStop(0.35,attack?"#c0f0ff":"#e0f4ff");
    g.addColorStop(0.7,flash||attack?"#80d0ff":"#40a8ff");
    g.addColorStop(1,"#1860a0");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.ellipse(0,-2,attack?9:7,attack?10:8,0,0,7);ctx.fill();
    // крыша
    ctx.fillStyle=flash||attack?"#c0e0ff":"#1a3a60";
    ctx.beginPath();

function drawDevilBeams(e,telegraph){
    const beams=getActiveDevilBeams(e);
    let list=beams;
    if(telegraph){
        list=[];
        for(const s of (e.devilBeams||[])) for(const b of s.beams) list.push(b);
    }
    if(!list.length) return;
    const T=78+WALL, B=H-WALL, L=WALL, R=W-WALL;

    // все лучи — одинаковый стиль (отрезок + толщина)
    function beamSegment(beam){
        if(beam.axis==="v"){
            const w=beam.w||W/8;
            return {x1:beam.pos,y1:T,x2:beam.pos,y2:B,w};
        }
        if(beam.axis==="h"){
            const w=beam.h||H/8;
            return {x1:L,y1:beam.pos,x2:R,y2:beam.pos,w};
        }
        return {x1:beam.x1,y1:beam.y1,x2:beam.x2,y2:beam.y2,w:beam.w||W/8};
    }

    ctx.save();
    ctx.lineCap="butt";
    for(const beam of list){
        const s=beamSegment(beam);
        if(telegraph){
            ctx.globalAlpha=0.14;
            ctx.strokeStyle="rgba(200,70,50,0.4)";
            ctx.lineWidth=s.w;
            ctx.setLineDash([6,8]);
            ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
            ctx.setLineDash([]);
        }else{
            // 3 слоя — одинаково для V / H / диагонали
            ctx.globalAlpha=0.45;
            ctx.strokeStyle="#e03010";ctx.lineWidth=s.w;
            ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
            ctx.globalAlpha=0.7;
            ctx.strokeStyle="#ff8018";ctx.lineWidth=s.w*0.5;
            ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
            ctx.globalAlpha=0.85;
            ctx.strokeStyle="#ffe8b0";ctx.lineWidth=s.w*0.2;
            ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
        }
    }
    ctx.restore();
}

function drawWorm(e){
    const flash=e.hitFlash>0;
    const segs=e.segments||[];
    // тело сзади → голова спереди
    for(let i=segs.length-1;i>=0;i--){
        const s=segs[i];
        const r=s.r||e.segR||16;
        const t=i/(segs.length||1);
        // серебряный металл
        const g=ctx.createRadialGradient(s.x-r*0.3,s.y-r*0.3,r*0.2,s.x,s.y,r);
        if(flash){
            g.addColorStop(0,"#ffffff");g.addColorStop(0.5,"#d0d8e8");g.addColorStop(1,"#8090a8");
        }else{
            g.addColorStop(0,"#e8eef8");g.addColorStop(0.45,"#a8b4c8");g.addColorStop(1,"#5a6880");
        }
        ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.fillStyle=g;ctx.fill();
        // синие полоски
        ctx.strokeStyle=flash?"#80c8ff":"#2a6ab0";
        ctx.lineWidth=2.2;
        ctx.beginPath();
        ctx.arc(s.x,s.y,r*0.72, -0.9+t, 0.9+t);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(s.x,s.y,r*0.45, 1.2+t, 2.4+t);
        ctx.stroke();
        // контур
        ctx.strokeStyle="rgba(20,30,50,0.55)";ctx.lineWidth=1.4;
        ctx.beginPath();ctx.arc(s.x,s.y,r,0,7);ctx.stroke();
    }
    // голова
    const hx=e.x, hy=e.y, hr=e.radius||20;
    const hg=ctx.createRadialGradient(hx-6,hy-6,4,hx,hy,hr);
    hg.addColorStop(0,flash?"#fff":"#f0f4ff");
    hg.addColorStop(0.5,flash?"#c8d0e0":"#9aa8c0");
    hg.addColorStop(1,"#4a5870");
    ctx.beginPath();ctx.arc(hx,hy,hr,0,7);ctx.fillStyle=hg;ctx.fill();
    // пасть / глаза
    const ang=e.angle||0;
    ctx.save();
    ctx.translate(hx,hy);ctx.rotate(ang);
    ctx.fillStyle="#1a2030";
    ctx.beginPath();ctx.ellipse(hr*0.35,0,hr*0.35,hr*0.28,0,0,7);ctx.fill();
    ctx.fillStyle="#40c8ff";
    ctx.beginPath();ctx.arc(hr*0.15,-hr*0.35,3.2,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(hr*0.15,hr*0.35,3.2,0,7);ctx.fill();
    // синяя полоска на голове
    ctx.strokeStyle="#2a6ab0";ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,hr*0.7,-0.6,0.6);ctx.stroke();
    ctx.restore();
    ctx.strokeStyle="rgba(20,30,50,0.6)";ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(hx,hy,hr,0,7);ctx.stroke();
}

    ctx.moveTo(r*0.75,-r*0.15);
    ctx.lineTo(r*0.15,-r*0.55);

    ctx.beginPath();
    ctx.moveTo(-r*0.5,r*0.28);
    ctx.lineTo(-r*0.15,r*0.55);
    ctx.lineTo(0,r*0.48);

    ctx.lineTo(r*0.5,r*0.28);

    ctx.restore();
}

        const age=e.crystalAge||0;
        const T=78+WALL, B=H-WALL, L=WALL, R=W-WALL;
        function beamSeg(beam){
            if(beam.axis==="v") return {x1:beam.pos,y1:T,x2:beam.pos,y2:B,w:beam.w||W/8};
            if(beam.axis==="h") return {x1:L,y1:beam.pos,x2:R,y2:beam.pos,w:beam.h||H/8};
            return {x1:beam.x1,y1:beam.y1,x2:beam.x2,y2:beam.y2,w:beam.w||W/8};
        }
        let list=[];
        if(telegraph){
            for(const s of steps) for(const b of s.beams) list.push(b);
        }else{
            for(const s of steps){
                if(age>=s.at && age<s.at+s.dur) for(const b of s.beams) list.push(b);
            }
        }
        ctx.save();ctx.lineCap="butt";
        for(const beam of list){
            const s=beamSeg(beam);
            if(telegraph){
                ctx.globalAlpha=0.16;
                ctx.strokeStyle="rgba(80,200,255,0.5)";
                ctx.lineWidth=s.w;
                ctx.setLineDash([6,8]);
                ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
                ctx.setLineDash([]);
            }else{
                ctx.globalAlpha=0.4;
                ctx.strokeStyle="#2080e0";ctx.lineWidth=s.w;
                ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
                ctx.globalAlpha=0.7;
                ctx.strokeStyle="#60d0ff";ctx.lineWidth=s.w*0.45;
                ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
                ctx.globalAlpha=0.9;
                ctx.strokeStyle="#e0f8ff";ctx.lineWidth=s.w*0.18;
                ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
            }
        }
        ctx.restore();
    }

    // радиальные лазеры от босса (статичные или вращающиеся)
    if((telegraph||firing) && (e.crystalAtk===1||e.crystalAtk===6)){
        const reach=Math.max(W,H);
        const ray0=e.crystalRayAng||0;
        const nRays=e.crystalAtk===6?6:8;
        const pulse=0.5+0.5*Math.sin(gameTime*0.04);
        ctx.save();
        for(let i=0;i<nRays;i++){
            const a=ray0+i*(Math.PI*2/nRays);
            const ex=e.x+Math.cos(a)*reach;
            const ey=e.y+Math.sin(a)*reach;
            if(telegraph){
                ctx.globalAlpha=0.2+0.12*pulse;
                ctx.strokeStyle="#80d0ff";ctx.lineWidth=2.5;
                ctx.setLineDash([5,6]);
                ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(ex,ey);ctx.stroke();
                ctx.setLineDash([]);
            }else{
                ctx.globalAlpha=0.18;
                ctx.strokeStyle="#40a0ff";ctx.lineWidth=e.crystalAtk===6?14:16;
                ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(ex,ey);ctx.stroke();
                ctx.globalAlpha=0.55+0.2*pulse;
                ctx.strokeStyle="#a0e8ff";ctx.lineWidth=6;
                ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(ex,ey);ctx.stroke();
                ctx.globalAlpha=0.9;
                ctx.strokeStyle="#f0ffff";ctx.lineWidth=2;
                ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(ex,ey);ctx.stroke();
            }
        }
        ctx.restore();
    }

    // круги-взрывы (ренж) — усиленный телеграф
    if(e.crystalMarkers){
        for(const m of e.crystalMarkers){
            const maxT=m.maxTimer||m.timer||85;
            const t=clamp(m.timer/maxT,0,1);
            const danger=1-t; // ближе к взрыву → ярче
            const pulse=0.5+0.5*Math.sin(gameTime*(0.06+danger*0.08));
            const R=m.r||48;
            ctx.save();

            // мягкая заливка зоны
            const rg=ctx.createRadialGradient(m.x,m.y,4,m.x,m.y,R);
            rg.addColorStop(0,m.chase?`rgba(120,220,255,${0.28+0.2*danger})`:`rgba(40,160,255,${0.18+0.15*danger})`);
            rg.addColorStop(0.55,`rgba(30,120,220,${0.1+0.12*danger*pulse})`);
            rg.addColorStop(1,"rgba(10,40,80,0)");
            ctx.fillStyle=rg;
            ctx.beginPath();ctx.arc(m.x,m.y,R,0,7);ctx.fill();

            // внешний контур
            ctx.globalAlpha=0.4+0.45*danger*pulse;
            ctx.strokeStyle=m.chase?"#c0f0ff":"#70d0ff";
            ctx.lineWidth=2.5+danger*1.5;
            ctx.shadowColor="#40b0ff";ctx.shadowBlur=8+danger*10;
            ctx.beginPath();ctx.arc(m.x,m.y,R,0,7);ctx.stroke();
            ctx.shadowBlur=0;

            // сжимающееся внутреннее кольцо (таймер)
            ctx.globalAlpha=0.55+0.3*pulse;
            ctx.strokeStyle="#e0f8ff";
            ctx.lineWidth=2;
            ctx.setLineDash(m.chase?[4,5]:[]);
            ctx.beginPath();ctx.arc(m.x,m.y,R*Math.max(0.12,t),0,7);ctx.stroke();
            ctx.setLineDash([]);

            // среднее кольцо
            ctx.globalAlpha=0.25+0.2*danger;
            ctx.strokeStyle="#a0e0ff";
            ctx.lineWidth=1.4;
            ctx.beginPath();ctx.arc(m.x,m.y,R*0.65,0,7);ctx.stroke();

            // крест / прицел в центре
            ctx.globalAlpha=0.35+0.4*danger*pulse;
            ctx.strokeStyle="#d0f8ff";
            ctx.lineWidth=1.5;
            const cr=6+danger*4;
            ctx.beginPath();ctx.moveTo(m.x-cr,m.y);ctx.lineTo(m.x+cr,m.y);ctx.stroke();
            ctx.beginPath();ctx.moveTo(m.x,m.y-cr);ctx.lineTo(m.x,m.y+cr);ctx.stroke();
            ctx.beginPath();ctx.arc(m.x,m.y,3,0,7);ctx.stroke();

            // для chase — хвостик-след
            if(m.chase){
                ctx.globalAlpha=0.2+0.15*pulse;
                ctx.strokeStyle="#80d0ff";
                ctx.lineWidth=2;
                ctx.beginPath();ctx.arc(m.x,m.y,R*1.15,0,7);ctx.stroke();
            }

            // вспышка перед взрывом
            if(t<0.2){
                ctx.globalAlpha=(0.2-t)*3;
                ctx.fillStyle="#e8ffff";
                ctx.beginPath();ctx.arc(m.x,m.y,R*0.35,0,7);ctx.fill();
            }
            ctx.restore();
        }
    }

    // тело: ромб / 4-конечная звезда
    shadowCircle(e.x,e.y,e.radius*0.7,.45);
    ctx.save();
    ctx.translate(e.x,e.y);
    ctx.rotate(spin*0.4);

    const r=e.radius;
    // внешнее свечение
    const glow=ctx.createRadialGradient(0,0,r*0.2,0,0,r*1.4);
    glow.addColorStop(0,flash?"rgba(200,240,255,0.55)":"rgba(60,180,255,0.35)");
    glow.addColorStop(1,"rgba(20,80,160,0)");
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(0,0,r*1.4,0,7);ctx.fill();

    // 4-конечная звезда (ромб с лучами)
    function starPath(scale){
        const R=r*scale, r2=R*0.38;
        ctx.beginPath();
        for(let i=0;i<8;i++){
            const a=i*Math.PI/4-Math.PI/2;
            const rr=i%2===0?R:r2;
            const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
            if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();
    }
    // тёмная подложка
    ctx.fillStyle=flash?"#c0e8ff":"#0a3050";
    starPath(1.08);ctx.fill();
    // основной кристалл
    const cg=ctx.createLinearGradient(-r*0.5,-r*0.6,r*0.5,r*0.6);
    if(flash){
        cg.addColorStop(0,"#ffffff");cg.addColorStop(0.5,"#a0e0ff");cg.addColorStop(1,"#60b0e0");
    }else{
        cg.addColorStop(0,"#80e0ff");cg.addColorStop(0.35,"#30a0e0");cg.addColorStop(0.7,"#1870b0");cg.addColorStop(1,"#0a4068");
    }
    ctx.fillStyle=cg;
    starPath(1);ctx.fill();
    ctx.strokeStyle=flash?"#e8f8ff":"#40c0ff";ctx.lineWidth=2.2;
    starPath(1);ctx.stroke();

    // внутренний ромб
    ctx.fillStyle=flash?"rgba(255,255,255,0.7)":"rgba(160,230,255,0.55)";
    ctx.beginPath();
    ctx.moveTo(0,-r*0.42);ctx.lineTo(r*0.28,0);ctx.lineTo(0,r*0.42);ctx.lineTo(-r*0.28,0);
    ctx.closePath();ctx.fill();
    // ядро
    ctx.fillStyle=flash?"#fff":"#e0f8ff";
    ctx.shadowColor="#60d0ff";ctx.shadowBlur=firing||telegraph?18:10;
    ctx.beginPath();ctx.arc(0,0,r*0.14,0,7);ctx.fill();
    ctx.shadowBlur=0;
    // грани
    ctx.strokeStyle="rgba(200,240,255,0.35)";ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(0,-r*0.9);ctx.lineTo(0,r*0.9);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-r*0.9,0);ctx.lineTo(r*0.9,0);ctx.stroke();

    ctx.restore();
}

function drawEnemy(e){
    if(e.type==="chaser")drawChaser(e);
    else if(e.type==="dasher")drawDasher(e);
    else if(e.type==="shooter")drawShooter(e);
    else if(e.type==="tank")drawTank(e);
    else if(e.type==="spinner")drawSpinner(e);
    else if(e.type==="skeleton")drawSkeleton(e);
    else if(e.type==="flyingeye")drawFlyingEye(e);
    else if(e.type==="laserbot")drawLaserBot(e);
    else if(e.type==="laserboth")drawLaserBotH(e);
    else if(e.type==="angel")drawAngel(e);
    else if(e.type==="reaper")drawReaper(e);
    else if(e.type==="lantern")drawLantern(e);
    else if(e.type==="devil")drawDevil(e);
    else if(e.type==="worm")drawWorm(e);
    else if(e.type==="crystal")drawCrystal(e);
    else if(e.type==="walle")drawWalle(e);
    else if(e.type==="cowboy")drawCowboy(e);
    else if(e.type==="ev9")drawEv9(e);
    else drawBoss(e);

    // яд (носок): зелёный оттенок + частицы (не в инвизе)
    if(e.poisonTimer>0 && !e.intangible){
        ctx.save();
        ctx.globalAlpha=0.4;
        ctx.fillStyle="#5dff4a";
        ctx.beginPath();ctx.arc(e.x,e.y,e.radius*1.15,0,7);ctx.fill();
        ctx.globalAlpha=0.25;
        ctx.strokeStyle="#3aaa28";ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(e.x,e.y,e.radius*1.25,0,7);ctx.stroke();
        ctx.restore();
        if(Math.random()<0.1){
            particles.push({
                x:e.x+rand(-e.radius,e.radius),y:e.y-e.radius*0.5,
                vx:rand(-.4,.4),vy:rand(-1.2,-.3),
                life:18,maxLife:18,size:rand(2,4),type:"beam"
            });
        }
    }
}

/* PROJECTILES — зелёные звёзды как на концепте */
function drawBullets(){
    for(const b of bullets){
        if(b.orbit&&b.hidden) continue; // в стене не рисуем
        ctx.save();
        const rot=(b.orbit||b.spiral||b.boomerang)?(b.spin||0):gameTime*0.01;
        ctx.shadowColor="#7dff4a";ctx.shadowBlur=12;
        ctx.fillStyle="rgba(125,255,74,0.25)";
        drawStar4(b.x,b.y,b.radius*1.8,b.radius*0.7,rot);
        ctx.fill();
        ctx.fillStyle="#7dff4a";
        drawStar4(b.x,b.y,b.radius*1.35,b.radius*0.5,rot);
        ctx.fill();
        ctx.fillStyle="#e8ffc0";
        drawStar4(b.x,b.y,b.radius*0.7,b.radius*0.25,rot);
        ctx.fill();
        ctx.fillStyle="#fff";
        ctx.beginPath();ctx.arc(b.x,b.y,b.radius*0.22,0,7);ctx.fill();
        ctx.restore();
    }

    for(const b of enemyBullets){
        ctx.save();
        if(b.type==="scythe"){
            // коса-бумеранг
            ctx.shadowColor="#9ad0ff";ctx.shadowBlur=10;
            for(let i=0;i<(b.trail||[]).length;i++){
                const p=b.trail[i];
                const a=(i+1)/b.trail.length*.2;
                ctx.fillStyle=`rgba(180,220,255,${a})`;
                ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
            }
            ctx.translate(b.x,b.y);
            ctx.rotate(b.spin||0);
            // рукоять
            ctx.strokeStyle="#5a4030";ctx.lineWidth=3;ctx.lineCap="round";
            ctx.beginPath();ctx.moveTo(-10,2);ctx.lineTo(6,2);ctx.stroke();
            // лезвие
            ctx.fillStyle="#c8d8e8";
            ctx.strokeStyle="#3a4a58";ctx.lineWidth=1.5;
            ctx.beginPath();
            ctx.moveTo(4,-2);
            ctx.quadraticCurveTo(16,-10,14,2);
            ctx.quadraticCurveTo(16,8,4,4);
            ctx.closePath();
            ctx.fill();ctx.stroke();
            // блик на лезвии
            ctx.strokeStyle="rgba(255,255,255,0.5)";ctx.lineWidth=1;
            ctx.beginPath();ctx.moveTo(6,-1);ctx.quadraticCurveTo(12,-6,12,1);ctx.stroke();
            ctx.restore();
            continue;
        }
        if(b.type==="cowboy"){
            for(let i=0;i<(b.trail||[]).length;i++){
                const p=b.trail[i];
                const a=(i+1)/b.trail.length*.35;
                ctx.fillStyle=`rgba(255,200,80,${a})`;
                ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill();
            }
            ctx.shadowColor="#ffc040";ctx.shadowBlur=10;
            ctx.fillStyle="#f0c040";
            ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,7);ctx.fill();
            ctx.fillStyle="#fff8d0";
            ctx.beginPath();ctx.arc(b.x,b.y,b.radius*0.45,0,7);ctx.fill();
            ctx.shadowBlur=0;
            ctx.restore();
            continue;
        }
        const isRed=b.color==="red";
        const isCyan=b.color==="cyan";
        const col=isCyan?"#40c8ff":isRed?"#ff536d":"#d06aff";
        ctx.shadowColor=col;ctx.shadowBlur=14;
        for(let i=0;i<b.trail.length;i++){
            const p=b.trail[i];
            const a=(i+1)/b.trail.length*.3;
            ctx.fillStyle=isCyan?`rgba(60,180,255,${a})`:isRed?`rgba(255,60,90,${a})`:`rgba(190,80,255,${a})`;
            ctx.beginPath();ctx.arc(p.x,p.y,b.radius*(.4+i/b.trail.length*.6),0,7);ctx.fill();
        }
        const g=ctx.createRadialGradient(b.x-2,b.y-2,1,b.x,b.y,b.radius);
        g.addColorStop(0,"#fff");
        g.addColorStop(.4,col);
        g.addColorStop(1,isCyan?"#1060a0":isRed?"#a01030":"#6a2080");
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,7);ctx.fill();
        ctx.restore();
    }
}

/* PARTICLES */
function drawParticles(){
    for(const p of particles){
        const a=clamp(p.life/p.maxLife,0,1);
        if(p.type==="ring"){
            ctx.save();
            ctx.globalAlpha=a*0.85;
            ctx.strokeStyle=p.ringColor||"#9b5de5";
            ctx.lineWidth=(p.ringWidth||4)*(0.4+0.6*a);
            ctx.shadowColor=p.ringColor||"#9b5de5";
            ctx.shadowBlur=12;
            ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.stroke();
            // внутреннее мягкое кольцо
            ctx.globalAlpha=a*0.35;
            ctx.lineWidth=(p.ringWidth||4)*2;
            ctx.shadowBlur=0;
            ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.92,0,7);ctx.stroke();
            ctx.restore();
            continue;
        }
        if(p.type==="slashArc"){
            ctx.save();
            ctx.translate(p.x,p.y);
            ctx.globalAlpha=a*0.7;
            ctx.strokeStyle=p.color||"#c060ff";
            ctx.lineWidth=p.size||4;
            ctx.lineCap="round";
            ctx.shadowColor=p.color||"#c060ff";
            ctx.shadowBlur=10;
            ctx.beginPath();
            ctx.arc(0,0,p.radius||80,p.a0||0,p.a1||1);
            ctx.stroke();
            ctx.globalAlpha=a*0.25;
            ctx.lineWidth=(p.size||4)*3;
            ctx.shadowBlur=0;
            ctx.beginPath();
            ctx.arc(0,0,p.radius||80,p.a0||0,p.a1||1);
            ctx.stroke();
            ctx.restore();
            continue;
        }
        ctx.globalAlpha=a;
        if(p.type==="magic"||p.type==="boss"){
            ctx.fillStyle="#d06eff";
            ctx.shadowColor="#d06eff";ctx.shadowBlur=8;
        }else if(p.type==="playerHit"){
            ctx.fillStyle="#7dff4a";
            ctx.shadowColor="#7dff4a";ctx.shadowBlur=6;
        }else if(p.type==="death"){
            ctx.fillStyle="#dc697d";
            ctx.shadowColor="#dc697d";ctx.shadowBlur=6;
        }else if(p.type==="burn"){
            const t=p.life/p.maxLife;
            ctx.fillStyle=t>0.65?"#ffe566":(t>0.35?"#ff9a28":"#ff4a10");
            ctx.shadowColor="#ff7a20";ctx.shadowBlur=10;
        }else if(p.type==="beam"){
            ctx.fillStyle="#b4ff90";
            ctx.shadowColor="#7dff4a";ctx.shadowBlur=5;
        }else if(p.type==="lanternFx"){
            ctx.fillStyle="#60d0ff";
            ctx.shadowColor="#40a0ff";ctx.shadowBlur=10;
        }else if(p.type==="reaperFx"){
            ctx.fillStyle="#a050e0";
            ctx.shadowColor="#7020c0";ctx.shadowBlur=8;
        }else if(p.type==="trail"||p.type==="spark"){
            ctx.fillStyle=p.color||"#a8ff70";
            ctx.shadowColor=p.color||"#7dff4a";ctx.shadowBlur=4;
        }else{
            ctx.fillStyle="#ffdcb8";
            ctx.shadowBlur=0;
        }
        ctx.beginPath();ctx.arc(p.x,p.y,p.size/2,0,7);ctx.fill();
        ctx.shadowBlur=0;ctx.globalAlpha=1;
    }

    for(const f of floatingTexts){
        ctx.save();ctx.globalAlpha=clamp(f.life/25,0,1);
        ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillStyle="#f6d47d";
        ctx.fillText(f.text,f.x,f.y);ctx.restore();
    }
}

/* HUD */
function updateHP(){
    const el=document.getElementById("hp");el.innerHTML="";
    // слоты слева направо; HP по третям снизу вверх; щит поверх (полный / левая половина)
    for(let i=0;i<player.maxHp;i++){
        const slot=document.createElement("div");
        slot.className="hslot";

        // 1) пустая база
        const base=document.createElement("div");
        base.className="heart base";
        slot.appendChild(base);

        // 2) HP — горизонтальные трети (clip снизу вверх)
        const frac=player.hp-i;
        let hpClip="hp-0";
        if(frac>=0.999) hpClip="hp-full";
        else if(frac>=2/3-0.001) hpClip="hp-2";
        else if(frac>=1/3-0.001) hpClip="hp-1";
        if(hpClip!=="hp-0"){
            const clip=document.createElement("div");
            clip.className="clip "+hpClip;
            const hp=document.createElement("div");
            hp.className="heart hp";
            clip.appendChild(hp);
            slot.appendChild(clip);
        }

        // 3) щит поверх — если половина, справа видно красное HP
        const sFrac=player.shield-i;
        if(sFrac>=0.999){
            const clip=document.createElement("div");
            clip.className="clip sh-full";
            const sh=document.createElement("div");
            sh.className="heart sh";
            clip.appendChild(sh);
            slot.appendChild(clip);
        }else if(sFrac>=0.5-0.001){
            const clip=document.createElement("div");
            clip.className="clip sh-half";
            const sh=document.createElement("div");
            sh.className="heart sh";
            clip.appendChild(sh);
            slot.appendChild(clip);
        }

        el.appendChild(slot);
    }
}

function formatTime(sec){
    sec=Math.floor(Math.max(0,sec));
    const m=Math.floor(sec/60);
    const s=sec%60;
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function updateHUD(){
    document.getElementById("score").textContent="Счёт: "+score;
    document.getElementById("timer").textContent=formatTime(gameTimer);
    const alive=enemies.filter(e=>!e.dead).length;
    const killed=waveTotal-alive;
    document.getElementById("waveProgress").style.width=
        `${clamp(killed/waveTotal*100,0,100)}%`;

    const boss=enemies.find(e=>(e.type==="boss"||e.type==="devil"||e.type==="worm"||e.type==="crystal")&&!e.dead);
    if(boss)document.getElementById("bossHealth").style.width=
        `${clamp(boss.hp/boss.maxHp*100,0,100)}%`;
}

/* GAME FLOW */
function checkWaveComplete(){
    if(waitingForBuff)return;
    if(enemies.some(e=>!e.dead)||spawnQueue.length>0)return;
    if(door.open)return;

    // боссы 10 / 20 / 30 / 31 завершаются в killEnemy
    if(wave===10||wave===20||wave===30||wave===31)return;

    if(wave>=TOTAL_WAVES){winGame();return}

    // открываем дверь в центре верхней стены
    door.open=true;
    door.x=W/2;
    door.y=78+WALL/2;
    door.w=56;
    door.h=28;
    door.green=wave>=10&&wave<20;
    door.yellow=wave>=20&&wave<30;
    door.cyan=false;
    showMessage("ДВЕРЬ ОТКРЫТА");
}

function updateDoor(){
    if(!door.open||!gameRunning)return;
    // игрок заходит в дверь
    if(Math.abs(player.x-door.x)<door.w/2+8 && player.y<door.y+door.h+player.radius+6){
        const next=wave+1;
        door.open=false;
        door.green=false;
        door.yellow=false;
        door.cyan=false;
        bullets=[];enemyBullets=[];particles=[];floatingTexts=[];pickups=[];tearPuddles=[];
        player.x=W/2;
        player.y=H-WALL-player.radius-30;
        player.invincible=40;
        if(next>=31) act=4;
        else if(next>=21) act=3;
        else if(next>=11) act=2;
        startWave(next);
    }
}

function winGame(){

    document.getElementById("pauseBtn").style.display="none";
    document.getElementById("finalTime").textContent=`Время: ${formatTime(gameTimer)}`;

function applyActUITheme(){
    const g=document.getElementById("game");
    g.classList.remove("act2","act3","act4");
    if(act>=4) g.classList.add("act4");
    else if(act>=3) g.classList.add("act3");
    else if(act>=2) g.classList.add("act2");
}

function startGame(mode){
    if(mode==="classic"||mode==="hardcore") gameMode=mode;
    score=0;wave=1;act=1;gameTimer=0;
    // хардкор: 1/3 HP (одно попадание убивает); классика: 3 HP
    player.maxHp=gameMode==="hardcore"?1:3;
    player.hp=gameMode==="hardcore"?1/3:player.maxHp;
    player.x=W/2;
    player.y=H-WALL-player.radius-40;
    player.invincible=0;player.hurtFlash=0;player.slowTimer=0;
    player.hasPill=false;player.hasCookie=false;player.hasEye=false;player.hasCola=false;player.hasMirror=false;player.hasMagnet=false;player.hasHat=false;player.hasTentacle=false;player.hasRubik=false;player.hasSock=false;player.shield=0;
    player.beamActive=false;player.beamDamageTimer=0;
    player.passives={critKill:false,shieldBurst:false,dmgBoost:false,lifesteal:false,dodge:false,speedBoost:false};
    enemies=[];bullets=[];enemyBullets=[];particles=[];floatingTexts=[];pickups=[];spawnQueue=[];tearPuddles=[];
    door.open=false;waitingForBuff=false;waitingForPassive=false;passiveAfterPick=null;paused=false;
    document.getElementById("passivePick").classList.remove("show");
    document.getElementById("gameOver").style.display="none";
    document.getElementById("startScreen").style.display="none";
    document.getElementById("pauseMenu").style.display="none";
    document.getElementById("pauseBtn").style.display="flex";
    document.getElementById("timer").textContent="00:00";
    applyActUITheme();
    gameRunning=true;updateHP();updateHUD();startWave(1);
}

function openPause(){
    if(!gameRunning||paused)return;
    // не открывать поверх game over / start
    if(document.getElementById("gameOver").style.display==="flex")return;
    if(document.getElementById("startScreen").style.display==="flex")return;
    paused=true;
    document.getElementById("pauseMenu").style.display="flex";
}

function closePause(){
    paused=false;
    document.getElementById("pauseMenu").style.display="none";
}

function quitToTitle(){
    paused=false;
    gameRunning=false;
    door.open=false;waitingForBuff=false;
    enemies=[];bullets=[];enemyBullets=[];particles=[];floatingTexts=[];pickups=[];spawnQueue=[];tearPuddles=[];
    document.getElementById("pauseMenu").style.display="none";
    document.getElementById("gameOver").style.display="none";
